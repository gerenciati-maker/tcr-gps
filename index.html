<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ID_ARCHIVO =
    "1zdYovCmbhHOyMVy-huWqzgB6Q5x1XgL8dghe263TTbU";


const ID_BASE_QR =
    "1049929211";


/*
 * NUEVA URL DEL WEB APP
 */
const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwRaqv3bUBUzwJiXfX0yOjQldn51NkNMZiL8OaVw3n4RBCbA0raBqw9heAlbgLLgi3DSQ/exec";


const CODIGO_ADMIN =
    "CENTRAL";


const SERVICIO_CENTRAL =
    "ID-00167 - OFICINAS CENTRALES";


/* =========================================================
   VARIABLES
========================================================= */

let empleados = [];

let servicios =
    new Map();

let personalServicio = [];

let empleadoPersonalActual =
    null;

let servicioActual =
    null;

let empleadoApoyoActual =
    null;

let empleadoAdministrativoActual =
    null;

let ubicacionActual = {

    latitud: null,

    longitud: null,

    precisionGPS: null

};

let registroPendiente =
    null;

let fotoRegistroBase64 =
    "";

let fotoRegistroNombre =
    "";

let enviandoRegistro =
    false;

let consultaCandadoActual =
    0;

let streamCamara =
    null;


/* =========================================================
   INICIO
========================================================= */

window.onload =
function() {

    mostrarEstado(
        "Cargando base de empleados..."
    );

    cargarBaseQR();

};


/* =========================================================
   ESTADO
========================================================= */

function mostrarEstado(
    mensaje,
    tipo = ""
) {

    const elemento =
        document.getElementById(
            "estadoSistema"
        );

    if (!elemento) {
        return;
    }

    elemento.textContent =
        mensaje;

    elemento.className =
        "estado";

    if (
        tipo === "error"
    ) {

        elemento.classList.add(
            "error"
        );

    }

    if (
        tipo === "exito"
    ) {

        elemento.classList.add(
            "exito"
        );

    }

    if (
        tipo === "aviso"
    ) {

        elemento.classList.add(
            "aviso"
        );

    }

}


/* =========================================================
   CARGAR BASE QR DESDE APPS SCRIPT
========================================================= */

function cargarBaseQR() {

    mostrarEstado(
        "Cargando base de empleados..."
    );


    const callbackName =
        "callbackBaseQR_" +
        Date.now();


    let terminado =
        false;


    const script =
        document.createElement(
            "script"
        );


    function limpiar() {

        if (
            script.parentNode
        ) {

            script.parentNode.removeChild(
                script
            );

        }

        try {

            delete window[
                callbackName
            ];

        } catch (e) {

            window[
                callbackName
            ] =
                undefined;

        }

    }


    const temporizador =
        setTimeout(
            function() {

                if (terminado) {
                    return;
                }

                terminado =
                    true;

                limpiar();

                mostrarEstado(
                    "El Apps Script no respondió al cargar BASE QR.",
                    "error"
                );

            },
            15000
        );


    window[
        callbackName
    ] =
    function(data) {

        if (terminado) {
            return;
        }


        terminado =
            true;


        clearTimeout(
            temporizador
        );


        try {

            if (
                !data ||
                data.ok !== true
            ) {

                throw new Error(
                    data &&
                    data.error
                        ? data.error
                        : "No fue posible cargar BASE QR."
                );

            }


            if (
                !Array.isArray(
                    data.empleados
                )
            ) {

                throw new Error(
                    "BASE QR no devolvió empleados."
                );

            }


            empleados =
                data.empleados.filter(
                    function(empleado) {

                        /*
                         * Si existe estatus,
                         * tomamos únicamente ACTIVO.
                         *
                         * Si no existe la columna,
                         * no descartamos el empleado.
                         */

                        const estatus =
                            String(

                                empleado.estatus ||
                                empleado.Estatus ||
                                empleado.ESTATUS ||
                                ""

                            )
                            .trim()
                            .toUpperCase();


                        if (!estatus) {
                            return true;
                        }


                        return (
                            estatus ===
                            "ACTIVO"
                        );

                    }
                );


            if (
                empleados.length === 0
            ) {

                throw new Error(
                    "BASE QR cargó correctamente, pero no se encontraron empleados."
                );

            }


            console.log(
                "Empleados cargados:",
                empleados.length
            );


            construirServicios();


            if (
                servicios.size === 0
            ) {

                throw new Error(
                    "BASE QR cargó, pero no se encontraron servicios."
                );

            }


            limpiar();


            mostrarEstado(
                "Base cargada. Obteniendo ubicación..."
            );


            iniciarSistema();


        } catch (error) {

            console.error(
                error
            );


            limpiar();


            mostrarEstado(
                error.message ||
                "Error al procesar BASE QR.",
                "error"
            );

        }

    };


    const url =
        URL_APPS_SCRIPT +
        "?action=base" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    script.src =
        url;

    script.async =
        true;


    script.onerror =
    function() {

        if (terminado) {
            return;
        }


        terminado =
            true;


        clearTimeout(
            temporizador
        );


        limpiar();


        mostrarEstado(
            "No fue posible conectar con Apps Script.",
            "error"
        );

    };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   CONSTRUIR SERVICIOS
========================================================= */

function construirServicios() {

    servicios.clear();


    empleados.forEach(
        function(empleado) {

            const codigo =
                String(

                    empleado.codigoServicio ||
                    empleado.codigo ||
                    empleado.servicioCodigo ||
                    ""

                ).trim();


            const nombre =
                String(

                    empleado.servicio ||
                    empleado.nombreServicio ||
                    ""

                ).trim();


            if (
                !codigo &&
                !nombre
            ) {

                return;

            }


            const clave =
                codigo ||
                nombre;


            if (
                !servicios.has(
                    clave
                )
            ) {

                servicios.set(
                    clave,
                    {

                        codigoServicio:
                            codigo,

                        servicio:
                            nombre ||
                            codigo,

                        inmueble:
                            empleado.inmueble ||
                            "",

                        ubicacion:
                            empleado.ubicacion ||
                            "",

                        latitud:
                            parseFloat(
                                empleado.latitud
                            ) ||
                            null,

                        longitud:
                            parseFloat(
                                empleado.longitud
                            ) ||
                            null,

                        radio:
                            parseFloat(
                                empleado.radio
                            ) ||
                            200

                    }
                );

            }

        }
    );

}


/* =========================================================
   INICIAR SISTEMA
========================================================= */

function iniciarSistema() {

    mostrarEstado(
        "Base cargada. Obteniendo ubicación..."
    );

    obtenerGPS();

}


/* =========================================================
   GPS
========================================================= */

function obtenerGPS() {

    if (
        !navigator.geolocation
    ) {

        mostrarEstado(
            "Este dispositivo no permite obtener ubicación.",
            "error"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            ubicacionActual.latitud =
                position.coords.latitude;

            ubicacionActual.longitud =
                position.coords.longitude;

            ubicacionActual.precisionGPS =
                position.coords.accuracy;


            document.getElementById(
                "gpsServicio"
            ).textContent =

                ubicacionActual.latitud
                    .toFixed(6) +

                ", " +

                ubicacionActual.longitud
                    .toFixed(6);


            identificarServicio();

        },


        function(error) {

            console.error(
                error
            );


            mostrarEstado(
                "No fue posible obtener GPS. Activa la ubicación del dispositivo.",
                "error"
            );

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                15000,

            maximumAge:
                0

        }

    );

}


/* =========================================================
   IDENTIFICAR SERVICIO
========================================================= */

function identificarServicio() {

    let servicioMasCercano =
        null;

    let distanciaMenor =
        Infinity;


    servicios.forEach(
        function(servicio) {

            if (
                servicio.latitud ===
                    null ||

                servicio.longitud ===
                    null
            ) {

                return;

            }


            const distancia =
                calcularDistancia(

                    ubicacionActual.latitud,

                    ubicacionActual.longitud,

                    servicio.latitud,

                    servicio.longitud

                );


            if (

                distancia <
                (servicio.radio || 200)

                &&

                distancia <
                distanciaMenor

            ) {

                distanciaMenor =
                    distancia;

                servicioMasCercano =
                    servicio;

            }

        }
    );


    if (
        !servicioMasCercano
    ) {

        mostrarEstado(
            "No se identificó un servicio en esta ubicación.",
            "error"
        );

        return;

    }


    entrarAlServicio(
        servicioMasCercano
    );

}


/* =========================================================
   DISTANCIA GPS
========================================================= */

function calcularDistancia(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;


    const rad =
        Math.PI /
        180;


    const dLat =
        (lat2 - lat1) *
        rad;


    const dLon =
        (lon2 - lon1) *
        rad;


    const a =
        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            lat1 * rad
        )

        *

        Math.cos(
            lat2 * rad
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1 - a
            )

        );


    return R * c;

}


/* =========================================================
   ENTRAR AL SERVICIO
========================================================= */

function entrarAlServicio(
    servicio
) {

    servicioActual =
        servicio;


    document.getElementById(
        "nombreServicio"
    ).textContent =
        servicio.servicio ||
        "-";


    document.getElementById(
        "inmuebleServicio"
    ).textContent =
        servicio.inmueble ||
        "-";


    document.getElementById(
        "ubicacionServicio"
    ).textContent =
        servicio.ubicacion ||
        "-";


    document.getElementById(
        "gpsServicio"
    ).textContent =

        ubicacionActual.latitud
            .toFixed(6) +

        ", " +

        ubicacionActual.longitud
            .toFixed(6);


    ocultarTodasLasTarjetas();


    document.getElementById(
        "cardServicio"
    ).classList.remove(
        "oculto"
    );


    mostrarEstado(
        "Servicio identificado correctamente.",
        "exito"
    );

}

========================================================= */

function seleccionarPersonal() {

    ocultarTodasLasTarjetas();


    document.getElementById(
        "cardPersonal"

}


function cargarPersonalPorPuesto() {

    const puesto =
        document.getElementById(
            "puestoPersonal"
        ).val
