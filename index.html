<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Torre de Control - Registro QR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #071a33;
      color: #ffffff;
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .encabezado {
      text-align: center;
      padding: 20px 10px;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .encabezado p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .tarjeta {
      background: #ffffff;
      color: #172033;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    .titulo {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .dato {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .dato strong {
      display: block;
      color: #334155;
      margin-bottom: 3px;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-principal {
      background: #0b4ea2;
      color: #ffffff;
    }

    .btn-entrada {
      background: #15803d;
      color: #ffffff;
    }

    .btn-salida {
      background: #b45309;
      color: #ffffff;
    }

    .btn-secundario {
      background: #475569;
      color: #ffffff;
    }

    .mensaje {
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .mensaje.info {
      background: #dbeafe;
      color: #1e3a8a;
      display: block;
    }

    .mensaje.exito {
      background: #dcfce7;
      color: #166534;
      display: block;
    }

    .mensaje.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .mensaje.aviso {
      background: #fef3c7;
      color: #92400e;
      display: block;
    }

    .registro-guardia {
      display: none;
    }

    .estado-ciclo {
      text-align: center;
      padding: 18px;
      border-radius: 14px;
      background: #eff6ff;
      color: #1e3a8a;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .estado-ciclo strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .foto-preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
      display: none;
    }

    #video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      display: none;
      margin-top: 10px;
    }

    .oculto {
      display: none !important;
    }

    .cargando {
      text-align: center;
      color: #64748b;
      padding: 15px;
    }

    .separador {
      height: 1px;
      background: #e2e8f0;
      margin: 18px 0;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>TORRE DE CONTROL</h1>
    <p>Registro de asistencia QR</p>
  </div>


  <!-- =====================================================
       MENSAJES
  ====================================================== -->

  <div id="mensaje" class="mensaje"></div>


  <!-- =====================================================
       SERVICIO
  ====================================================== -->

  <div class="tarjeta">

    <div class="titulo">
      Servicio
    </div>

    <div id="estadoServicio" class="cargando">
      Identificando servicio...
    </div>

    <div id="datosServicio" class="oculto">

      <div class="dato">
        <strong>Servicio</strong>
        <span id="textoServicio">-</span>
      </div>

      <div class="dato">
        <strong>Inmueble</strong>
        <span id="textoInmueble">-</span>
      </div>

    </div>

  </div>


  <!-- =====================================================
       PERSONAL
  ====================================================== -->

  <div class="tarjeta">

    <div class="titulo">
      Registro de personal
    </div>

    <div class="dato">

      <strong>Posición</strong>

      <select id="posicion" onchange="cambioPosicion()">

        <option value="">
          Selecciona una posición
        </option>

        <option value="GUARDIA">
          GUARDIA
        </option>

        <option value="MONITORISTA">
          MONITORISTA
        </option>

        <option value="ERI">
          ERI
        </option>

        <option value="ADMINISTRATIVO">
          ADMINISTRATIVO
        </option>

        <option value="SUPERVISOR">
          SUPERVISOR
        </option>

      </select>

    </div>


    <!-- PERSONAL -->

    <div id="campoPersonal" class="oculto">

      <div class="dato">

        <strong>Personal</strong>

        <select id="empleado" onchange="seleccionarEmpleado()">

          <option value="">
            Selecciona una persona
          </option>

        </select>

      </div>

    </div>


    <!-- APOYO -->

    <div id="campoApoyo" class="oculto">

      <div class="dato">

        <strong>Número de empleado</strong>

        <input
          id="numeroApoyo"
          type="text"
          placeholder="Número de empleado"
        >

      </div>

      <button
        class="btn-principal"
        onclick="buscarApoyo()"
      >
        BUSCAR
      </button>

    </div>


    <!-- ADMINISTRATIVO -->

    <div id="campoAdministrativo" class="oculto">

      <div class="dato">

        <strong>Número de empleado</strong>

        <input
          id="numeroAdministrativo"
          type="text"
          placeholder="Número de empleado"
        >

      </div>

      <button
        class="btn-principal"
        onclick="buscarAdministrativo()"
      >
        BUSCAR
      </button>

    </div>

  </div>


  <!-- =====================================================
       CICLO GUARDIA
  ====================================================== -->

  <div
    id="panelCicloGuardia"
    class="tarjeta registro-guardia"
  >

    <div
      id="estadoCiclo"
      class="estado-ciclo"
    >
      <strong id="tituloCiclo">
        Validando registro...
      </strong>

      <span id="textoCiclo">
        Espere un momento.
      </span>
    </div>


    <button
      id="btnRegistroCiclo"
      class="btn-entrada"
      onclick="continuarRegistro()"
    >
      REGISTRAR ENTRADA
    </button>

  </div>


  <!-- =====================================================
       REGISTRO
  ====================================================== -->

  <div
    id="panelRegistro"
    class="tarjeta oculto"
  >

    <div class="titulo">
      Registro
    </div>


    <div class="dato">

      <strong>Nombre</strong>

      <span id="registroNombre">-</span>

    </div>


    <div class="dato">

      <strong>Número de empleado</strong>

      <span id="registroNumero">-</span>

    </div>


    <div class="dato">

      <strong>Posición</strong>

      <span id="registroPosicion">-</span>

    </div>


    <div class="dato">

      <strong>Tipo de registro</strong>

      <select id="tipoRegistro">

        <option value="ENTRADA">
          ENTRADA
        </option>

        <option value="SALIDA">
          SALIDA
        </option>

      </select>

    </div>


    <div class="separador"></div>


    <!-- =====================================================
         CÁMARA
    ====================================================== -->

    <div class="dato">

      <strong>Fotografía</strong>

      <button
        class="btn-secundario"
        onclick="abrirCamara()"
        type="button"
      >
        TOMAR FOTOGRAFÍA
      </button>

      <video
        id="video"
        autoplay
        playsinline
      ></video>

      <button
        id="btnCapturar"
        class="btn-principal oculto"
        onclick="capturarFoto()"
        type="button"
      >
        CAPTURAR
      </button>

      <canvas
        id="canvas"
        class="oculto"
      ></canvas>

      <img
        id="fotoPreview"
        class="foto-preview"
        alt="Fotografía"
      >

    </div>


    <button
      id="btnEnviar"
      class="btn-principal"
      onclick="enviarRegistro()"
    >
      REGISTRAR
    </button>


    <button
      class="btn-secundario"
      onclick="cancelarRegistro()"
    >
      CANCELAR
    </button>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwRaqv3bUBUzwJiXfX0yOjQldn51NkNMZiL8OaVw3n4RBCbA0raBqw9heAlbgLLgi3DSQ/exec";


/* =========================================================
   VARIABLES
========================================================= */

let baseQR = [];

let servicioSeleccionado = null;

let empleadoSeleccionado = null;

let siguienteRegistroGuardia = null;

let candadoValidado = false;

let consultaCandadoActual = 0;

let streamCamara = null;

let fotoBase64 = "";

let posicionActual = "";


/* =========================================================
   INICIO
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    cargarBaseQR();

  }
);


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
  texto,
  tipo
) {

  const elemento =
    document.getElementById("mensaje");

  elemento.className =
    "mensaje " + tipo;

  elemento.innerHTML = texto;

}


function ocultarMensaje() {

  const elemento =
    document.getElementById("mensaje");

  elemento.className =
    "mensaje";

  elemento.innerHTML = "";

}


/* =========================================================
   CARGAR BASE
========================================================= */

function cargarBaseQR() {

  const callback =
    "callbackBaseQR_" +
    Date.now();

  window[callback] =
    function(respuesta) {

      try {

        if (
          !respuesta ||
          !respuesta.ok
        ) {

          throw new Error(
            respuesta &&
            respuesta.error
              ? respuesta.error
              : "No fue posible cargar la base."
          );

        }

        baseQR =
          respuesta.empleados || [];

        identificarServicio();

      } catch(error) {

        mostrarMensaje(
          "No fue posible cargar la información de servicios.<br><br>" +
          error.message,
          "error"
        );

      } finally {

        try {
          delete window[callback];
        } catch(e) {}

      }

    };


  const script =
    document.createElement("script");

  script.src =
    URL_APPS_SCRIPT +
    "?action=base" +
    "&callback=" +
    callback +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      mostrarMensaje(
        "No es posible conectar con App Script.",
        "error"
      );

      try {
        delete window[callback];
      } catch(e) {}

    };


  document.head.appendChild(script);

}


/* =========================================================
   IDENTIFICAR SERVICIO
========================================================= */

function identificarServicio() {

  const parametros =
    new URLSearchParams(
      window.location.search
    );

  const codigoURL =
    (
      parametros.get("servicio") || ""
    )
    .trim()
    .toUpperCase();


  /*
   * Si viene servicio por URL,
   * buscarlo directamente.
   */

  if (codigoURL) {

    const encontrados =
      baseQR.filter(function(item) {

        const codigo =
          String(
            item.codigoServicio || ""
          )
          .trim()
          .toUpperCase();

        const servicio =
          String(
            item.servicio || ""
          )
          .trim()
          .toUpperCase();

        return (
          codigo === codigoURL ||
          servicio === codigoURL
        );

      });


    if (encontrados.length > 0) {

      seleccionarServicio(
        encontrados[0]
      );

      return;
    }

  }


  /*
   * Si no viene identificado,
   * utilizar GPS.
   */

  obtenerUbicacion();

}


/* =========================================================
   GPS
========================================================= */

function obtenerUbicacion() {

  const estado =
    document.getElementById(
      "estadoServicio"
    );

  estado.innerHTML =
    "Obteniendo ubicación...";


  if (!navigator.geolocation) {

    estado.innerHTML =
      "El dispositivo no permite obtener ubicación.";

    mostrarMensaje(
      "Este dispositivo no permite obtener ubicación GPS.",
      "error"
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      encontrarServicioPorGPS(
        lat,
        lon
      );

    },

    function(error) {

      estado.innerHTML =
        "No fue posible obtener la ubicación.";

      mostrarMensaje(
        "No fue posible obtener tu ubicación GPS.",
        "error"
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =========================================================
   SERVICIO POR GPS
========================================================= */

function encontrarServicioPorGPS(
  lat,
  lon
) {

  let mejor = null;

  let menorDistancia =
    Infinity;


  baseQR.forEach(
    function(item) {

      const latServicio =
        parseFloat(item.latitud);

      const lonServicio =
        parseFloat(item.longitud);

      const radio =
        parseFloat(item.radio);


      if (
        isNaN(latServicio) ||
        isNaN(lonServicio) ||
        isNaN(radio)
      ) {
        return;
      }


      const distancia =
        calcularDistancia(
          lat,
          lon,
          latServicio,
          lonServicio
        );


      if (
        distancia <= radio &&
        distancia < menorDistancia
      ) {

        menorDistancia =
          distancia;

        mejor =
          item;

      }

    }
  );


  if (!mejor) {

    document.getElementById(
      "estadoServicio"
    ).innerHTML =
      "No se encontró un servicio dentro del radio permitido.";

    mostrarMensaje(
      "No se encontró un servicio dentro del radio permitido.",
      "error"
    );

    return;
  }


  seleccionarServicio(
    mejor
  );

}


/* =========================================================
   DISTANCIA GPS
========================================================= */

function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const dLat =
    gradosARadianes(
      lat2 - lat1
    );

  const dLon =
    gradosARadianes(
      lon2 - lon1
    );


  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      gradosARadianes(lat1)
    ) *

    Math.cos(
      gradosARadianes(lat2)
    ) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


function gradosARadianes(grados) {

  return grados *
    Math.PI /
    180;

}


/* =========================================================
   SELECCIONAR SERVICIO
========================================================= */

function seleccionarServicio(
  servicio
) {

  servicioSeleccionado =
    servicio;


  document.getElementById(
    "estadoServicio"
  ).innerHTML =
    "Servicio identificado";


  document.getElementById(
    "datosServicio"
  ).classList.remove(
    "oculto"
  );


  document.getElementById(
    "textoServicio"
  ).textContent =
    servicio.servicio || "-";


  document.getElementById(
    "textoInmueble"
  ).textContent =
    servicio.inmueble || "-";


  mostrarMensaje(
    "Servicio identificado correctamente.",
    "exito"
  );

}


/* =========================================================
   CAMBIO DE POSICIÓN
========================================================= */

function cambioPosicion() {

  const posicion =
    document.getElementById(
      "posicion"
    ).value
    .trim()
    .toUpperCase();


  posicionActual =
    posicion;


  empleadoSeleccionado =
    null;

  candadoValidado =
    false;

  siguienteRegistroGuardia =
    null;


  document.getElementById(
    "campoPersonal"
  ).classList.add(
    "oculto"
  );


  document.getElementById(
    "campoApoyo"
  ).classList.add(
    "oculto"
  );


  document.getElementById(
    "campoAdministrativo"
  ).classList.add(
    "oculto"
  );


  document.getElementById(
    "panelCicloGuardia"
  ).classList.add(
    "oculto"
  );


  document.getElementById(
    "panelRegistro"
  ).classList.add(
    "oculto"
  );


  if (!posicion) {
    return;
  }


  /*
   * GUARDIA / MONITORISTA / ERI
   */

  if (
    posicion === "GUARDIA" ||
    posicion === "MONITORISTA" ||
    posicion === "ERI"
  ) {

    cargarPersonalPorPosicion(
      posicion
    );

    document.getElementById(
      "campoPersonal"
    ).classList.remove(
      "oculto"
    );

    return;
  }


  /*
   * ADMINISTRATIVO / SUPERVISOR
   */

  document.getElementById(
    "campoAdministrativo"
  ).classList.remove(
    "oculto"
  );

}


/* =========================================================
   CARGAR PERSONAL
========================================================= */

function cargarPersonalPorPosicion(
  posicion
) {

  const select =
    document.getElementById(
      "empleado"
    );


  select.innerHTML =
    '<option value="">Selecciona una persona</option>';


  const personas =
    baseQR.filter(
      function(item) {

        const p =
          String(
            item.posicion || ""
          )
          .trim()
          .toUpperCase();


        return p === posicion;

      }
    );


  personas.forEach(
    function(persona, index) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        (
          persona.nombre ||
          "SIN NOMBRE"
        ) +
        " - " +
        (
          persona.numeroEmpleado ||
          "SIN NÚMERO"
        );


      option.dataset.persona =
        JSON.stringify(
          persona
        );


      select.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   SELECCIONAR EMPLEADO
========================================================= */

function seleccionarEmpleado() {

  const select =
    document.getElementById(
      "empleado"
    );


  const option =
    select.options[
      select.selectedIndex
    ];


  if (
    !option ||
    !option.dataset.persona
  ) {

    return;
  }


  empleadoSeleccionado =
    JSON.parse(
      option.dataset.persona
    );


  posicionActual =
    String(
      empleadoSeleccionado.posicion ||
      ""
    )
    .trim()
    .toUpperCase();


  /*
   * AQUÍ ESTÁ EL CAMBIO IMPORTANTE:
   *
   * El candado únicamente se consulta
   * para GUARDIA.
   */

  if (
    posicionActual === "GUARDIA"
  ) {

    consultarCandadoGuardia();

  } else {

    abrirRegistroNormal();

  }

}


/* =========================================================
   CANDADO GUARDIA
========================================================= */

function consultarCandadoGuardia() {

  if (
    !empleadoSeleccionado ||
    !empleadoSeleccionado.numeroEmpleado
  ) {

    return;
  }


  const numero =
    String(
      empleadoSeleccionado.numeroEmpleado
    ).trim();


  const posicion =
    "GUARDIA";


  const consulta =
    ++consultaCandadoActual;


  candadoValidado =
    false;


  siguienteRegistroGuardia =
    null;


  document.getElementById(
    "panelCicloGuardia"
  ).classList.remove(
    "oculto"
  );


  document.getElementById(
    "panelRegistro"
  ).classList.add(
    "oculto"
  );


  document.getElementById(
    "tituloCiclo"
  ).textContent =
    "Validando registro...";


  document.getElementById(
    "textoCiclo"
  ).textContent =
    "Consultando tu último registro.";


  const callback =
    "callbackCandado_" +
    Date.now();


  window[callback] =
    function(respuesta) {

      /*
       * Evita que una respuesta vieja
       * sobrescriba una consulta nueva.
       */

      if (
        consulta !==
        consultaCandadoActual
      ) {

        try {
          delete window[callback];
        } catch(e) {}

        return;
      }


      try {

        if (
          !respuesta ||
          !respuesta.ok
        ) {

          throw new Error(
            respuesta &&
            respuesta.error
              ? respuesta.error
              : "No fue posible validar el registro."
          );

        }


        siguienteRegistroGuardia =
          String(
            respuesta.siguienteRegistro ||
            ""
          )
          .trim()
          .toUpperCase();


        candadoValidado =
          true;


        mostrarEstadoGuardia(
          respuesta
        );


      } catch(error) {

        mostrarMensaje(
          error.message,
          "error"
        );

        document.getElementById(
          "tituloCiclo"
        ).textContent =
          "No fue posible validar";


        document.getElementById(
          "textoCiclo"
        ).textContent =
          error.message;

      } finally {

        try {
          delete window[callback];
        } catch(e) {}

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    URL_APPS_SCRIPT +
    "?action=validar" +
    "&numero=" +
    encodeURIComponent(numero) +
    "&posicion=GUARDIA" +
    "&callback=" +
    callback +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      if (
        consulta !==
        consultaCandadoActual
      ) {
        return;
      }


      mostrarMensaje(
        "No es posible conectar con App Script.",
        "error"
      );


      document.getElementById(
        "tituloCiclo"
      ).textContent =
        "Sin conexión";


      document.getElementById(
        "textoCiclo"
      ).textContent =
        "No fue posible consultar tu último registro.";

    };


  document.head.appendChild(
    script
  );

}


/* =========================================================
   MOSTRAR ESTADO GUARDIA
========================================================= */

function mostrarEstadoGuardia(
  respuesta
) {

  const siguiente =
    String(
      respuesta.siguienteRegistro ||
      ""
    )
    .trim()
    .toUpperCase();


  const titulo =
    document.getElementById(
      "tituloCiclo"
    );


  const texto =
    document.getElementById(
      "textoCiclo"
    );


  const boton =
    document.getElementById(
      "btnRegistroCiclo"
    );


  /*
   * GUARDIA SIN REGISTRO ABIERTO
   */

  if (
    siguiente === "ENTRADA"
  ) {

    titulo.textContent =
      "Listo para registrar";


    texto.textContent =
      "Puedes registrar tu entrada.";


    boton.textContent =
      "REGISTRAR ENTRADA";


    boton.className =
      "btn-entrada";


    return;
  }


  /*
   * GUARDIA CON ENTRADA ABIERTA
   */

  if (
    siguiente === "SALIDA"
  ) {

    titulo.textContent =
      "Ya registraste tu entrada";


    texto.textContent =
      "Tienes pendiente tu salida.";


    boton.textContent =
      "REGISTRAR SALIDA";


    boton.className =
      "btn-salida";


    return;
  }


  /*
   * CUALQUIER OTRO CASO
   */

  titulo.textContent =
    "Registro disponible";


  texto.textContent =
    "Puedes continuar con tu registro.";


  boton.textContent =
    "REGISTRAR";


  boton.className =
    "btn-principal";

}


/* =========================================================
   CONTINUAR REGISTRO GUARDIA
========================================================= */

function continuarRegistro() {

  if (
    !candadoValidado
  ) {

    mostrarMensaje(
      "Espera a que termine la validación.",
      "aviso"
    );

    return;
  }


  if (
    !empleadoSeleccionado
  ) {

    mostrarMensaje(
      "Selecciona primero al empleado.",
      "error"
    );

    return;
  }


  /*
   * El tipo lo determina el candado.
   */

  if (
    posicionActual === "GUARDIA"
  ) {

    if (
      siguienteRegistroGuardia ===
      "ENTRADA"
    ) {

      document.getElementById(
        "tipoRegistro"
      ).value =
        "ENTRADA";

    }

    else if (
      siguienteRegistroGuardia ===
      "SALIDA"
    ) {

      document.getElementById(
        "tipoRegistro"
      ).value =
        "SALIDA";

    }

  }


  abrirRegistroNormal();

}


/* =========================================================
   ABRIR REGISTRO
========================================================= */

function abrirRegistroNormal() {

  if (
    !empleadoSeleccionado
  ) {

    mostrarMensaje(
      "Selecciona un empleado.",
      "error"
    );

    return;
  }


  document.getElementById(
    "panelRegistro"
  ).classList.remove(
    "oculto"
  );


  /*
   * Para GUARDIA no permitimos cambiar
   * manualmente ENTRADA/SALIDA.
   */

  const selectTipo =
    document.getElementById(
      "tipoRegistro"
    );


  if (
    posicionActual === "GUARDIA"
  ) {

    selectTipo.disabled =
      true;

  } else {

    selectTipo.disabled =
      false;

  }


  document.getElementById(
    "registroNombre"
  ).textContent =
    empleadoSeleccionado.nombre ||
    "-";


  document.getElementById(
    "registroNumero"
  ).textContent =
    empleadoSeleccionado.numeroEmpleado ||
    "-";


  document.getElementById(
    "registroPosicion"
  ).textContent =
    empleadoSeleccionado.posicion ||
    posicionActual ||
    "-";


  window.scrollTo({
    top:
      document.getElementById(
        "panelRegistro"
      ).offsetTop - 10,

    behavior:
      "smooth"
  });

}


/* =========================================================
   APOYO
========================================================= */

function buscarApoyo() {

  const numero =
    document.getElementById(
      "numeroApoyo"
    ).value.trim();


  if (!numero) {

    mostrarMensaje(
      "Captura el número de empleado.",
      "error"
    );

    return;
  }


  const encontrado =
    baseQR.find(
      function(item) {

        return String(
          item.numeroEmpleado || ""
        ).trim() === numero;

      }
    );


  if (!encontrado) {

    mostrarMensaje(
      "No se encontró el empleado.",
      "error"
    );

    return;
  }


  empleadoSeleccionado =
    encontrado;


  posicionActual =
    String(
      encontrado.posicion || ""
    )
    .trim()
    .toUpperCase();


  abrirRegistroNormal();

}


/* =========================================================
   ADMINISTRATIVO / SUPERVISOR
========================================================= */

function buscarAdministrativo() {

  const numero =
    document.getElementById(
      "numeroAdministrativo"
    ).value.trim();


  if (!numero) {

    mostrarMensaje(
      "Captura el número de empleado.",
      "error"
    );

    return;
  }


  const encontrado =
    baseQR.find(
      function(item) {

        return String(
          item.numeroEmpleado || ""
        ).trim() === numero;

      }
    );


  if (!encontrado) {

    mostrarMensaje(
      "No se encontró el empleado.",
      "error"
    );

    return;
  }


  empleadoSeleccionado =
    encontrado;


  posicionActual =
    String(
      encontrado.posicion || ""
    )
    .trim()
    .toUpperCase();


  abrirRegistroNormal();

}


/* =========================================================
   CÁMARA
========================================================= */

async function abrirCamara() {

  try {

    streamCamara =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      streamCamara;


    video.style.display =
      "block";


    document.getElementById(
      "btnCapturar"
    ).classList.remove(
      "oculto"
    );


  } catch(error) {

    mostrarMensaje(
      "No fue posible abrir la cámara.",
      "error"
    );

  }

}


/* =========================================================
   CAPTURAR FOTO
========================================================= */

function capturarFoto() {

  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const preview =
    document.getElementById(
      "fotoPreview"
    );


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const contexto =
    canvas.getContext(
      "2d"
    );


  contexto.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  fotoBase64 =
    canvas.toDataURL(
      "image/jpeg",
      .85
    );


  preview.src =
    fotoBase64;


  preview.style.display =
    "block";


  detenerCamara();

}


/* =========================================================
   DETENER CÁMARA
========================================================= */

function detenerCamara() {

  if (
    streamCamara
  ) {

    streamCamara
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


    streamCamara =
      null;

  }


  document.getElementById(
    "video"
  ).style.display =
    "none";


  document.getElementById(
    "btnCapturar"
  ).classList.add(
    "oculto"
  );

}


/* =========================================================
   ENVIAR REGISTRO
========================================================= */

function enviarRegistro() {

  if (
    !empleadoSeleccionado
  ) {

    mostrarMensaje(
      "No hay empleado seleccionado.",
      "error"
    );

    return;
  }


  let tipo =
    document.getElementById(
      "tipoRegistro"
    ).value;


  /*
   * Para GUARDIA el servidor
   * y el candado determinan el tipo.
   */

  if (
    posicionActual === "GUARDIA"
  ) {

    tipo =
      siguienteRegistroGuardia;

  }


  if (
    tipo !== "ENTRADA" &&
    tipo !== "SALIDA"
  ) {

    mostrarMensaje(
      "No fue posible determinar el tipo de registro.",
      "error"
    );

    return;
  }


  const boton =
    document.getElementById(
      "btnEnviar"
    );


  boton.disabled =
    true;


  boton.textContent =
    "GUARDANDO...";


  /*
   * Obtener GPS al momento del registro.
   */

  obtenerGPSParaRegistro(
    function(gps) {

      const datos = {

        nombre:
          empleadoSeleccionado.nombre ||
          "",

        numeroEmpleado:
          empleadoSeleccionado.numeroEmpleado ||
          "",

        servicio:
          servicioSeleccionado
            ? servicioSeleccionado.servicio
            : "",

        tipoRegistro:
          tipo,

        posicion:
          posicionActual,

        latitud:
          gps.latitud,

        longitud:
          gps.longitud,

        precisionGPS:
          gps.precisionGPS,

        servicioDetectado:
          servicioSeleccionado
            ? servicioSeleccionado.servicio
            : "",

        servicioOrigen:
          servicioSeleccionado
            ? servicioSeleccionado.codigoServicio
            : "",

        foto:
          fotoBase64 || ""

      };


      enviarDatosAppsScript(
        datos,
        boton
      );

    }
  );

}


/* =========================================================
   GPS PARA REGISTRO
========================================================= */

function obtenerGPSParaRegistro(
  callback
) {

  if (
    !navigator.geolocation
  ) {

    callback({
      latitud: "",
      longitud: "",
      precisionGPS: ""
    });

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      callback({

        latitud:
          position.coords.latitude,

        longitud:
          position.coords.longitude,

        precisionGPS:
          position.coords.accuracy

      });

    },

    function() {

      callback({

        latitud: "",
        longitud: "",
        precisionGPS: ""

      });

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =========================================================
   ENVIAR A APPS SCRIPT
========================================================= */

function enviarDatosAppsScript(
  datos,
  boton
) {

  fetch(
    URL_APPS_SCRIPT,
    {
      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(datos)

    }
  )
  .then(
    function() {

      /*
       * Con no-cors no podemos leer
       * la respuesta del servidor.
       *
       * El Apps Script ya recibió el POST.
       */

      mostrarMensaje(
        "Registro enviado correctamente.",
        "exito"
      );


      boton.disabled =
        false;


      boton.textContent =
        "REGISTRAR";


      detenerCamara();


      /*
       * IMPORTANTE:
       *
       * Después de registrar:
       *
       * GUARDIA ENTRADA
       *      ↓
       * consultar nuevamente
       *      ↓
       * SALIDA
       *
       * GUARDIA SALIDA
       *      ↓
       * consultar nuevamente
       *      ↓
       * ENTRADA
       */

      if (
        posicionActual ===
        "GUARDIA"
      ) {

        setTimeout(
          function() {

            consultarCandadoGuardia();

          },
          700
        );

      } else {

        limpiarRegistro();

      }

    }
  )
  .catch(
    function(error) {

      mostrarMensaje(
        "No fue posible enviar el registro.",
        "error"
      );


      boton.disabled =
        false;


      boton.textContent =
        "REGISTRAR";

    }
  );

}


/* =========================================================
   CANCELAR
========================================================= */

function cancelarRegistro() {

  detenerCamara();

  limpiarRegistro();

}


/* =========================================================
   LIMPIAR REGISTRO
========================================================= */

function limpiarRegistro() {

  empleadoSeleccionado =
    null;


  fotoBase64 =
    "";


  document.getElementById(
    "panelRegistro"
  ).classList.add(
    "oculto"
  );


  document.getElementById(
    "fotoPreview"
  ).style.display =
    "none";


  document.getElementById(
    "fotoPreview"
  ).src =
    "";


  document.getElementById(
    "tipoRegistro"
  ).disabled =
    false;

}

</script>
