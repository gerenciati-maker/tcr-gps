<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro Torre de Control</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
    }

    .contenedor {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
    }

    .dato {
        background: #f1f3f5;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 12px;
    }

    .dato strong {
        display: block;
        margin-bottom: 5px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 6px;
    }

    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        background: white;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #198754;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    .tipo {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .tipo button {
        margin-top: 0;
        background: #6c757d;
    }

    .tipo button:hover {
        background: #495057;
    }

    .mensaje {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }

    .oculto {
        display: none;
    }

    .origen {
        background: #fff3cd;
        border: 1px solid #ffe69c;
        padding: 12px;
        border-radius: 8px;
        margin-top: 15px;
    }
</style>

</head>

<body>

<div class="contenedor">

    <h1>Registro de Personal</h1>

    <div class="dato">
        <strong>Servicio donde registra:</strong>
        <span id="servicioTexto">Cargando base...</span>
    </div>

    <div class="dato">
        <strong>Ubicación:</strong>
        <span id="ubicacion">Validando GPS...</span>
    </div>

    <!-- SECCIÓN TIPO DE REGISTRO -->

    <div id="seleccionTipo" class="oculto">

        <label>Tipo de registro:</label>

        <div class="tipo">

            <button onclick="seleccionarTipo('PERSONAL')">
                PERSONAL DEL SERVICIO
            </button>

            <button onclick="seleccionarTipo('APOYO')">
                APOYO
            </button>

        </div>

    </div>


    <!-- SECCIÓN PERSONAL DEL SERVICIO -->

    <div id="seccionPersonal" class="oculto">

        <div class="dato">
            <strong>Tipo:</strong>
            PERSONAL DEL SERVICIO
        </div>

        <label for="nombrePersonal">Nombre</label>

        <select id="nombrePersonal" onchange="actualizarNumeroPersonal()">
            <option value="">Selecciona tu nombre</option>
        </select>


        <label for="numeroPersonal">Número de empleado</label>

        <select id="numeroPersonal">
            <option value="">Selecciona tu número</option>
        </select>


        <button onclick="continuarPersonal()">
            CONTINUAR
        </button>

    </div>


    <!-- SECCIÓN APOYO -->

    <div id="seccionApoyo" class="oculto">

        <div class="dato">
            <strong>Tipo:</strong>
            APOYO
        </div>

        <label for="nombreApoyo">Nombre</label>

        <select id="nombreApoyo" onchange="actualizarApoyo()">
            <option value="">Selecciona tu nombre</option>
        </select>


        <label for="numeroApoyo">Número de empleado</label>

        <select id="numeroApoyo">
            <option value="">Selecciona tu número</option>
        </select>


        <div class="origen">

            <strong>Servicio de origen:</strong>

            <span id="servicioOrigen">-</span>

        </div>


        <button onclick="continuarApoyo()">
            CONTINUAR
        </button>

    </div>


    <div id="mensaje" class="mensaje"></div>

</div>


<script>

/* ============================================================
   BASE DE PERSONAL - GOOGLE SHEETS
   ============================================================ */

const URL_BASE_QR =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSde0lhh-i84we-Q36h-rW1VWSV9IcKkZyKJoPkaV7Uvst0_MGL9D7MXsR2SF6n4gqBVtC0_aqga82_/pub?gid=1356101945&single=true&output=csv";

let empleados = [];

let codigoServicio = "";

let personalServicio = [];


/* ============================================================
   LECTOR CSV
   Respeta comas dentro de campos como Coordenadas
   ============================================================ */

function analizarCSV(texto) {

    const filas = [];

    let fila = [];

    let campo = "";

    let dentroComillas = false;


    for (let i = 0; i < texto.length; i++) {

        const caracter = texto[i];

        const siguiente = texto[i + 1];


        if (caracter === '"' && dentroComillas && siguiente === '"') {

            campo += '"';

            i++;

        }

        else if (caracter === '"') {

            dentroComillas = !dentroComillas;

        }

        else if (caracter === "," && !dentroComillas) {

            fila.push(campo);

            campo = "";

        }

        else if ((caracter === "\n" || caracter === "\r") && !dentroComillas) {

            if (caracter === "\r" && siguiente === "\n") {
                i++;
            }

            fila.push(campo);

            campo = "";

            if (fila.some(valor => valor.trim() !== "")) {

                filas.push(fila);

            }

            fila = [];

        }

        else {

            campo += caracter;

        }

    }


    if (campo !== "" || fila.length > 0) {

        fila.push(campo);

        if (fila.some(valor => valor.trim() !== "")) {

            filas.push(fila);

        }

    }


    return filas;

}


/* ============================================================
   CARGAR BASE_QR
   ============================================================ */

async function cargarBaseQR() {

    try {

        document.getElementById("servicioTexto").textContent =
            "Cargando personal...";


        const respuesta = await fetch(URL_BASE_QR + "&t=" + Date.now());


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo consultar la base de Google Sheets."
            );

        }


        const texto = await respuesta.text();


        const filas = analizarCSV(texto);


        if (filas.length < 2) {

            throw new Error(
                "La BASE_QR no contiene registros."
            );

        }


        const encabezados = filas[0].map(
            encabezado => encabezado.trim()
        );


        const indiceNombre =
            encabezados.indexOf("Nombre");

        const indiceNumero =
            encabezados.indexOf("No. empleado");

        const indiceServicio =
            encabezados.indexOf("Servicio");

        const indiceCodigo =
            encabezados.indexOf("Código servicio");

        const indiceCoordenadas =
            encabezados.indexOf("Coordenadas");

        const indiceRango =
            encabezados.indexOf("Rango");

        const indiceEstatus =
            encabezados.indexOf("Estatus");


        if (
            indiceNombre === -1 ||
            indiceNumero === -1 ||
            indiceServicio === -1 ||
            indiceCodigo === -1 ||
            indiceCoordenadas === -1 ||
            indiceRango === -1 ||
            indiceEstatus === -1
        ) {

            throw new Error(
                "Los encabezados de BASE_QR no coinciden."
            );

        }


        empleados = filas
            .slice(1)
            .map(function(columnas) {


                const coordenadasTexto =
                    (columnas[indiceCoordenadas] || "")
                        .trim();


                const coordenadas =
                    coordenadasTexto
                        .split(/\s*,\s*/);


                return {

                    nombre:
                        (columnas[indiceNombre] || "")
                            .trim(),

                    numero:
                        (columnas[indiceNumero] || "")
                            .trim(),

                    servicio:
                        (columnas[indiceServicio] || "")
                            .trim(),

                    codigoServicio:
                        (columnas[indiceCodigo] || "")
                            .trim()
                            .toUpperCase(),

                    lat:
                        parseFloat(coordenadas[0]),

                    lon:
                        parseFloat(coordenadas[1]),

                    rango:
                        parseFloat(
                            columnas[indiceRango]
                        ),

                    estatus:
                        (columnas[indiceEstatus] || "")
                            .trim()
                            .toUpperCase()

                };

            })
            .filter(function(empleado) {

                return (
                    empleado.estatus === "ACTIVO" &&
                    !isNaN(empleado.lat) &&
                    !isNaN(empleado.lon) &&
                    !isNaN(empleado.rango)
                );

            });


        if (empleados.length === 0) {

            throw new Error(
                "No existen empleados ACTIVO en BASE_QR."
            );

        }


        iniciarSistema();


    }

    catch (error) {

        console.error(
            "Error cargando BASE_QR:",
            error
        );


        document.getElementById("servicioTexto")
            .textContent =
            "Error al cargar la base";


        document.getElementById("mensaje")
            .textContent =
            "No se pudo consultar BASE_QR. Revisa la publicación de Google Sheets.";

    }

}


/* ============================================================
   INICIAR SISTEMA
   ============================================================ */

function iniciarSistema() {


    const parametros =
        new URLSearchParams(
            window.location.search
        );


    codigoServicio =
        (
            parametros.get("servicio") || ""
        ).toUpperCase();


    personalServicio =
        empleados.filter(function(empleado) {

            return (
                empleado.codigoServicio ===
                codigoServicio
            );

        });


    if (personalServicio.length === 0) {

        document.getElementById("servicioTexto")
            .textContent =
            "Servicio no identificado";


        document.getElementById("mensaje")
            .textContent =
            "El QR no corresponde a un servicio válido.";


        return;

    }


    document.getElementById("servicioTexto")
        .textContent =
        personalServicio[0].servicio;


    validarGPS();

}


/* ============================================================
   DISTANCIA ENTRE DOS COORDENADAS
   ============================================================ */

function calcularDistancia(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad = Math.PI / 180;


    const dLat =
        (lat2 - lat1) * rad;


    const dLon =
        (lon2 - lon1) * rad;


    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* ============================================================
   VALIDACIÓN GPS
   ============================================================ */

function validarGPS() {


    const servicio =
        personalServicio[0];


    if (!navigator.geolocation) {

        document.getElementById("mensaje")
            .textContent =
            "Este dispositivo no permite obtener ubicación.";

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(posicion) {


            const latUsuario =
                posicion.coords.latitude;


            const lonUsuario =
                posicion.coords.longitude;


            const distancia =
                calcularDistancia(

                    latUsuario,
                    lonUsuario,

                    servicio.lat,
                    servicio.lon

                );


            document.getElementById("ubicacion")
                .textContent =
                "Distancia: " +
                Math.round(distancia) +
                " metros";


            if (
                distancia <= servicio.rango
            ) {


                document.getElementById("ubicacion")
                    .textContent =
                    "Ubicación válida (" +
                    Math.round(distancia) +
                    " m)";


                document.getElementById("mensaje")
                    .textContent =
                    "Ubicación validada correctamente.";


                document
                    .getElementById("seleccionTipo")
                    .classList.remove("oculto");


            }

            else {


                document.getElementById("ubicacion")
                    .textContent =
                    "Fuera del rango permitido (" +
                    Math.round(distancia) +
                    " m)";


                document.getElementById("mensaje")
                    .textContent =
                    "No puedes realizar el registro desde esta ubicación.";

            }

        },


        function(error) {


            console.error(
                "Error GPS:",
                error
            );


            document.getElementById("ubicacion")
                .textContent =
                "No fue posible obtener el GPS.";


            document.getElementById("mensaje")
                .textContent =
                "Activa la ubicación del dispositivo y vuelve a intentarlo.";

        },


        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


/* ============================================================
   SELECCIONAR TIPO
   ============================================================ */

function seleccionarTipo(tipo) {


    document
        .getElementById("seccionPersonal")
        .classList.add("oculto");


    document
        .getElementById("seccionApoyo")
        .classList.add("oculto");


    if (tipo === "PERSONAL") {


        cargarPersonalServicio();


        document
            .getElementById("seccionPersonal")
            .classList.remove("oculto");

    }


    if (tipo === "APOYO") {


        cargarPersonalApoyo();


        document
            .getElementById("seccionApoyo")
            .classList.remove("oculto");

    }

}


/* ============================================================
   CARGAR PERSONAL DEL SERVICIO
   ============================================================ */

function cargarPersonalServicio() {


    const nombreSelect =
        document.getElementById(
            "nombrePersonal"
        );


    nombreSelect.innerHTML =
        '<option value="">Selecciona tu nombre</option>';


    personalServicio.forEach(
        function(empleado, indice) {


            const opcion =
                document.createElement(
                    "option"
                );


            opcion.value =
                indice;


            opcion.textContent =
                empleado.nombre;


            nombreSelect.appendChild(
                opcion
            );

        }
    );

}


/* ============================================================
   ACTUALIZAR NÚMERO DE EMPLEADO
   ============================================================ */

function actualizarNumeroPersonal() {


    const indice =
        document.getElementById(
            "nombrePersonal"
        ).value;


    const numeroSelect =
        document.getElementById(
            "numeroPersonal"
        );


    numeroSelect.innerHTML =
        '<option value="">Selecciona tu número</option>';


    if (indice === "") {

        return;

    }


    const empleado =
        personalServicio[indice];


    const opcion =
        document.createElement(
            "option"
        );


    opcion.value =
        empleado.numero;


    opcion.textContent =
        empleado.numero;


    numeroSelect.appendChild(
        opcion
    );

}


/* ============================================================
   CARGAR PERSONAL PARA APOYO
   ============================================================ */

function cargarPersonalApoyo() {


    const nombreSelect =
        document.getElementById(
            "nombreApoyo"
        );


    nombreSelect.innerHTML =
        '<option value="">Selecciona tu nombre</option>';


    empleados.forEach(
        function(empleado, indice) {


            const opcion =
                document.createElement(
                    "option"
                );


            opcion.value =
                indice;


            opcion.textContent =
                empleado.nombre +
                " - " +
                empleado.numero;


            nombreSelect.appendChild(
                opcion
            );

        }
    );

}


/* ============================================================
   ACTUALIZAR INFORMACIÓN DE APOYO
   ============================================================ */

function actualizarApoyo() {


    const indice =
        document.getElementById(
            "nombreApoyo"
        ).value;


    const numeroSelect =
        document.getElementById(
            "numeroApoyo"
        );


    const origen =
        document.getElementById(
            "servicioOrigen"
        );


    numeroSelect.innerHTML =
        '<option value="">Selecciona tu número</option>';


    origen.textContent =
        "-";


    if (indice === "") {

        return;

    }


    const empleado =
        empleados[indice];


    const opcion =
        document.createElement(
            "option"
        );


    opcion.value =
        empleado.numero;


    opcion.textContent =
        empleado.numero;


    numeroSelect.appendChild(
        opcion
    );


    origen.textContent =
        empleado.servicio;

}


/* ============================================================
   CONTINUAR PERSONAL
   ============================================================ */

function continuarPersonal() {


    const indice =
        document.getElementById(
            "nombrePersonal"
        ).value;


    const numero =
        document.getElementById(
            "numeroPersonal"
        ).value;


    if (
        indice === "" ||
        numero === ""
    ) {

        alert(
            "Selecciona tu nombre y número de empleado."
        );

        return;

    }


    const empleado =
        personalServicio[indice];


    abrirFormulario(

        empleado.nombre,

        empleado.numero,

        "PERSONAL",

        empleado.servicio

    );

}


/* ============================================================
   CONTINUAR APOYO
   ============================================================ */

function continuarApoyo() {


    const indice =
        document.getElementById(
            "nombreApoyo"
        ).value;


    const numero =
        document.getElementById(
            "numeroApoyo"
        ).value;


    if (
        indice === "" ||
        numero === ""
    ) {

        alert(
            "Selecciona tu nombre y número de empleado."
        );

        return;

    }


    const empleado =
        empleados[indice];


    abrirFormulario(

        empleado.nombre,

        empleado.numero,

        "APOYO",

        empleado.servicio

    );

}


/* ============================================================
   ABRIR GOOGLE FORMS
   ============================================================ */

function abrirFormulario(
    nombre,
    numero,
    tipo,
    servicioOrigen
) {


    const formulario =
        "https://docs.google.com/forms/d/e/" +
        "1FAIpQLSeKDOEdUlS75ivHlBWG4qVo-PdaL8KLWBa3GM9IYbX6I6ptnQ" +
        "/viewform";


    const url =
        formulario +
        "?usp=pp_url" +

        "&entry.1973773208=" +
        encodeURIComponent(
            personalServicio[0].servicio
        ) +

        "&entry.612785713=" +
        encodeURIComponent(
            nombre
        ) +

        "&entry.2013854503=" +
        encodeURIComponent(
            numero
        );


    window.location.href =
        url;

}


/* ============================================================
   INICIAR
   ============================================================ */

cargarBaseQR();

</script>

</body>
</html>
