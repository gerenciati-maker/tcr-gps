<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Torre de Control
</title>

<style>

* {

}

body {

    display: none;

.info {

    margin-top: 15px;

    padding: 12px;

    margin-top: 15px;

    padding: 12px;

    padding: 12px;

}

</style>

</head>


<body>


<div class="container">


<h1>
    TORRE DE CONTROL
</h1>


<div
    id="estado"
    class="estado">

    Cargando información...

</div>


<!-- =========================================================
     INFORMACIÓN DEL SERVICIO
     ========================================================= -->

<div
    id="seccionServicio"
    class="info oculto">

    <strong>
        Servicio identificado:
    </strong>

    <br>

    <span id="servicioActual">
        -
    </span>

</div>


<!-- =========================================================
     TIPO DE REGISTRO
     ========================================================= -->

<div
    id="seccionTipo"
    class="oculto">


<h2>
    Tipo de registro
</h2>


<button
    onclick="seleccionarPersonal()">

    PERSONAL DEL SERVICIO

</button>


<button
    onclick="seleccionarApoyo()">

    APOYO

</button>


</div>


<!-- =========================================================
     PERSONAL
     ========================================================= -->

<div
    id="seccionPersonal"
    class="oculto">


<h2>
    Personal
</h2>


<label
    for="nombrePersonal">

    Nombre

</label>


<select
    id="nombrePersonal"
    onchange="actualizarNumeroPersonal()">

    <option value="">
        Selecciona tu nombre
    </option>

</select>


<label
    for="numeroPersonal">

    Número de empleado

</label>


<input
    type="text"
    id="numeroPersonal"
    readonly
    placeholder="Número automático">


<button
    onclick="continuarPersonal()">

    CONTINUAR

</button>


<button
    onclick="regresarTipo()">

    REGRESAR

</button>


</div>


<!-- =========================================================
     APOYO
     ========================================================= -->

<div
    id="seccionApoyo"
    class="oculto">


<h2>
    Apoyo
</h2>


<label
    for="nombreApoyo">

    Nombre

</label>


<input
    type="text"
    id="nombreApoyo"
    placeholder="Nombre automático"
    autocomplete="off"
    readonly>


<label
    for="numeroApoyo">

    Número de empleado

</label>


<input
    type="text"
    id="numeroApoyo"
    placeholder="Número de empleado"
    inputmode="numeric"
    autocomplete="off"
    oninput="reconocerApoyo()">


<div class="origen">

    <strong>
        Servicio de origen:
    </strong>

    <span id="servicioOrigen">
        -
    </span>

</div>


<button
    onclick="continuarApoyo()">

    CONTINUAR

</button>


<button
    onclick="regresarTipo()">

    REGRESAR

</button>


</div>


</div>


<script>


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */


/*
    NUEVO ARCHIVO DE GOOGLE SHEETS
*/

const ID_ARCHIVO =
    "1zdYovCmbhHOyMVy-huWqzgB6Q5x1XgL8dghe263TTbU";


/*
    GID DE BASE_QR
*/

const ID_BASE_QR =
    "1049929211";


/*
    SERVICIO ESPECIAL PARA ADMINISTRATIVOS
*/

const CODIGO_ADMIN =
    "CENTRAL";


/* =========================================================
   VARIABLES
   ========================================================= */


let empleados = [];

let servicios = [];

let personalServicio = [];

let servicioActual = null;

let nombreApoyo = "";

let servicioOrigenApoyo = "";


/* =========================================================
   ELEMENTOS
   ========================================================= */


const estado =
    document.getElementById(
        "estado"
    );


const servicioActualCampo =
    document.getElementById(
        "servicioActual"
    );


/* =========================================================
   OBTENER GPS
   ========================================================= */


function obtenerGPS() {


    if (
        !navigator.geolocation
    ) {

        mostrarError(
            "Este dispositivo no permite obtener la ubicación GPS."
        );

        return;

    }


    estado.textContent =
        "Obteniendo ubicación GPS...";


    navigator.geolocation.getCurrentPosition(

        function(posicion) {

            const lat =
                posicion.coords.latitude;

            const lon =
                posicion.coords.longitude;

            console.log(
                "GPS actual:",
                lat,
                lon
            );


            identificarServicio(
                lat,
                lon
            );

        },

        function(error) {

            console.error(
                "Error GPS:",
                error
            );


            mostrarError(
                "No fue posible obtener tu ubicación. Activa el GPS y permite el acceso a la ubicación."
            );

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


/* =========================================================
   DISTANCIA ENTRE DOS COORDENADAS
   ========================================================= */


function calcularDistancia(

    lat1,
    lon1,
    lat2,
    lon2

) {


    const R =
        6371000;


    const rad =
        Math.PI / 180;


    const dLat =
        (lat2 - lat1) *
        rad;


    const dLon =
        (lon2 - lon1) *
        rad;


    const a =

        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 * rad
        ) *

        Math.cos(
            lat2 * rad
        ) *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    const c =

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1 - a
            )

        );


    return R * c;

}


/* =========================================================
   IDENTIFICAR SERVICIO POR GPS
   ========================================================= */


function identificarServicio(

    lat,
    lon

) {


    /*
        Aquí NO usamos el QR para saber
        qué servicio es.

        Se revisan todos los servicios
        existentes en BASE_QR.
    */


    const candidatos = [];


    servicios.forEach(

        function(servicio) {


            const distancia =
                calcularDistancia(

                    lat,
                    lon,

                    servicio.lat,
                    servicio.lon

                );


            console.log(

                servicio.codigoServicio,

                "Distancia:",

                distancia,

                "Rango:",

                servicio.rango

            );


            if (

                distancia <=
                servicio.rango

            ) {

                candidatos.push({

                    servicio:
                        servicio,

                    distancia:
                        distancia

                });

            }

        }

    );


    /*
        Si encontramos servicios,
        tomamos el más cercano.
    */


    if (
        candidatos.length > 0
    ) {


        candidatos.sort(

            function(a, b) {

                return (
                    a.distancia -
                    b.distancia
                );

            }

        );


        servicioActual =
            candidatos[0].servicio;


        entrarAlServicio();


        return;

    }


    /*
        Si no está dentro de ningún servicio,
        todavía no bloqueamos.

        Primero pediremos el número
        para determinar si es ADMINISTRATIVO.
    */


    servicioActual = null;


    mostrarFueraDeServicio();

}


/* =========================================================
   ENTRAR AL SERVICIO
   ========================================================= */


function entrarAlServicio() {


    personalServicio =
        empleados.filter(

            function(empleado) {

                return (

                    empleado.codigoServicio ===
                    servicioActual.codigoServicio

                    &&

                    empleado.estatus ===
                    "ACTIVO"

                );

            }

        );


    servicioActualCampo.textContent =
        servicioActual.servicio;


    document
        .getElementById(
            "seccionServicio"
        )
        .classList.remove(
            "oculto"
        );


    estado.textContent =
        "Servicio identificado correctamente.";


    document
        .getElementById(
            "seccionTipo"
        )
        .classList.remove(
            "oculto"
        );


    /*
        Preparar PERSONAL
    */


    cargarPersonalServicio();

}


/* =========================================================
   FUERA DE SERVICIO
   ========================================================= */


function mostrarFueraDeServicio() {


    estado.textContent =
        "Ubicación fuera de los servicios registrados.";


    document
        .getElementById(
            "seccionServicio"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionTipo"
        )
        .classList.add(
            "oculto"
        );


    /*
        En este punto pedimos el número
        para saber si es ADMINISTRATIVO.
    */


    const numero =
        prompt(

            "No se detectó un servicio en esta ubicación.\n\nIngresa tu número de empleado para validar tu posición."

        );


    if (
        numero === null
    ) {

        mostrarError(
            "Registro cancelado."
        );

        return;

    }


    validarAdministrativo(
        numero.trim()
    );

}


/* =========================================================
   VALIDAR ADMINISTRATIVO
   ========================================================= */


function validarAdministrativo(
    numero
) {


    if (
        numero === ""
    ) {

        mostrarError(
            "Debes ingresar un número de empleado."
        );

        return;

    }


    const coincidencias =
        empleados.filter(

            function(empleado) {

                return (

                    String(
                        empleado.numero
                    ).trim() === numero

                    &&

                    empleado.estatus ===
                    "ACTIVO"

                );

            }

        );


    if (
        coincidencias.length === 0
    ) {

        mostrarError(
            "Empleado no encontrado."
        );

        return;

    }


    const empleado =
        coincidencias[0];


    console.log(
        "Empleado fuera de servicio:",
        empleado
    );


    /*
        ÚNICA EXCEPCIÓN:
        ADMINISTRATIVO
    */


    if (

        empleado.posicion
        .trim()
        .toUpperCase()

        !==

        "ADMINISTRATIVO"

    ) {

        mostrarError(

            "Tu posición es " +
            empleado.posicion +
            ". No puedes realizar un registro fuera de un servicio autorizado."

        );

        return;

    }


    /*
        Buscar CENTRAL
    */


    const central =
        servicios.find(

            function(servicio) {

                return (

                    servicio.codigoServicio
                    ===
                    CODIGO_ADMIN

                );

            }

        );


    if (
        !central
    ) {

        mostrarError(

            "No se encontró el servicio CENTRAL en la base."

        );

        return;

    }


    /*
        ADMINISTRATIVO:
        se asigna CENTRAL
        aunque esté fuera del rango.
    */


    servicioActual =
        central;


    personalServicio =
        empleados.filter(

            function(persona) {

                return (

                    persona.codigoServicio ===
                    central.codigoServicio

                    &&

                    persona.estatus ===
                    "ACTIVO"

                );

            }

        );


    servicioActualCampo.textContent =
        central.servicio;


    document
        .getElementById(
            "seccionServicio"
        )
        .classList.remove(
            "oculto"
        );


    estado.textContent =
        "Registro administrativo autorizado en CENTRAL.";


    document
        .getElementById(
            "seccionTipo"
        )
        .classList.remove(
            "oculto"
        );


    cargarPersonalServicio();

}


/* =========================================================
   CARGAR PERSONAL DEL SERVICIO
   ========================================================= */


function cargarPersonalServicio() {


    const nombreSelect =
        document.getElementById(
            "nombrePersonal"
        );


    const numeroInput =
        document.getElementById(
            "numeroPersonal"
        );


    nombreSelect.innerHTML =
        '<option value="">Selecciona tu nombre</option>';


    numeroInput.value =
        "";


    personalServicio.forEach(

        function(empleado, indice) {


            const opcion =
                document.createElement(
                    "option"
                );


            opcion.value =
                indice;


            opcion.textContent =
                empleado.nombre;


            nombreSelect.appendChild(
                opcion
            );

        }

    );

}


/* =========================================================
   ACTUALIZAR NÚMERO PERSONAL
   ========================================================= */


function actualizarNumeroPersonal() {


    const indice =
        document.getElementById(
            "nombrePersonal"
        ).value;


    const numeroInput =
        document.getElementById(
            "numeroPersonal"
        );


    numeroInput.value =
        "";


    if (
        indice === ""
    ) {

        return;

    }


    const empleado =
        personalServicio[
            indice
        ];


    if (
        empleado
    ) {

        numeroInput.value =
            empleado.numero;

    }

}


/* =========================================================
   SELECCIONAR PERSONAL
   ========================================================= */


function seleccionarPersonal() {


    document
        .getElementById(
            "seccionTipo"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionPersonal"
        )
        .classList.remove(
            "oculto"
        );

}


/* =========================================================
   SELECCIONAR APOYO
   ========================================================= */


function seleccionarApoyo() {


    document
        .getElementById(
            "seccionTipo"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionApoyo"
        )
        .classList.remove(
            "oculto"
        );


    cargarPersonalApoyo();

}


/* =========================================================
   CARGAR APOYO
   ========================================================= */


function cargarPersonalApoyo() {


    nombreApoyo = "";

    servicioOrigenApoyo = "";


    document.getElementById(
        "nombreApoyo"
    ).value = "";


    document.getElementById(
        "numeroApoyo"
    ).value = "";


    document.getElementById(
        "servicioOrigen"
    ).textContent =
        "-";

}


/* =========================================================
   RECONOCER APOYO
   ========================================================= */


function reconocerApoyo() {


    const numero =
        document.getElementById(
            "numeroApoyo"
        ).value.trim();


    const nombreCampo =
        document.getElementById(
            "nombreApoyo"
        );


    const servicioCampo =
        document.getElementById(
            "servicioOrigen"
        );


    if (
        numero === ""
    ) {


        nombreApoyo = "";

        servicioOrigenApoyo = "";


        nombreCampo.value =
            "";


        servicioCampo.textContent =
            "-";


        return;

    }


    const coincidencias =
        empleados.filter(

            function(empleado) {

                return (

                    String(
                        empleado.numero
                    ).trim() === numero

                    &&

                    empleado.estatus ===
                    "ACTIVO"

                );

            }

        );


    if (
        coincidencias.length === 0
    ) {


        nombreApoyo = "";

        servicioOrigenApoyo = "";


        nombreCampo.value =
            "";


        servicioCampo.textContent =
            "Empleado no encontrado";


        return;

    }


    nombreApoyo =
        coincidencias[0].nombre;


    nombreCampo.value =
        nombreApoyo;


    const serviciosOrigen = [

        ...new Set(

            coincidencias.map(

                function(empleado) {

                    return empleado.servicio;

                }

            )

        )

    ];


    servicioOrigenApoyo =
        serviciosOrigen.join(
            " / "
        );


    servicioCampo.textContent =
        servicioOrigenApoyo;

}


/* =========================================================
   CONTINUAR PERSONAL
   ========================================================= */


function continuarPersonal() {


    const indice =
        document.getElementById(
            "nombrePersonal"
        ).value;


    const numero =
        document.getElementById(
            "numeroPersonal"
        ).value;


    if (

        indice === ""

        ||

        numero === ""

    ) {

        alert(
            "Selecciona tu nombre y número de empleado."
        );

        return;

    }


    const empleado =
        personalServicio[
            indice
        ];


    abrirFormulario(

        empleado.nombre,

        empleado.numero,

        "PERSONAL DEL SERVICIO",

        empleado.servicio

    );

}


/* =========================================================
   CONTINUAR APOYO
   ========================================================= */


function continuarApoyo() {


    const nombre =
        document.getElementById(
            "nombreApoyo"
        ).value.trim();


    const numero =
        document.getElementById(
            "numeroApoyo"
        ).value.trim();


    const servicioOrigen =
        document.getElementById(
            "servicioOrigen"
        ).textContent;


    if (

        nombre === ""

        ||

        numero === ""

    ) {

        alert(
            "Escribe un número de empleado válido."
        );

        return;

    }


    if (

        servicioOrigen === "-"

        ||

        servicioOrigen ===
        "Empleado no encontrado"

    ) {

        alert(
            "No se pudo reconocer el empleado."
        );

        return;

    }


    abrirFormulario(

        nombre,

        numero,

        "APOYO",

        servicioOrigen

    );

}


/* =========================================================
   REGRESAR
   ========================================================= */


function regresarTipo() {


    document
        .getElementById(
            "seccionPersonal"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionApoyo"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionTipo"
        )
        .classList.remove(
            "oculto"
        );

}


/* =========================================================
   ABRIR GOOGLE FORMS
   ========================================================= */


function abrirFormulario(

    nombre,

    numero,

    tipo,

    servicioOrigen

) {


    const formulario =

        "https://docs.google.com/forms/d/e/" +

        "1FAIpQLSdY4MOdaUuv3wIN0JKWovq3Hu-3tKy_kXAYVtnOyRFZXBDvgQ" +

        "/viewform";


    /*
        Servicio donde está registrando
    */


    const servicioRegistro =
        servicioActual.servicio;


    /*
        Construir URL
    */


    const url =

        formulario +

        "?usp=pp_url" +

        "&entry.737145468=" +

        encodeURIComponent(
            nombre
        ) +

        "&entry.1351159631=" +

        encodeURIComponent(
            numero
        ) +

        "&entry.1698343083=" +

        encodeURIComponent(
            servicioRegistro
        );


    console.log(
        "Tipo:",
        tipo
    );


    console.log(
        "Servicio origen:",
        servicioOrigen
    );


    console.log(
        "Servicio registro:",
        servicioRegistro
    );


    console.log(
        "URL Forms:",
        url
    );


    window.location.href =
        url;

}


/* =========================================================
   MOSTRAR ERROR
   ========================================================= */


function mostrarError(
    mensaje
) {


    estado.textContent =
        mensaje;


    estado.style.display =
        "block";


    document
        .getElementById(
            "seccionServicio"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionTipo"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionPersonal"
        )
        .classList.add(
            "oculto"
        );


    document
        .getElementById(
            "seccionApoyo"
        )
        .classList.add(
            "oculto"
        );

}


/* =========================================================
   CARGAR BASE QR
   ========================================================= */


function cargarBaseQR() {


    const callbackName =
        "respuestaBaseQR_" +
        Date.now();


    window[
        callbackName
    ] = function(datos) {


        try {


            if (

                !datos ||

                !datos.table ||

                !datos.table.cols ||

                !datos.table.rows

            ) {

                throw new Error(
                    "Google Sheets no devolvió datos válidos."
                );

            }


            /*
                Encabezados
            */


            const encabezados =
                datos.table.cols.map(

                    function(columna) {

                        return (

                            columna.label ||
                            ""

                        )
                        .trim();

                    }

                );


            console.log(
                "Encabezados:",
                encabezados
            );


            /*
                Buscar columnas
            */


            const indiceNombre =
                encabezados.indexOf(
                    "Nombre"
                );


            const indiceNumero =
                encabezados.indexOf(
                    "No de empleado"
                );


            const indiceServicio =
                encabezados.indexOf(
                    "Servicio"
                );


            const indiceCodigo =
                encabezados.indexOf(
                    "Código servicio"
                );


            const indiceCoordenadas =
                encabezados.indexOf(
                    "Coordenadas"
                );


            const indiceRango =
                encabezados.indexOf(
                    "Rango"
                );


            const indiceEstatus =
                encabezados.indexOf(
                    "Estatus"
                );


            const indicePosicion =
                encabezados.indexOf(
                    "Posición"
                );


            /*
                Verificar columnas
            */


            if (

                indiceNombre === -1 ||

                indiceNumero === -1 ||

                indiceServicio === -1 ||

                indiceCodigo === -1 ||

                indiceCoordenadas === -1 ||

                indiceRango === -1 ||

                indiceEstatus === -1 ||

                indicePosicion === -1

            ) {

                throw new Error(

                    "No coinciden los encabezados de BASE_QR. Verifica que exista la columna Posición."

                );

            }


            /*
                Convertir filas
            */


            empleados =

                datos.table.rows

                .map(

                    function(fila) {


                        const columnas =
                            fila.c.map(

                                function(celda) {


                                    if (

                                        celda &&

                                        celda.v !==
                                        undefined

                                    ) {

                                        return String(
                                            celda.v
                                        ).trim();

                                    }


                                    return "";

                                }

                            );


                        /*
                            Coordenadas
                        */


                        const textoCoordenadas =

                            columnas[
                                indiceCoordenadas
                            ];


                        const coordenadas =

                            textoCoordenadas
                            .split(
                                /\s*,\s*/
                            );


                        /*
                            Crear empleado
                        */


                        return {


                            nombre:

                                columnas[
                                    indiceNombre
                                ],


                            numero:

                                columnas[
                                    indiceNumero
                                ],


                            servicio:

                                columnas[
                                    indiceServicio
                                ],


                            codigoServicio:

                                columnas[
                                    indiceCodigo
                                ]
                                .trim()
                                .toUpperCase(),


                            lat:

                                parseFloat(
                                    coordenadas[0]
                                ),


                            lon:

                                parseFloat(
                                    coordenadas[1]
                                ),


                            rango:

                                parseFloat(

                                    columnas[
                                        indiceRango
                                    ]

                                ),


                            estatus:

                                columnas[
                                    indiceEstatus
                                ]
                                .trim()
                                .toUpperCase(),


                            posicion:

                                columnas[
                                    indicePosicion
                                ]
                                .trim()
                                .toUpperCase()

                        };


                    }

                )


                /*
                    SOLO ACTIVOS
                */

                .filter(

                    function(empleado) {

                        return (

                            empleado.estatus ===
                            "ACTIVO"

                        );

                    }

                );


            console.log(
                "Empleados activos:",
                empleados
            );


            /*
                Crear catálogo de servicios
            */


            const mapaServicios =
                new Map();


            empleados.forEach(

                function(empleado) {


                    if (

                        !mapaServicios.has(
                            empleado.codigoServicio
                        )

                    ) {


                        mapaServicios.set(

                            empleado.codigoServicio,

                            {

                                servicio:
                                    empleado.servicio,

                                codigoServicio:
                                    empleado.codigoServicio,

                                lat:
                                    empleado.lat,

                                lon:
                                    empleado.lon,

                                rango:
                                    empleado.rango

                            }

                        );

                    }

                }

            );


            servicios =
                Array.from(
                    mapaServicios.values()
                );


            console.log(
                "Servicios:",
                servicios
            );


            if (
                servicios.length === 0
            ) {

                throw new Error(
                    "No se encontraron servicios activos."
                );

            }


            estado.textContent =
                "Base cargada. Obteniendo ubicación...";


            /*
                Ya cargada la base,
                solicitar GPS.
            */


            obtenerGPS();


        }

        catch(error) {


            console.error(
                error
            );


            mostrarError(

                "Error al cargar la base: " +
                error.message

            );

        }


        /*
            Limpiar callback
        */


        delete window[
            callbackName
        ];


        const script =
            document.getElementById(
                callbackName
            );


        if (
            script
        ) {

            script.remove();

        }


    };


    /*
        URL GVIZ
    */


    const url =

        "https://docs.google.com/spreadsheets/d/" +

        ID_ARCHIVO +

        "/gviz/tq" +

        "?gid=" +

        ID_BASE_QR +

        "&tqx=out:json;responseHandler:" +

        callbackName;


    /*
        Crear script JSONP
    */


    const script =
        document.createElement(
            "script"
        );


    script.id =
        callbackName;


    script.src =
        url;


    script.onerror =
        function() {

            mostrarError(

                "No fue posible cargar la información de Google Sheets."

            );

        };


    document
        .body
        .appendChild(
            script
        );

}


/* =========================================================
   INICIAR
   ========================================================= */


cargarBaseQR();


</script>
