<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Validando ubicación...</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f4f6f8;
    }

      max-width: 450px;

      margin-bottom: 10px;
    }

    #estado {
      margin-top: 30px;
      font-size: 20px;

    }

      margin-top: 20px;
      font-size: 17px;
      line-height: 1.6;
    }

    .error {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>TCR</h1>

  <div>
    Validación de ubicación
  </div>

  <div id="estado">
    📍 Obteniendo ubicación...
  </div>

  <div id="resultado"></div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN DEL SERVICIO TCR
   ===================================================== */

const SERVICIO = {
  nombre: "TCR",

  lat: 19.025274494954676,

  lon: -98.26069346300481,

  rango: 100
};


/* =====================================================
   GOOGLE FORMS
   ===================================================== */

const URL_FORMULARIO =
  "https://docs.google.com/forms/d/e/1FAIpQLSeKDOEdUlS75ivHlBWG4qVo-PdaL8KLWBa3GM9IYbX6I6ptnQ/viewform?usp=dialog";


/* =====================================================
   ELEMENTOS
   ===================================================== */

const estado =
  document.getElementById("estado");

const resultado =
  document.getElementById("resultado");


/* =====================================================
   CALCULAR DISTANCIA
   ===================================================== */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const dLat =
    (lat2 - lat1) * Math.PI / 180;

  const dLon =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(lat1 * Math.PI / 180) *

    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLon / 2) ** 2;

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =====================================================
   VALIDAR UBICACIÓN
   ===================================================== */

function validarUbicacion() {

  if (!navigator.geolocation) {

    estado.innerHTML =
      "❌ Ubicación no disponible";

    resultado.innerHTML =
      "Este dispositivo no permite obtener la ubicación.";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const precision =
        position.coords.accuracy;


      /* ---------------------------------------------
         CALCULAR DISTANCIA
         --------------------------------------------- */

      const distancia =
        distanciaMetros(
          lat,
          lon,
          SERVICIO.lat,
          SERVICIO.lon
        );


      const distanciaRedondeada =
        Math.round(distancia);


      /* ---------------------------------------------
         DENTRO DEL RANGO
         --------------------------------------------- */

      if (distancia <= SERVICIO.rango) {

        estado.innerHTML =
          "✅ Ubicación validada";

        resultado.innerHTML =
          "Servicio: <strong>" +
          SERVICIO.nombre +
          "</strong><br>" +

          "Distancia: " +
          distanciaRedondeada +
          " metros";


        /*
         * ESPERA MUY CORTA PARA QUE EL USUARIO
         * PUEDA VER QUE LA UBICACIÓN FUE VALIDADA.
         */

        setTimeout(function() {

          window.location.href =
            URL_FORMULARIO;

        }, 700);

      }


      /* ---------------------------------------------
         FUERA DEL RANGO
         --------------------------------------------- */

      else {

        estado.innerHTML =
          "❌ FUERA DEL RANGO";

        resultado.innerHTML =

          "No es posible realizar el registro.<br><br>" +

          "Distancia detectada: <strong>" +
          distanciaRedondeada +
          " metros</strong><br>" +

          "Radio permitido: <strong>" +
          SERVICIO.rango +
          " metros</strong><br><br>" +

          "Acércate al servicio e inténtalo nuevamente.";

      }

    },


    /* ---------------------------------------------
       ERROR DE GPS
       --------------------------------------------- */

    function(error) {

      estado.innerHTML =
        "❌ No se pudo validar la ubicación";

      resultado.innerHTML =
        "Activa la ubicación del teléfono y vuelve a escanear el QR.";

    },


    /* ---------------------------------------------
       CONFIGURACIÓN GPS
       --------------------------------------------- */

    {
      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0
    }

  );

}


/* =====================================================
   INICIAR
   ===================================================== */

validarUbicacion();

</script>

</body>
</html>
