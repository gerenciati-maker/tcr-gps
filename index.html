<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lista de Asistencia</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select,
button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
}

input,
select {
    border: 1px solid #ccc;
    background: white;
}

button {
    border: none;
    background: #1f4e79;
    color: white;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.oculto {
    display: none;
}

.info {
    background: #eef4f8;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.exito {
    background: #e8f5e9;
    padding: 12px;
    border-radius: 8px;
    color: #256029;
}

.error {
    background: #fdecea;
    padding: 12px;
    border-radius: 8px;
    color: #a12622;
}

.origen {
    margin-top: 12px;
    padding: 10px;
    background: #f3f3f3;
    border-radius: 8px;
}

.pequeno {
    font-size: 13px;
    color: #666;
    margin-top: 8px;
}

</style>
</head>

<body>

<div class="container">

    <!-- ENCABEZADO -->
    <h1 id="tituloServicio">LISTA DE ASISTENCIA</h1>


    <!-- ESTADO -->

    <div id="estado" class="card">
        <strong>Iniciando sistema...</strong>
    </div>


    <!-- SERVICIO IDENTIFICADO -->

    <div id="servicioCard" class="card oculto">

        <div class="info">

            <strong>Servicio identificado:</strong>

            <span id="servicioIdentificado">
                -
            </span>

        </div>


        <!-- TIPOS DE REGISTRO -->

        <div id="tipoRegistro">

            <button onclick="seleccionarPersonal()">
                PERSONAL DEL SERVICIO
            </button>


            <button onclick="seleccionarApoyo()">
                APOYO
            </button>


            <button onclick="seleccionarAdministrativo()">
                ADMINISTRATIVO
            </button>

        </div>

    </div>



    <!-- =========================================
         PERSONAL DEL SERVICIO
    ========================================== -->

    <div id="personalCard" class="card oculto">

        <label for="personalSelect">
            Nombre
        </label>

        <select
            id="personalSelect"
            onchange="actualizarNumeroPersonal()"
        >

            <option value="">
                Seleccione una persona
            </option>

        </select>


        <label for="numeroPersonal">
            Número de empleado
        </label>

        <input
            type="text"
            id="numeroPersonal"
            readonly
            placeholder="Número automático"
        >


        <button onclick="continuarPersonal()">
            CONTINUAR
        </button>

    </div>



    <!-- =========================================
         APOYO
    ========================================== -->

    <div id="apoyoCard" class="card oculto">

        <label for="numeroApoyo">
            Número de empleado
        </label>

        <input
            type="text"
            id="numeroApoyo"
            placeholder="Número de empleado"
            inputmode="numeric"
            autocomplete="off"
            oninput="reconocerApoyo()"
        >


        <label for="nombreApoyo">
            Nombre
        </label>

        <input
            type="text"
            id="nombreApoyo"
            placeholder="Nombre automático"
            autocomplete="off"
            readonly
        >


        <div class="origen">

            <strong>
                Servicio de origen:
            </strong>

            <span id="servicioOrigen">
                -
            </span>

        </div>


        <button onclick="continuarApoyo()">
            CONTINUAR
        </button>

    </div>



    <!-- =========================================
         ADMINISTRATIVO
    ========================================== -->

    <div id="administrativoCard" class="card oculto">

        <div class="info">

            <strong>
                Registro administrativo
            </strong>

            <div class="pequeno">

                El registro se realizará como
                OFICINAS CENTRALES.

            </div>

        </div>


        <label for="numeroAdministrativo">
            Número de empleado
        </label>

        <input
            type="text"
            id="numeroAdministrativo"
            placeholder="Número de empleado"
            inputmode="numeric"
            autocomplete="off"
            oninput="reconocerAdministrativo()"
        >


        <label for="nombreAdministrativo">
            Nombre
        </label>

        <input
            type="text"
            id="nombreAdministrativo"
            placeholder="Nombre automático"
            readonly
        >


        <div id="adminResultado"></div>


        <button onclick="continuarAdministrativo()">
            CONTINUAR
        </button>

    </div>



    <!-- MENSAJE FINAL -->

    <div
        id="mensajeFinal"
        class="card oculto"
    ></div>

</div>



<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const ID_ARCHIVO =
    "1zdYovCmbhHOyMVy-huWqzgB6Q5x1XgL8dghe263TTbU";


const ID_BASE_QR =
    "1049929211";


/*
   Código que representa Oficinas Centrales
*/

const CODIGO_ADMIN =
    "CENTRAL";


/*
   Nombre exacto que se mandará al Forms
*/

const SERVICIO_CENTRAL =
    "ID-00167 - OFICINAS CENTRALES";



/* =====================================================
   VARIABLES
===================================================== */

let empleados = [];

let servicios = new Map();

let personalServicio = [];

let servicioActual = null;

let empleadoApoyoActual = null;

let empleadoAdministrativoActual = null;



/* =====================================================
   INICIO
===================================================== */

window.onload = function() {

    cargarBaseQR();

};



/* =====================================================
   CARGAR BASE QR
===================================================== */

function cargarBaseQR() {

    const callbackName =
        "callbackBaseQR_" + Date.now();


    window[callbackName] = function(data) {

        try {

            const filas =
                data.table.rows;


            const encabezados =
                data.table.cols.map(
                    col => col.label
                );


            const indiceNombre =
                encabezados.indexOf("Nombre");


            const indiceNumero =
                encabezados.indexOf(
                    "No de empleado"
                );


            const indiceServicio =
                encabezados.indexOf("Servicio");


            const indiceCodigo =
                encabezados.indexOf(
                    "Código servicio"
                );


            const indiceCoordenadas =
                encabezados.indexOf(
                    "Coordenadas"
                );


            const indiceRango =
                encabezados.indexOf("Rango");


            const indiceEstatus =
                encabezados.indexOf("Estatus");


            const indicePosicion =
                encabezados.indexOf("Posición");



            /* =========================================
               VALIDAR COLUMNAS
            ========================================== */

            if (
                indiceNombre === -1 ||
                indiceNumero === -1 ||
                indiceServicio === -1 ||
                indiceCodigo === -1 ||
                indiceCoordenadas === -1 ||
                indiceRango === -1 ||
                indiceEstatus === -1 ||
                indicePosicion === -1
            ) {

                mostrarError(
                    "No se encontraron todas las columnas requeridas en BASE_QR."
                );

                return;

            }



            /* =========================================
               CONVERTIR FILAS
            ========================================== */

            empleados = filas.map(
                fila => {

                    const c =
                        fila.c || [];


                    function valor(indice) {

                        return (
                            c[indice] &&
                            c[indice].v != null
                        )

                        ?

                        String(
                            c[indice].v
                        ).trim()

                        :

                        "";

                    }


                    const coordenadas =
                        valor(
                            indiceCoordenadas
                        );


                    let lat = null;

                    let lon = null;


                    if (coordenadas) {

                        const partes =
                            coordenadas.split(",");


                        if (
                            partes.length >= 2
                        ) {

                            lat =
                                parseFloat(
                                    partes[0].trim()
                                );


                            lon =
                                parseFloat(
                                    partes[1].trim()
                                );

                        }

                    }


                    return {

                        nombre:
                            valor(
                                indiceNombre
                            ),

                        numero:
                            valor(
                                indiceNumero
                            ),

                        servicio:
                            valor(
                                indiceServicio
                            ),

                        codigoServicio:
                            valor(
                                indiceCodigo
                            ),

                        lat:
                            lat,

                        lon:
                            lon,

                        rango:
                            parseFloat(
                                valor(
                                    indiceRango
                                )
                            ) || 0,

                        estatus:
                            valor(
                                indiceEstatus
                            ),

                        posicion:
                            valor(
                                indicePosicion
                            ).toUpperCase()

                    };

                }

            ).filter(

                empleado =>
                    empleado.estatus ===
                    "ACTIVO"

            );



            construirServicios();


            iniciarSistema();


        }

        catch(error) {

            console.error(error);


            mostrarError(
                "No fue posible procesar la base."
            );

        }

    };



    /* =========================================
       JSONP GOOGLE SHEETS
    ========================================== */

    const script =
        document.createElement("script");


    script.src =

        "https://docs.google.com/spreadsheets/d/" +

        ID_ARCHIVO +

        "/gviz/tq" +

        "?gid=" +

        ID_BASE_QR +

        "&tqx=out:json;responseHandler:" +

        callbackName;



    script.onerror = function() {

        mostrarError(
            "No fue posible conectar con Google Sheets."
        );

    };


    document.body.appendChild(script);

}



/* =====================================================
   CONSTRUIR SERVICIOS
===================================================== */

function construirServicios() {

    servicios.clear();


    /*
       IMPORTANTE:

       Un mismo servicio puede tener más de una
       coordenada.

       Por eso guardamos TODAS las ubicaciones
       asociadas al código del servicio.
    */


    empleados.forEach(
        empleado => {

            if (
                !empleado.codigoServicio ||
                empleado.lat === null ||
                empleado.lon === null
            ) {

                return;

            }


            if (
                !servicios.has(
                    empleado.codigoServicio
                )
            ) {

                servicios.set(
                    empleado.codigoServicio,
                    {

                        codigo:
                            empleado.codigoServicio,

                        servicio:
                            empleado.servicio,

                        ubicaciones:
                            []

                    }
                );

            }


            const servicio =
                servicios.get(
                    empleado.codigoServicio
                );


            servicio.ubicaciones.push({

                lat:
                    empleado.lat,

                lon:
                    empleado.lon,

                rango:
                    empleado.rango

            });

        }
    );

}



/* =====================================================
   INICIAR SISTEMA
===================================================== */

function iniciarSistema() {

    mostrarEstado(
        "Obteniendo ubicación..."
    );


    obtenerGPS();

}



/* =====================================================
   OBTENER GPS
===================================================== */

function obtenerGPS() {

    if (
        !navigator.geolocation
    ) {

        mostrarError(
            "Este dispositivo no permite obtener ubicación."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;


            const lon =
                position.coords.longitude;


            identificarServicio(
                lat,
                lon
            );

        },


        function(error) {

            console.error(error);


            mostrarError(

                "No fue posible obtener tu ubicación. " +

                "Activa el GPS y permite el acceso a la ubicación."

            );

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                15000,

            maximumAge:
                0

        }

    );

}



/* =====================================================
   IDENTIFICAR SERVICIO POR GPS
===================================================== */

function identificarServicio(
    lat,
    lon
) {

    let servicioEncontrado =
        null;


    let distanciaMenor =
        Infinity;



    servicios.forEach(
        servicio => {

            /*
               Revisamos TODAS las coordenadas
               que tenga ese servicio.
            */

            servicio.ubicaciones.forEach(
                ubicacion => {

                    const distancia =
                        calcularDistancia(

                            lat,
                            lon,

                            ubicacion.lat,
                            ubicacion.lon

                        );


                    if (

                        distancia <=
                        ubicacion.rango &&

                        distancia <
                        distanciaMenor

                    ) {

                        distanciaMenor =
                            distancia;


                        servicioEncontrado =
                            servicio;

                    }

                }
            );

        }
    );



    /* =========================================
       SI ENCONTRÓ SERVICIO
    ========================================== */

    if (
        servicioEncontrado
    ) {

        entrarAlServicio(
            servicioEncontrado
        );

        return;

    }



    /* =========================================
       FUERA DE SERVICIO
    ========================================== */

    mostrarEstado(
        "Ubicación fuera de un servicio registrado."
    );


    document.getElementById(
        "servicioCard"
    ).classList.remove(
        "oculto"
    );


    document.getElementById(
        "servicioIdentificado"
    ).textContent =
        "FUERA DE SERVICIO";


    /*
       ENCABEZADO FUERA DE SERVICIO
    */

    document.getElementById(
        "tituloServicio"
    ).textContent =
        "FUERA DE SERVICIO";


    /*
       Cuando está fuera de un servicio,
       PERSONAL y APOYO no se habilitan.

       Solo ADMINISTRATIVO.
    */

    document.getElementById(
        "tipoRegistro"
    ).innerHTML =

        '<button onclick="seleccionarAdministrativo()">' +

        'ADMINISTRATIVO' +

        '</button>';


    document.getElementById(
        "administrativoCard"
    ).classList.remove(
        "oculto"
    );

}



/* =====================================================
   ENTRAR AL SERVICIO
===================================================== */

function entrarAlServicio(
    servicio
) {

    servicioActual =
        servicio;



    document.getElementById(
        "servicioCard"
    ).classList.remove(
        "oculto"
    );


    /*
       MOSTRAR SOLAMENTE EL CÓDIGO DEL SERVICIO
       EN EL ENCABEZADO.
    */

    document.getElementById(
        "tituloServicio"
    ).textContent =
        servicio.codigo;


    /*
       El texto interno también muestra
       únicamente el código.
    */

    document.getElementById(
        "servicioIdentificado"
    ).textContent =
        servicio.codigo;



    /*
       Volvemos a mostrar las TRES opciones
       cuando estamos dentro de un servicio.
    */

    document.getElementById(
        "tipoRegistro"
    ).innerHTML =

        '<button onclick="seleccionarPersonal()">' +

        'PERSONAL DEL SERVICIO' +

        '</button>' +


        '<button onclick="seleccionarApoyo()">' +

        'APOYO' +

        '</button>' +


        '<button onclick="seleccionarAdministrativo()">' +

        'ADMINISTRATIVO' +

        '</button>';



    document.getElementById(
        "tipoRegistro"
    ).classList.remove(
        "oculto"
    );



    ocultarTodosLosFormularios();


    mostrarEstado(
        "Ubicación validada correctamente."
    );

}



/* =====================================================
   OCULTAR FORMULARIOS
===================================================== */

function ocultarTodosLosFormularios() {

    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );

}



/* =====================================================
   PERSONAL DEL SERVICIO
===================================================== */

function seleccionarPersonal() {

    document.getElementById(
        "personalCard"
    ).classList.remove(
        "oculto"
    );


    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );


    cargarPersonalServicio();

}



/* =====================================================
   CARGAR PERSONAL
===================================================== */

function cargarPersonalServicio() {

    const select =
        document.getElementById(
            "personalSelect"
        );


    select.innerHTML =

        '<option value="">' +

        'Seleccione una persona' +

        '</option>';


    if (
        !servicioActual
    ) {

        return;

    }



    /*
       PERSONAL DEL SERVICIO:

       GUARDIA
       +
       MONITORISTA

       Únicamente del servicio identificado.
    */

    personalServicio =
        empleados.filter(

            empleado =>

                empleado.codigoServicio ===
                servicioActual.codigo &&

                (
                    empleado.posicion ===
                    "GUARDIA"

                    ||

                    empleado.posicion ===
                    "MONITORISTA"
                )

        );



    personalServicio.forEach(
        empleado => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                empleado.numero;


            option.textContent =
                empleado.nombre;


            select.appendChild(
                option
            );

        }
    );

}



/* =====================================================
   ACTUALIZAR NÚMERO PERSONAL
===================================================== */

function actualizarNumeroPersonal() {

    const numero =
        document.getElementById(
            "personalSelect"
        ).value;


    document.getElementById(
        "numeroPersonal"
    ).value =
        numero;

}



/* =====================================================
   CONTINUAR PERSONAL
===================================================== */

function continuarPersonal() {

    const numero =
        document.getElementById(
            "personalSelect"
        ).value;


    if (!numero) {

        alert(
            "Seleccione una persona."
        );

        return;

    }



    const empleado =
        empleados.find(

            e =>

                e.numero === numero &&

                e.codigoServicio ===
                servicioActual.codigo &&

                (
                    e.posicion ===
                    "GUARDIA"

                    ||

                    e.posicion ===
                    "MONITORISTA"
                )

        );



    if (!empleado) {

        alert(
            "No se encontró el empleado en el servicio identificado."
        );

        return;

    }



    abrirFormulario(

        empleado.nombre,

        empleado.numero,

        "PERSONAL",

        empleado.servicio

    );

}



/* =====================================================
   APOYO
===================================================== */

function seleccionarApoyo() {

    document.getElementById(
        "apoyoCard"
    ).classList.remove(
        "oculto"
    );


    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "numeroApoyo"
    ).value = "";


    document.getElementById(
        "nombreApoyo"
    ).value = "";


    document.getElementById(
        "servicioOrigen"
    ).textContent = "-";


    empleadoApoyoActual =
        null;

}



/* =====================================================
   RECONOCER APOYO
===================================================== */

function reconocerApoyo() {

    const numero =
        document.getElementById(
            "numeroApoyo"
        ).value.trim();


    const empleado =
        empleados.find(

            e =>
                e.numero === numero

        );


    if (!empleado) {

        document.getElementById(
            "nombreApoyo"
        ).value = "";


        document.getElementById(
            "servicioOrigen"
        ).textContent = "-";


        empleadoApoyoActual =
            null;


        return;

    }



    empleadoApoyoActual =
        empleado;


    document.getElementById(
        "nombreApoyo"
    ).value =
        empleado.nombre;


    document.getElementById(
        "servicioOrigen"
    ).textContent =
        empleado.servicio;

}



/* =====================================================
   CONTINUAR APOYO
===================================================== */

function continuarApoyo() {

    if (
        !empleadoApoyoActual
    ) {

        alert(
            "Ingrese un número de empleado válido."
        );

        return;

    }



    /*
       IMPORTANTE:

       El servicio de origen NO se compara
       con el servicio identificado por GPS.

       Un apoyo puede venir de cualquier servicio.
    */

    abrirFormulario(

        empleadoApoyoActual.nombre,

        empleadoApoyoActual.numero,

        "APOYO",

        empleadoApoyoActual.servicio

    );

}



/* =====================================================
   ADMINISTRATIVO
===================================================== */

function seleccionarAdministrativo() {

    document.getElementById(
        "administrativoCard"
    ).classList.remove(
        "oculto"
    );


    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "numeroAdministrativo"
    ).value = "";


    document.getElementById(
        "nombreAdministrativo"
    ).value = "";


    document.getElementById(
        "adminResultado"
    ).innerHTML = "";


    empleadoAdministrativoActual =
        null;

}



/* =====================================================
   RECONOCER ADMINISTRATIVO
===================================================== */

function reconocerAdministrativo() {

    const numero =
        document.getElementById(
            "numeroAdministrativo"
        ).value.trim();


    const empleado =
        empleados.find(

            e =>
                e.numero === numero

        );


    empleadoAdministrativoActual =
        null;


    document.getElementById(
        "nombreAdministrativo"
    ).value = "";


    document.getElementById(
        "adminResultado"
    ).innerHTML = "";


    if (!empleado) {

        return;

    }



    /*
       VALIDACIÓN DE POSICIÓN
    */

    if (
        empleado.posicion !==
        "ADMINISTRATIVO"
    ) {

        document.getElementById(
            "adminResultado"
        ).innerHTML =

            '<div class="error">' +

            'Este empleado no está registrado como ADMINISTRATIVO.' +

            '</div>';

        return;

    }



    empleadoAdministrativoActual =
        empleado;


    document.getElementById(
        "nombreAdministrativo"
    ).value =
        empleado.nombre;


    document.getElementById(
        "adminResultado"
    ).innerHTML =

        '<div class="exito">' +

        'Empleado administrativo validado. Registro: CENTRAL.' +

        '</div>';

}



/* =====================================================
   CONTINUAR ADMINISTRATIVO
===================================================== */

function continuarAdministrativo() {

    if (
        !empleadoAdministrativoActual
    ) {

        alert(
            "Ingrese un número de empleado administrativo válido."
        );

        return;

    }



    /*
       SIN IMPORTAR LA UBICACIÓN GPS:

       ADMINISTRATIVO
       →
       CENTRAL
    */

    abrirFormulario(

        empleadoAdministrativoActual.nombre,

        empleadoAdministrativoActual.numero,

        "ADMINISTRATIVO",

        SERVICIO_CENTRAL

    );

}



/* =====================================================
   ABRIR GOOGLE FORMS
===================================================== */

function abrirFormulario(

    nombre,
    numero,
    tipo,
    servicio

) {


    const url =

        "https://docs.google.com/forms/d/e/" +

/* =====================================================
   DISTANCIA HAVERSINE
===================================================== */

function calcularDistancia(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const R =
        6371000;


    const rad =
        Math.PI / 180;


    const dLat =
        (lat2 - lat1) * rad;


    const dLon =
        (lon2 - lon1) * rad;


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);



    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );



    return R * c;

}
