<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torre de Control</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select,
button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
}

input,
select {
    border: 1px solid #ccc;
    background: white;
}

button {
    border: none;
    background: #1f4e79;
    color: white;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.oculto {
    display: none;
}

.info {
    background: #eef4f8;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.exito {
    background: #e8f5e9;
    padding: 12px;
    border-radius: 8px;
    color: #256029;
}

.error {
    background: #fdecea;
    padding: 12px;
    border-radius: 8px;
    color: #a12622;
}

.origen {
    margin-top: 12px;
    padding: 10px;
    background: #f3f3f3;
    border-radius: 8px;
}

.pequeno {
    font-size: 13px;
    color: #666;
    margin-top: 8px;
}

</style>
