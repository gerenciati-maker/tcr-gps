<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Personal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .encabezado {
      text-align: center;
    }

    .icono {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      color: #222;
    }

    .servicio {
      margin-top: 8px;
      font-size: 17px;
      font-weight: bold;
      color: #555;
    }

    .estado {
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      background: #f1f3f5;
    }

    .correcto {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .incorrecto {
      background: #ffebee;
      color: #b71c1c;
    }

    .error {
      background: #fff3e0;
      color: #e65100;
    }

    .seleccion {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    .boton {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .distancia {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .pie {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }

    #registro {
      display: none;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">

      <div class="icono">📍</div>

      <h1>Registro de Personal</h1>

      <div id="nombreServicio" class="servicio">
        Verificando servicio...
      </div>

    </div>


    <!-- ============================= -->
    <!-- ESTADO GPS -->
    <!-- ============================= -->

    <div id="estado" class="estado">
      📡 Verificando ubicación...
    </div>

    <div id="distancia" class="distancia"></div>


    <!-- ============================= -->
    <!-- SELECCIÓN DE PERSONAL -->
    <!-- ============================= -->

    <div id="registro">

      <div class="seleccion">

        <label for="nombre">
          Nombre
        </label>

        <select id="nombre">
          <option value="">
            Selecciona tu nombre
          </option>
        </select>

      </div>


      <div class="seleccion">

        <label for="numero">
          Número de empleado
        </label>

        <select id="numero">

          <option value="">
            Selecciona tu número
          </option>

        </select>

      </div>


      <button
        id="continuar"
        class="boton"
        disabled
        onclick="irAForms()"
      >
        CONTINUAR
      </button>

    </div>


    <div class="pie">
      Registro sujeto a validación de ubicación.
    </div>

  </div>


  <script>

    // =====================================================
    // BASE DE DATOS DE PRUEBA
    // =====================================================

    const empleados = [

      {
        nombre: "ZAFRA ZAPATA FABIOLA",
        numero: "2911",
        servicio: "ID-00000 - TCR",
        latitud: 19.025264352182592,
        longitud: -98.26070419184016,
        rango: 100
      },

      {
        nombre: "LINOS AMADOR BEATRIZ",
        numero: "2842",
        servicio: "ID-00000 - TCR",
        latitud: 19.025264352182592,
        longitud: -98.26070419184016,
        rango: 100
      },

      {
        nombre: "RIVERA AGUILAR CAROLINA",
        numero: "2923",
        servicio: "ID-00000 - TCR",
        latitud: 19.025264352182592,
        longitud: -98.26070419184016,
        rango: 100
      },

      {
        nombre: "ROBLES TORRES VICTOR",
        numero: "1925",
        servicio: "ID-00167 - OFICINAS CENTRALES",
        latitud: 19.04531982190356,
        longitud: -98.2050086979645,
        rango: 100
      }

    ];


    // =====================================================
    // FORMS
    // =====================================================

    const FORMS_BASE =
      "https://docs.google.com/forms/d/e/1FAIpQLSeKDOEdUlS75ivHlBWG4qVo-PdaL8KLWBa3GM9IYbX6I6ptnQ/viewform";


    // =====================================================
    // OBTENER SERVICIO DEL QR
    // =====================================================

    const parametros = new URLSearchParams(
      window.location.search
    );

    const servicioQR = parametros.get("servicio");


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const nombreServicio =
      document.getElementById("nombreServicio");

    const estado =
      document.getElementById("estado");

    const distanciaElemento =
      document.getElementById("distancia");

    const registro =
      document.getElementById("registro");

    const nombreSelect =
      document.getElementById("nombre");

    const numeroSelect =
      document.getElementById("numero");

    const botonContinuar =
      document.getElementById("continuar");


    let servicioActual = null;
    let empleadosServicio = [];


    // =====================================================
    // BUSCAR SERVICIO
    // =====================================================

    function buscarServicio() {

      if (!servicioQR) {

        mostrarError(
          "Este QR no tiene un servicio identificado."
        );

        return;
      }


      if (servicioQR === "TCR") {

        empleadosServicio =
          empleados.filter(
            empleado =>
              empleado.servicio === "ID-00000 - TCR"
          );

        servicioActual =
          empleadosServicio[0];

        nombreServicio.innerHTML =
          "Servicio: ID-00000 - TCR";

      }


      else if (servicioQR === "CENTRAL") {

        empleadosServicio =
          empleados.filter(
            empleado =>
              empleado.servicio ===
              "ID-00167 - OFICINAS CENTRALES"
          );

        servicioActual =
          empleadosServicio[0];

        nombreServicio.innerHTML =
          "Servicio: ID-00167 - OFICINAS CENTRALES";

      }


      else {

        mostrarError(
          "El servicio de este QR no está configurado."
        );

        return;
      }


      if (!servicioActual) {

        mostrarError(
          "No hay personal configurado para este servicio."
        );

        return;
      }


      verificarUbicacion();
    }


    // =====================================================
    // DISTANCIA
    // =====================================================

    function calcularDistancia(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const rad =
        Math.PI / 180;

      const dLat =
        (lat2 - lat1) * rad;

      const dLon =
        (lon2 - lon1) * rad;

      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;
    }


    // =====================================================
    // GPS
    // =====================================================

    function verificarUbicacion() {

      if (!navigator.geolocation) {

        mostrarError(
          "Este dispositivo no permite obtener la ubicación."
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitud =
            position.coords.latitude;

          const longitud =
            position.coords.longitude;


          const distancia =
            calcularDistancia(

              latitud,
              longitud,

              servicioActual.latitud,
              servicioActual.longitud

            );


          distanciaElemento.innerHTML =
            "Distancia aproximada: <strong>" +
            Math.round(distancia) +
            " metros</strong>";


          if (
            distancia <=
            servicioActual.rango
          ) {

            estado.className =
              "estado correcto";

            estado.innerHTML =
              "✅ <strong>Ubicación validada</strong><br>" +
              "Estás dentro del área autorizada.";


            cargarEmpleados();

          }

          else {

            estado.className =
              "estado incorrecto";

            estado.innerHTML =
              "❌ <strong>Fuera del área autorizada</strong><br>" +
              "No es posible realizar el registro.";

          }

        },


        function(error) {

          let mensaje;

          switch(error.code) {

            case error.PERMISSION_DENIED:

              mensaje =
                "Debes permitir el acceso a la ubicación.";

              break;

            case error.POSITION_UNAVAILABLE:

              mensaje =
                "No fue posible obtener tu ubicación.";

              break;

            case error.TIMEOUT:

              mensaje =
                "La ubicación tardó demasiado.";

              break;

            default:

              mensaje =
                "Ocurrió un error al obtener la ubicación.";

          }

          mostrarError(mensaje);

        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    }


    // =====================================================
    // MOSTRAR PERSONAL
    // =====================================================

    function cargarEmpleados() {

      registro.style.display =
        "block";


      empleadosServicio.forEach(
        empleado => {

          const opcionNombre =
            document.createElement("option");

          opcionNombre.value =
            empleado.nombre;

          opcionNombre.textContent =
            empleado.nombre;

          nombreSelect.appendChild(
            opcionNombre
          );


          const opcionNumero =
            document.createElement("option");

          opcionNumero.value =
            empleado.numero;

          opcionNumero.textContent =
            empleado.numero;

          numeroSelect.appendChild(
            opcionNumero
          );

        }
      );

    }


    // =====================================================
    // VALIDAR SELECCIÓN
    // =====================================================

    nombreSelect.addEventListener(
      "change",
      validarFormulario
    );

    numeroSelect.addEventListener(
      "change",
      validarFormulario
    );


    function validarFormulario() {

      if (
        nombreSelect.value !== "" &&
        numeroSelect.value !== ""
      ) {

        botonContinuar.disabled =
          false;

      }

      else {

        botonContinuar.disabled =
          true;

      }

    }


    // =====================================================
    // IR AL FORMS
    // =====================================================

    function irAForms() {

      const nombre =
        encodeURIComponent(
          nombreSelect.value
        );

      const numero =
        encodeURIComponent(
          numeroSelect.value
        );


      let servicio =
        encodeURIComponent(
          servicioActual.servicio
        );


      const url =
        FORMS_BASE +
        "?usp=pp_url" +
        "&entry.1973773208=" +
        servicio +
        "&entry.612785713=" +
        nombre +
        "&entry.2013854503=" +
        numero;


      window.location.href =
        url;

    }


    // =====================================================
    // ERROR
    // =====================================================

    function mostrarError(mensaje) {

      estado.className =
        "estado error";

      estado.innerHTML =
        "⚠️ <strong>Error</strong><br><br>" +
        mensaje;

    }


    // =====================================================
    // INICIAR
    // =====================================================

    buscarServicio();

  </script>

</body>
</html>
