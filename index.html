<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre de Control - Registro QR</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#071b33;
    color:#fff;
    min-height:100vh;
}

.header{
    background:#0b2b50;
    border-bottom:3px solid #d4af37;
    padding:18px 20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:25px;
    color:#fff;
}

.header p{
    margin:6px 0 0;
    color:#d4af37;
    font-size:14px;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:18px;
}

.card{
    background:#0d3158;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.card h2{
    margin:0 0 14px;
    font-size:19px;
    color:#d4af37;
}

.hidden{
    display:none!important;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

select,
input{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #53708f;
    background:#071b33;
    color:#fff;
    font-size:15px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#d4af37;
}

button{
    width:100%;
    border:0;
    border-radius:9px;
    padding:14px;
    margin-top:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.btn-primary{
    background:#d4af37;
    color:#071b33;
}

.btn-secondary{
    background:#19558b;
    color:#fff;
}

.btn-danger{
    background:#b93636;
    color:#fff;
}

.btn-success{
    background:#218c57;
    color:#fff;
}

.btn-dark{
    background:#071b33;
    color:#fff;
    border:1px solid #53708f;
}

.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.service-info{
    background:#071b33;
    border-radius:10px;
    padding:14px;
    line-height:1.6;
}

.service-title{
    color:#d4af37;
    font-weight:bold;
    font-size:17px;
    margin-bottom:5px;
}

.info-row{
    margin:3px 0;
}

.status{
    border-radius:10px;
    padding:13px;
    margin-bottom:15px;
    font-weight:bold;
    text-align:center;
    display:none;
}

.status.info{
    display:block;
    background:#12456e;
    color:#fff;
}

.status.success{
    display:block;
    background:#145d3c;
    color:#fff;
}

.status.error{
    display:block;
    background:#722d2d;
    color:#fff;
}

.status.warning{
    display:block;
    background:#765d16;
    color:#fff;
}

.person-box{
    background:#071b33;
    border:1px solid #315879;
    border-radius:10px;
    padding:13px;
    margin-top:12px;
}

.person-name{
    font-size:18px;
    font-weight:bold;
    color:#d4af37;
}

.person-data{
    font-size:14px;
    margin-top:5px;
    line-height:1.5;
}

.registration-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.registration-buttons button{
    margin-top:0;
    min-height:65px;
    font-size:17px;
}

.registration-selected{
    outline:3px solid #d4af37;
}

.camera-box{
    background:#071b33;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

#video{
    width:100%;
    max-height:380px;
    object-fit:cover;
    border-radius:10px;
    background:#000;
}

#canvas{
    display:none;
}

#fotoPreview{
    width:100%;
    max-height:380px;
    object-fit:contain;
    border-radius:10px;
    margin-top:10px;
}

.small{
    font-size:12px;
    color:#b9c9d9;
}

.gps-ok{
    color:#55d98a;
    font-weight:bold;
}

.gps-error{
    color:#ff7070;
    font-weight:bold;
}

@media(max-width:650px){

    .grid2{
        grid-template-columns:1fr;
    }

    .registration-buttons{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    .header h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>TORRE DE CONTROL</h1>
    <p>REGISTRO DE ASISTENCIA QR</p>
</div>

<div class="container">

    <div id="estado" class="status"></div>

    <!-- SERVICIO -->
    <div id="cardServicio" class="card hidden">

        <h2>Servicio detectado</h2>

        <div class="service-info">

            <div class="service-title" id="txtServicio">
                Buscando servicio...
            </div>

            <div class="info-row">
                <strong>Inmueble:</strong>
                <span id="txtInmueble">---</span>
            </div>

            <div class="info-row">
                <strong>Ubicación:</strong>
                <span id="txtUbicacion">---</span>
            </div>

            <div class="info-row">
                <strong>GPS:</strong>
                <span id="txtGPS">
                    Buscando ubicación...
                </span>
            </div>

        </div>

        <button
            id="btnPersonalServicio"
            class="btn-primary"
            onclick="mostrarPersonalServicio()">
            PERSONAL DEL SERVICIO
        </button>

        <button
            id="btnApoyo"
            class="btn-secondary"
            onclick="mostrarApoyo()">
            APOYO
        </button>

        <button
            id="btnAdministrativo"
            class="btn-dark"
            onclick="mostrarAdministrativo()">
            ADMINISTRATIVO
        </button>

    </div>


    <!-- PERSONAL -->
    <div id="cardPersonal" class="card hidden">

        <h2>Personal del servicio</h2>

        <label for="puestoPersonal">
            Puesto
        </label>

        <select
            id="puestoPersonal"
            onchange="cargarPersonalPorPuesto()">

            <option value="">
                Seleccione puesto
            </option>

            <option value="GUARDIA">
                GUARDIA
            </option>

            <option value="MONITORISTA">
                MONITORISTA
            </option>

            <option value="ERI">
                ERI
            </option>

        </select>


        <div
            id="contenedorPersonal"
            class="hidden"
            style="margin-top:12px;">

            <label for="empleadoPersonal">
                Empleado
            </label>

            <select
                id="empleadoPersonal"
                onchange="seleccionarPersonal()">

                <option value="">
                    Seleccione empleado
                </option>

            </select>

        </div>


        <div
            id="datosPersonal"
            class="person-box hidden">
        </div>

    </div>


    <!-- APOYO -->
    <div id="cardApoyo" class="card hidden">

        <h2>Registro de apoyo</h2>

        <label for="numeroApoyo">
            Número de empleado
        </label>

        <input
            id="numeroApoyo"
            type="text"
            inputmode="numeric"
            placeholder="Ingrese número de empleado">

        <button
            class="btn-secondary"
            onclick="buscarApoyo()">
            BUSCAR APOYO
        </button>

        <div
            id="datosApoyo"
            class="person-box hidden">
        </div>

    </div>


    <!-- ADMINISTRATIVO -->
    <div
        id="cardAdministrativo"
        class="card hidden">

        <h2>Registro administrativo</h2>

        <label for="numeroAdministrativo">
            Número de empleado
        </label>

        <input
            id="numeroAdministrativo"
            type="text"
            inputmode="numeric"
            placeholder="Ingrese número de empleado">

        <button
            class="btn-secondary"
            onclick="buscarAdministrativo()">
            BUSCAR ADMINISTRATIVO
        </button>

        <div
            id="datosAdministrativo"
            class="person-box hidden">
        </div>

    </div>


    <!-- REGISTRO -->
    <div id="cardRegistro" class="card hidden">

        <h2>Tipo de registro</h2>

        <div
            id="datosRegistro"
            class="person-box">
        </div>


        <div
            id="mensajeCandado"
            class="status warning hidden"
            style="margin-top:12px;">
        </div>


        <div
            id="botonesRegistro"
            class="registration-buttons"
            style="margin-top:14px;">

            <button
                id="btnEntrada"
                class="btn-success"
                onclick="seleccionarTipoRegistro('ENTRADA')">

                ENTRADA

            </button>


            <button
                id="btnSalida"
                class="btn-danger"
                onclick="seleccionarTipoRegistro('SALIDA')">

                SALIDA

            </button>

        </div>

    </div>


    <!-- FOTO -->
    <div id="cardFoto" class="card hidden">

        <h2>Fotografía del registro</h2>

        <div class="camera-box">

            <video
                id="video"
                autoplay
                playsinline>
            </video>

            <canvas id="canvas"></canvas>


            <img
                id="fotoPreview"
                class="hidden"
                alt="Vista previa">


            <button
                id="btnTomarFoto"
                class="btn-primary"
                onclick="tomarFotografia()">

                TOMAR FOTOGRAFÍA

            </button>


            <button
                id="btnRepetirFoto"
                class="btn-secondary hidden"
                onclick="repetirFotografia()">

                REPETIR FOTOGRAFÍA

            </button>

        </div>


        <button
            id="btnEnviar"
            class="btn-success"
            onclick="enviarRegistro()"
            disabled>

            ENVIAR REGISTRO

        </button>


        <button
            class="btn-danger"
            onclick="cancelarRegistro()">

            CANCELAR

        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ID_ARCHIVO =
    "1zdYovCmbhHOyMVy-huWqzgB6Q5x1XgL8dghe263TTbU";

const ID_BASE_QR =
    "1049929211";

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwRaqv3bUBUzwJiXfX0yOjQldn51NkNMZiL8OaVw3n4RBCbA0raBqw9heAlbgLLgi3DSQ/exec";

const CODIGO_ADMIN =
    "CENTRAL";

const SERVICIO_CENTRAL =
    "ID-00167 - OFICINAS CENTRALES";


/* =========================================================
   VARIABLES
========================================================= */

let empleados = [];

let servicios = new Map();

let personalServicio = [];

let empleadoPersonalActual = null;

let servicioActual = null;

let empleadoApoyoActual = null;

let empleadoAdministrativoActual = null;

let ubicacionActual = {
    latitud:null,
    longitud:null,
    precisionGPS:null
};

let registroPendiente = null;

let fotoRegistroBase64 = "";

let fotoRegistroNombre = "";

let enviandoRegistro = false;

let consultaCandadoActual = 0;

let streamCamara = null;


/* =========================================================
   INICIO
========================================================= */

window.onload = function(){

    cargarBaseQR();

};


/* =========================================================
   ESTADOS
========================================================= */

function mostrarEstado(
    mensaje,
    tipo
){

    const elemento =
        document.getElementById("estado");

    elemento.textContent =
        mensaje;

    elemento.className =
        "status " +
        (tipo || "info");

    elemento.style.display =
        "block";

}


function ocultarEstado(){

    const elemento =
        document.getElementById("estado");

    elemento.style.display =
        "none";

}


/* =========================================================
   CARGAR BASE QR
========================================================= */

function cargarBaseQR(){

    mostrarEstado(
        "Cargando personal y servicios...",
        "info"
    );

    const callbackName =
        "callbackBaseQR_" +
        Date.now();

    window[callbackName] =
        function(data){

            try{

                console.log(
                    "RESPUESTA BASE QR:",
                    data
                );

                if(
                    !data ||
                    data.ok !== true
                ){

                    throw new Error(
                        data && data.error
                            ? data.error
                            : "La BASE_QR no respondió correctamente."
                    );

                }

                empleados =
                    Array.isArray(
                        data.empleados
                    )
                    ? data.empleados
                    : [];


                empleados =
                    empleados.filter(
                        function(e){

                            const estatus =
                                String(
                                    e.estatus || ""
                                )
                                .trim()
                                .toUpperCase();

                            return (
                                !estatus ||
                                estatus === "ACTIVO" ||
                                estatus === "ACTIVA"
                            );

                        }
                    );


                construirServicios();

                ocultarEstado();

                obtenerUbicacion();

            }
            catch(error){

                console.error(
                    "ERROR BASE QR:",
                    error
                );

                mostrarEstado(
                    "Error al procesar BASE_QR: " +
                    error.message,
                    "error"
                );

            }
            finally{

                try{

                    delete window[
                        callbackName
                    ];

                }
                catch(e){}

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.async = true;


    script.src =
        URL_APPS_SCRIPT +
        "?action=base" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        ) +
        "&t=" +
        Date.now();


    console.log(
        "URL BASE QR:",
        script.src
    );


    script.onerror =
        function(){

            mostrarEstado(
                "No fue posible conectar con Apps Script.",
                "error"
            );

            try{

                delete window[
                    callbackName
                ];

            }
            catch(e){}

        };


    document.head.appendChild(
        script
    );


    setTimeout(
        function(){

            try{

                delete window[
                    callbackName
                ];

            }
            catch(e){}

            if(script.parentNode){

                script.parentNode.removeChild(
                    script
                );

            }

        },
        30000
    );

}


/* =========================================================
   CONSTRUIR SERVICIOS
========================================================= */

function construirServicios(){

    servicios.clear();

    empleados.forEach(
        function(e){

            const codigo =
                String(
                    e.codigoServicio || ""
                ).trim();

            const nombreServicio =
                String(
                    e.servicio || ""
                ).trim();

            const clave =
                codigo ||
                nombreServicio;

            if(!clave){

                return;

            }


            if(!servicios.has(clave)){

                servicios.set(
                    clave,
                    {
                        codigoServicio:
                            codigo,

                        servicio:
                            nombreServicio,

                        inmueble:
                            String(
                                e.inmueble || ""
                            ).trim(),

                        ubicacion:
                            String(
                                e.ubicacion || ""
                            ).trim(),

                        latitud:
                            parseFloat(
                                e.latitud
                            ),

                        longitud:
                            parseFloat(
                                e.longitud
                            ),

                        radio:
                            parseFloat(
                                e.radio
                            ) || 200
                    }
                );

            }

        }
    );

}


/* =========================================================
   GPS
========================================================= */

function obtenerUbicacion(){

    if(
        !navigator.geolocation
    ){

        document.getElementById(
            "txtGPS"
        ).textContent =
            "GPS no disponible.";

        document.getElementById(
            "txtGPS"
        ).className =
            "gps-error";

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            ubicacionActual.latitud =
                position.coords.latitude;

            ubicacionActual.longitud =
                position.coords.longitude;

            ubicacionActual.precisionGPS =
                position.coords.accuracy;


            document.getElementById(
                "txtGPS"
            ).textContent =
                "OK | Precisión: " +
                Math.round(
                    position.coords.accuracy
                ) +
                " m";


            document.getElementById(
                "txtGPS"
            ).className =
                "gps-ok";


            identificarServicio();

        },


        function(error){

            let mensaje =
                "No se pudo obtener GPS.";

            if(error.code === 1){

                mensaje =
                    "Permiso de ubicación denegado.";

            }

            if(error.code === 2){

                mensaje =
                    "Ubicación no disponible.";

            }

            if(error.code === 3){

                mensaje =
                    "Tiempo agotado al obtener ubicación.";

            }


            document.getElementById(
                "txtGPS"
            ).textContent =
                mensaje;


            document.getElementById(
                "txtGPS"
            ).className =
                "gps-error";


            mostrarEstado(
                mensaje,
                "error"
            );

        },


        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}


/* =========================================================
   DISTANCIA
========================================================= */

function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2-lat1) *
        rad;

    const dLon =
        (lon2-lon1) *
        rad;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(lat1*rad) *
        Math.cos(lat2*rad) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;

}


/* =========================================================
   IDENTIFICAR SERVICIO
========================================================= */

function identificarServicio(){

    let servicioEncontrado =
        null;

    let menorDistancia =
        Infinity;


    servicios.forEach(
        function(servicio){

            if(
                !isFinite(
                    servicio.latitud
                ) ||
                !isFinite(
                    servicio.longitud
                )
            ){

                return;

            }


            const distancia =
                distanciaMetros(
                    ubicacionActual.latitud,
                    ubicacionActual.longitud,
                    servicio.latitud,
                    servicio.longitud
                );


            const radio =
                servicio.radio ||
                200;


            if(
                distancia <= radio &&
                distancia < menorDistancia
            ){

                menorDistancia =
                    distancia;

                servicioEncontrado =
                    servicio;

            }

        }
    );


    if(!servicioEncontrado){

        mostrarEstado(
            "No se encontró un servicio dentro del radio permitido.",
            "error"
        );

        return;

    }


    entrarAlServicio(
        servicioEncontrado,
        menorDistancia
    );

}


/* =========================================================
   ENTRAR SERVICIO
========================================================= */

function entrarAlServicio(
    servicio,
    distancia
){

    servicioActual =
        servicio;


    document.getElementById(
        "cardServicio"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "txtServicio"
    ).textContent =
        servicio.servicio ||
        servicio.codigoServicio ||
        "---";


    document.getElementById(
        "txtInmueble"
    ).textContent =
        servicio.inmueble ||
        "---";


    document.getElementById(
        "txtUbicacion"
    ).textContent =
        servicio.ubicacion ||
        "---";


    mostrarEstado(
        "Servicio identificado correctamente. Distancia aproximada: " +
        Math.round(distancia) +
        " m.",
        "success"
    );

}


/* =========================================================
   OCULTAR TARJETAS
========================================================= */

function ocultarTarjetas(){

    document.getElementById(
        "cardPersonal"
    ).classList.add("hidden");

    document.getElementById(
        "cardApoyo"
    ).classList.add("hidden");

    document.getElementById(
        "cardAdministrativo"
    ).classList.add("hidden");

}


/* =========================================================
   PERSONAL SERVICIO
========================================================= */

function mostrarPersonalServicio(){

    if(!servicioActual){

        mostrarEstado(
            "Primero debe identificarse el servicio.",
            "error"
        );

        return;

    }


    ocultarTarjetas();


    document.getElementById(
        "cardPersonal"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "puestoPersonal"
    ).value =
        "";


    document.getElementById(
        "contenedorPersonal"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "datosPersonal"
    ).classList.add(
        "hidden"
    );


    empleadoPersonalActual =
        null;

}


/* =========================================================
   CARGAR PERSONAL
========================================================= */

function cargarPersonalPorPuesto(){

    const puesto =
        document.getElementById(
            "puestoPersonal"
        ).value;


    const select =
        document.getElementById(
            "empleadoPersonal"
        );


    select.innerHTML =
        '<option value="">Seleccione empleado</option>';


    empleadoPersonalActual =
        null;


    document.getElementById(
        "datosPersonal"
    ).classList.add(
        "hidden"
    );


    if(!puesto){

        document.getElementById(
            "contenedorPersonal"
        ).classList.add(
            "hidden"
        );

        return;

    }


    personalServicio =
        empleados.filter(
            function(e){

                const puestoEmpleado =
                    String(
                        e.posicion || ""
                    )
                    .trim()
                    .toUpperCase();


                const codigoEmpleado =
                    String(
                        e.codigoServicio || ""
                    ).trim();


                const servicioEmpleado =
                    String(
                        e.servicio || ""
                    ).trim();


                const codigoActual =
                    String(
                        servicioActual.codigoServicio || ""
                    ).trim();


                const nombreActual =
                    String(
                        servicioActual.servicio || ""
                    ).trim();


                const mismoServicio =

                    (
                        codigoEmpleado &&
                        codigoActual &&
                        codigoEmpleado ===
                        codigoActual
                    )

                    ||

                    (
                        servicioEmpleado &&
                        nombreActual &&
                        servicioEmpleado ===
                        nombreActual
                    );


                return (
                    puestoEmpleado ===
                    puesto &&
                    mismoServicio
                );

            }
        );


    personalServicio.sort(
        function(a,b){

            return String(
                a.nombre || ""
            ).localeCompare(
                String(
                    b.nombre || ""
                ),
                "es"
            );

        }
    );


    personalServicio.forEach(
        function(e){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                String(
                    e.numeroEmpleado || ""
                );


            option.textContent =
                String(
                    e.nombre ||
                    "SIN NOMBRE"
                ) +
                " | " +
                String(
                    e.numeroEmpleado || ""
                );


            select.appendChild(
                option
            );

        }
    );


    document.getElementById(
        "contenedorPersonal"
    ).classList.remove(
        "hidden"
    );


    if(
        personalServicio.length === 0
    ){

        mostrarEstado(
            "No se encontró personal de este puesto asignado al servicio.",
            "warning"

/* =========================================================
   CONSULTAR CANDADO
========================================================= */

function consultarCandadoEmpleado(){

    if(!registroPendiente){

        return;

    }


    const numero =
        String(
            registroPendiente.numeroEmpleado ||
            ""
        ).trim();


    const posicion =
        String(
            registroPendiente.posicion ||
            ""
        ).trim();


    if(!numero){

        mostrarEstado(
            "No se encontró número de empleado.",
            "error"
        );

        return;

    }


    const consultaActual =
        ++consultaCandadoActual;


    mostrarEstado(
        "Validando ciclo de registro...",
        "info"
    );


    const callbackName =
        "callbackCandado_" +
        Date.now() +
        "_" +
        consultaActual;


    window[callbackName] =
        function(data){

            try{

                if(
                    consultaActual !==
                    consultaCandadoActual
                ){

                    return;

                }


                console.log(
                    "RESPUESTA CANDADO:",
                    data
                );


                if(
                    !data ||
                    data.ok !== true
                ){

                    throw new Error(
                        data && data.error
                            ? data.error
                            : "Apps Script no devolvió una respuesta válida."
                    );

                }


                aplicarResultadoCandado(
                    data
                );

            }
            catch(error){

                console.error(
                    "ERROR CANDADO:",
                    error
                );


                mostrarEstado(
                    error.message,
                    "error"
                );


                bloquearBotonesRegistro();

            }
            finally{

                try{

                    delete window[
                        callbackName
                    ];

                }
                catch(e){}

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.async = true;


    script.src =
        URL_APPS_SCRIPT +

        "?action=validar" +

        "&numero=" +
        encodeURIComponent(
            numero
        ) +

        "&posicion=" +
        encodeURIComponent(
            posicion
        ) +

        "&callback=" +
        encodeURIComponent(
            callbackName
        ) +

        "&t=" +
        Date.now();


    console.log(
        "URL VALIDACIÓN:",
        script.src
    );


    script.onerror =
        function(){

            if(
                consultaActual !==
                consultaCandadoActual
            ){

                return;

            }


            mostrarEstado(
                "Error de conexión con la validación de Apps Script.",
                "error"
            );


            bloquearBotonesRegistro();


            try{

                delete window[
                    callbackName
                ];

            }
            catch(e){}

        };


    document.head.appendChild(
        script
    );


    setTimeout(
        function(){

            try{

                delete window[
                    callbackName
                ];

            }
            catch(e){}

            if(script.parentNode){

                script.parentNode.removeChild(
                    script
                );

            }

        },
        20000
    );

}


/* =========================================================
   RESULTADO CANDADO
========================================================= */

function aplicarResultadoCandado(
    data
){

    const entrada =
        document.getElementById(
            "btnEntrada"
        );

    const salida =
        document.getElementById(
            "btnSalida"
        );

    const mensaje =
        document.getElementById(
            "mensajeCandado"
        );


    entrada.disabled =
        true;

    salida.disabled =
        true;


    entrada.classList.remove(
        "registration-selected"
    );

    salida.classList.remove(
        "registration-selected"
    );


    mensaje.classList.add(
        "hidden"
    );


    /*
       ADMINISTRATIVO Y SUPERVISOR
       PUEDEN ELEGIR CUALQUIER REGISTRO.
    */

    if(data.excepcion === true){

        entrada.disabled =
            false;

        salida.disabled =
            false;


        mostrarEstado(
            "Registro administrativo habilitado.",
            "success"
        );

        return;

    }


    const siguiente =
        String(
            data.siguienteRegistro ||
            ""
        ).toUpperCase();


    if(siguiente === "ENTRADA"){

        entrada.disabled =
            false;


        mostrarEstado(
            "Puede realizar ENTRADA.",
            "success"
        );

        return;

    }


    if(siguiente === "SALIDA"){

        salida.disabled =
            false;


        mensaje.textContent =
            "YA ESTÁ REGISTRADO. Tienes un registro pendiente de SALIDA. Debes cerrar tu registro anterior antes de realizar un nuevo registro.";


        mensaje.classList.remove(
            "hidden"
        );


        mostrarEstado(
            "Tiene una ENTRADA pendiente de SALIDA.",
            "warning"
        );


        return;

    }


    bloquearBotonesRegistro();


    mostrarEstado(
        "No se pudo determinar el siguiente registro.",
        "error"
    );

}

/* =========================================================
   CÁMARA
========================================================= */

async function iniciarCamara(){

    detenerCamara();


    try{

        streamCamara =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"user"
                    },
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        const video =
            document.getElementById(
                "video"
            );


        video.srcObject =
            streamCamara;


        video.classList.remove(
            "hidden"
        );


        document.getElementById(
            "btnTomarFoto"
        ).classList.remove(
            "hidden"
        );

    }
    catch(error){

        console.error(
            "ERROR CÁMARA:",
            error
        );


        mostrarEstado(
            "No fue posible abrir la cámara. Verifica los permisos del navegador.",
            "error"
        );

    }

}


function detenerCamara(){

    if(streamCamara){

        streamCamara
            .getTracks()
            .forEach(
                function(track){

                    track.stop();

                }
            );

        streamCamara =
            null;

    }

}


/* =========================================================
   TOMAR FOTO
========================================================= */

function tomarFotografia(){

    const video =
        document.getElementById(
            "video"
        );


    const canvas =
        document.getElementById(
            "canvas"
        );


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        mostrarEstado(
            "La cámara todavía no está lista.",
            "warning"
        );

        return;

    }


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const contexto =
        canvas.getContext(
            "2d"
        );


    contexto.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    fotoRegistroBase64 =
        canvas.toDataURL(
            "image/jpeg",
            0.82
        );


    fotoRegistroNombre =
        "REGISTRO_" +

        (
            registroPendiente
                ? registroPendiente.numeroEmpleado
                : "SIN_NUMERO"
        ) +

        "_" +

        Date.now() +

        ".jpg";


    const preview =
        document.getElementById(
            "fotoPreview"
        );


    preview.src =
        fotoRegistroBase64;


    preview.classList.remove(
        "hidden"
    );


    document.getElementById(
        "btnTomarFoto"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "btnRepetirFoto"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "btnEnviar"
    ).disabled =
        false;


    detenerCamara();


    mostrarEstado(
        "Fotografía tomada correctamente. Puede enviar el registro.",
        "success"
    );

}

async function enviarRegistro(){

        return;

    }


    if(!registroPendiente){

            "No existe un registro pendiente.",
            "error"
        );

    ){

        );

        return;

    }


    if(!fotoRegistroBase64){

        mostrarEstado(

        );

    }


    if(

        ubicacionActual.longitud === null
    ){

        mostrarEstado(

            "error"
        );

        servicioDetectado:
            registroPendiente.servicioDetectado,

        servicioOrigen:
            registroPendiente.servicioOrigen,

        fotoBase64:
            fotoRegistroBase64,

        fotoNombre:
            fotoRegistroNombre

    };


    try{

        await fetch(
            URL_APPS_SCRIPT,
            {
                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        datos
                    )
            }
        );


        mostrarEstado(
            "REGISTRO ENVIADO CORRECTAMENTE.",
            "success"
        );


        detenerCamara();


        setTimeout(
            function(){

                reiniciarRegistro();

            },
            1800
        );

    catch(error){

        console.error(
            "ERROR ENVIANDO:",
            error
        );


        mostrarEstado(

            error.message,
            "error"
        );


        botonEnviar.disabled =
            false;


        botonEnviar.textContent =
            "ENVIAR REGISTRO";


        enviandoRegistro =
            false;

    }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(valor){

    return String(
        valor || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   CERRAR CÁMARA AL SALIR
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        detenerCamara();

    }
);

</script>
