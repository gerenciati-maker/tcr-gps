<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registro de Personal</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.contenedor {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 20px;
}

.dato {
    background: #f1f3f5;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
}

.dato strong {
    display: block;
    margin-bottom: 5px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
    box-sizing: border-box;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #198754;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.tipo {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.tipo button {
    margin-top: 0;
    background: #6c757d;
}

.tipo button:hover {
    background: #495057;
}

.mensaje {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.oculto {
    display: none;
}

.origen {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
}

.cargando {
    text-align: center;
    font-weight: bold;
    margin-top: 20px;
}

</style>

</head>


<body>


<div class="contenedor">


    <h1>Registro de Personal</h1>


    <!-- SERVICIO -->

    <div class="dato">

        <strong>
            Servicio donde registra:
        </strong>

        <span id="servicioTexto">
            Cargando...
        </span>

    </div>


    <!-- GPS -->

    <div class="dato">

        <strong>
            Ubicación:
        </strong>

        <span id="ubicacion">
            Validando GPS...
        </span>

    </div>


    <!-- TIPO DE REGISTRO -->

    <div id="seleccionTipo"
         class="oculto">

        <label>
            Tipo de registro:
        </label>


        <div class="tipo">

            <button
                onclick="seleccionarTipo('PERSONAL')">

                PERSONAL DEL SERVICIO

            </button>


            <button
                onclick="seleccionarTipo('APOYO')">

                APOYO

            </button>

        </div>

    </div>



    <!-- PERSONAL DEL SERVICIO -->

    <div id="seccionPersonal"
         class="oculto">


        <div class="dato">

            <strong>
                Tipo:
            </strong>

            PERSONAL DEL SERVICIO

        </div>


        <label for="nombrePersonal">

            Nombre

        </label>


        <select
            id="nombrePersonal"
            onchange="actualizarNumeroPersonal()">

            <option value="">

                Selecciona tu nombre

            </option>

        </select>


        <label for="numeroPersonal">

            Número de empleado

        </label>


        <select
            id="numeroPersonal">

            <option value="">

                Selecciona tu número

            </option>

        </select>


        <button
            onclick="continuarPersonal()">

            CONTINUAR

        </button>


    </div>



    <!-- APOYO -->

    <div id="seccionApoyo"
         class="oculto">


        <div class="dato">

            <strong>
                Tipo:
            </strong>

            APOYO

        </div>


        <label for="nombreApoyo">

            Nombre

        </label>


        <input
            type="text"
            id="nombreApoyo"
            placeholder="Escribe tu nombre"
            autocomplete="off">


        <label for="numeroApoyo">

            Número de empleado

        </label>


        <input
            type="text"
            id="numeroApoyo"
            placeholder="Escribe tu número de empleado"
            inputmode="numeric"
            autocomplete="off">


        <div class="origen">

            <strong>
                Servicio de origen:
            </strong>

            <span id="servicioOrigen">
                -
            </span>

        </div>


        <button
            onclick="continuarApoyo()">

            CONTINUAR

        </button>


    </div>



    <!-- MENSAJE -->

    <div id="mensaje"
         class="mensaje">

    </div>


</div>



<script>


/* ============================================================
   CONFIGURACIÓN GOOGLE SHEETS
   ============================================================ */


const ID_ARCHIVO =
    "1QS_J7UI6j5vvebIior7pKrhMKljjF8nEU_I5It3-znc";


const ID_BASE_QR =
    "1356101945";



/* ============================================================
   VARIABLES DEL SISTEMA
   ============================================================ */


let empleados = [];

let codigoServicio = "";

let personalServicio = [];



/* ============================================================
   OBTENER SERVICIO DEL QR
   ============================================================ */


const parametros =
    new URLSearchParams(
        window.location.search
    );


codigoServicio =
    parametros.get("servicio");


if (codigoServicio) {

    codigoServicio =
        codigoServicio
        .trim()
        .toUpperCase();

}



/* ============================================================
   CARGAR BASE QR DESDE GOOGLE SHEETS
   ============================================================ */


function cargarBaseQR() {


    document.getElementById(
        "servicioTexto"
    ).textContent =
        "Cargando personal...";


    /*
       Creamos un nombre único para recibir
       la respuesta de Google.
    */

    const callbackName =
        "recibirBaseQR_" +
        Date.now();



    /*
       Esta función será llamada directamente
       por Google Sheets.
    */

    window[callbackName] =
        function(datos) {


            try {


                console.log(
                    "BASE_QR recibida:",
                    datos
                );


                /*
                   Validar respuesta
                */

                if (
                    !datos ||
                    !datos.table ||
                    !datos.table.cols ||
                    !datos.table.rows
                ) {

                    throw new Error(
                        "Google Sheets no devolvió datos válidos."
                    );

                }



                /*
                   Obtener encabezados
                */

                const encabezados =
                    datos.table.cols.map(
                        function(columna) {

                            return (
                                columna.label ||
                                ""
                            ).trim();

                        }
                    );


                console.log(
                    "Encabezados:",
                    encabezados
                );



                /*
                   Buscar columnas
                */

                const indiceNombre =
                    encabezados.indexOf(
                        "Nombre"
                    );


                const indiceNumero =
                    encabezados.indexOf(
                        "No de empleado"
                    );


                const indiceServicio =
                    encabezados.indexOf(
                        "Servicio"
                    );


                const indiceCodigo =
                    encabezados.indexOf(
                        "Código servicio"
                    );


                const indiceCoordenadas =
                    encabezados.indexOf(
                        "Coordenadas"
                    );


                const indiceRango =
                    encabezados.indexOf(
                        "Rango"
                    );


                const indiceEstatus =
                    encabezados.indexOf(
                        "Estatus"
                    );



                /*
                   Verificar columnas
                */

                if (

                    indiceNombre === -1 ||

                    indiceNumero === -1 ||

                    indiceServicio === -1 ||

                    indiceCodigo === -1 ||

                    indiceCoordenadas === -1 ||

                    indiceRango === -1 ||

                    indiceEstatus === -1

                ) {

                    throw new Error(
                        "No coinciden los encabezados de BASE_QR."
                    );

                }



                /*
                   Convertir filas
                   de Google Sheets
                   a empleados
                */

                empleados =
                    datos.table.rows

                    .map(
                        function(fila) {


                            const columnas =
                                fila.c.map(
                                    function(celda) {


                                        if (
                                            celda &&
                                            celda.v !== undefined
                                        ) {

                                            return String(
                                                celda.v
                                            ).trim();

                                        }


                                        return "";

                                    }
                                );



                            /*
                               Coordenadas
                            */

                            const textoCoordenadas =
                                columnas[
                                    indiceCoordenadas
                                ];


                            const coordenadas =
                                textoCoordenadas
                                .split(
                                    /\s*,\s*/
                                );



                            /*
                               Crear empleado
                            */

                            return {

                                nombre:
                                    columnas[
                                        indiceNombre
                                    ],

                                numero:
                                    columnas[
                                        indiceNumero
                                    ],

                                servicio:
                                    columnas[
                                        indiceServicio
                                    ],

                                codigoServicio:
                                    columnas[
                                        indiceCodigo
                                    ]
                                    .trim()
                                    .toUpperCase(),

                                lat:
                                    parseFloat(
                                        coordenadas[0]
                                    ),

                                lon:
                                    parseFloat(
                                        coordenadas[1]
                                    ),

                                rango:
                                    parseFloat(
                                        columnas[
                                            indiceRango
                                        ]
                                    ),

                                estatus:
                                    columnas[
                                        indiceEstatus
                                    ]
                                    .trim()
                                    .toUpperCase()

                            };


                        }
                    )


                    /*
                       SOLO ACTIVOS
                    */

                    .filter(
                        function(empleado) {

                            return (

                                empleado.estatus ===
                                "ACTIVO"

                            );

                        }
                    );



                console.log(
                    "Empleados activos:",
                    empleados
                );



                /*
                   Verificar que haya personal
                */

                if (
                    empleados.length === 0
                ) {

                    throw new Error(
                        "No existen empleados activos."
                    );

                }



                /*
                   Iniciar sistema
                */

                iniciarSistema();


            }

            catch(error) {


                console.error(
                    "Error procesando BASE_QR:",
                    error
                );


                document.getElementById(
                    "servicioTexto"
                ).textContent =
                    "Error al cargar la base";


                document.getElementById(
                    "mensaje"
                ).textContent =
                    error.message;


            }


            /*
               Limpiar callback
            */

            delete window[
                callbackName
            ];


            const script =
                document.getElementById(
                    "scriptBaseQR"
                );


            if (script) {

                script.remove();

            }


        };



    /*
       URL DE GOOGLE SHEETS

       IMPORTANTE:
       Aquí usamos el ID REAL DEL ARCHIVO,
       NO el 2PACX.
    */

    const url =
        "https://docs.google.com/spreadsheets/d/" +
        ID_ARCHIVO +
        "/gviz/tq" +
        "?gid=" +
        ID_BASE_QR +
        "&tqx=out:json;responseHandler:" +
        callbackName;



    console.log(
        "Consultando BASE_QR..."
    );


    console.log(
        url
    );



    /*
       Crear script dinámico

       Esto evita el problema CORS
       que teníamos con fetch().
    */

    const script =
        document.createElement(
            "script"
        );


    script.id =
        "scriptBaseQR";


    script.src =
        url;



    /*
       Error de conexión
    */

    script.onerror =
        function() {


            console.error(
                "No se pudo cargar BASE_QR."
            );


            document.getElementById(
                "servicioTexto"
            ).textContent =
                "Error al cargar la base";


            document.getElementById(
                "mensaje"
            ).textContent =
                "No se pudo conectar con BASE_QR.";

            
            delete window[
                callbackName
            ];


            script.remove();


        };



    document.body.appendChild(
        script
    );

}



/* ============================================================
   INICIAR SISTEMA
   ============================================================ */


function iniciarSistema() {


    /*
       Verificar QR
    */

    if (
        !codigoServicio
    ) {


        document.getElementById(
            "servicioTexto"
        ).textContent =
            "Servicio no identificado";


        document.getElementById(
            "mensaje"
        ).textContent =
            "El QR no contiene un servicio válido.";


        return;

    }



    /*
       Buscar personal del servicio
    */

    personalServicio =
        empleados.filter(
            function(empleado) {

                return (
                    empleado.codigoServicio ===
                    codigoServicio
                );

            }
        );



    /*
       Verificar que exista
       el servicio
    */

    if (
        personalServicio.length === 0
    ) {


        document.getElementById(
            "servicioTexto"
        ).textContent =
            "Servicio no identificado";


        document.getElementById(
            "mensaje"
        ).textContent =
            "El QR no corresponde a un servicio válido.";


        return;

    }



    /*
       Mostrar servicio
    */

    document.getElementById(
        "servicioTexto"
    ).textContent =
        personalServicio[0].servicio;



    /*
       Validar GPS
    */

    validarGPS();

}



/* ============================================================
   CALCULAR DISTANCIA
   ============================================================ */


function calcularDistancia(
    lat1,
    lon1,
    lat2,
    lon2
) {


    const R =
        6371000;


    const rad =
        Math.PI / 180;


    const dLat =
        (lat2 - lat1) *
        rad;


    const dLon =
        (lon2 - lon1) *
        rad;


    const a =

        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 * rad
        )

        *

        Math.cos(
            lat2 * rad
        )

        *

        Math.sin(
            dLon / 2
        )

        *

        Math.sin(
            dLon / 2
        );



    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}



/* ============================================================
   VALIDAR GPS
   ============================================================ */


function validarGPS() {


    /*
       Tomar coordenadas
       del servicio
    */

    const servicio =
        personalServicio[0];



    if (
        !navigator.geolocation
    ) {


        document.getElementById(
            "ubicacion"
        ).textContent =
            "GPS no disponible";


        document.getElementById(
            "mensaje"
        ).textContent =
            "Este dispositivo no permite obtener ubicación.";


        return;

    }



    /*
       Solicitar ubicación
    */

    navigator.geolocation.getCurrentPosition(


        function(posicion) {


            const latUsuario =
                posicion.coords.latitude;


            const lonUsuario =
                posicion.coords.longitude;



            /*
               Calcular distancia
            */

            const distancia =
                calcularDistancia(

                    latUsuario,

                    lonUsuario,

                    servicio.lat,

                    servicio.lon

                );



            console.log(
                "Distancia:",
                distancia
            );



            document.getElementById(
                "ubicacion"
            ).textContent =

                "Distancia: " +
                Math.round(
                    distancia
                ) +
                " metros";



            /*
               Validar rango
            */

            if (
                distancia <=
                servicio.rango
            ) {


                document.getElementById(
                    "ubicacion"
                ).textContent =

                    "Ubicación válida (" +
                    Math.round(
                        distancia
                    ) +
                    " m)";


                document.getElementById(
                    "mensaje"
                ).textContent =
                    "Ubicación validada correctamente.";


                document.getElementById(
                    "seleccionTipo"
                ).classList.remove(
                    "oculto"
                );


            }

            else {


                document.getElementById(
                    "ubicacion"
                ).textContent =

                    "Fuera del rango permitido (" +
                    Math.round(
                        distancia
                    ) +
                    " m)";


                document.getElementById(
                    "mensaje"
                ).textContent =

                    "No puedes realizar el registro desde esta ubicación.";

            }


        },


        function(error) {


            console.error(
                "Error GPS:",
                error
            );


            document.getElementById(
                "ubicacion"
            ).textContent =
                "No fue posible obtener el GPS.";


            document.getElementById(
                "mensaje"
            ).textContent =
                "Activa la ubicación del dispositivo y vuelve a intentarlo.";

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                15000,

            maximumAge:
                0

        }

    );

}



/* ============================================================
   SELECCIONAR TIPO
   ============================================================ */


function seleccionarTipo(
    tipo
) {


    /*
       Ocultar ambas secciones
    */

    document.getElementById(
        "seccionPersonal"
    )
    .classList.add(
        "oculto"
    );


    document.getElementById(
        "seccionApoyo"
    )
    .classList.add(
        "oculto"
    );



    /*
       PERSONAL
    */

    if (
        tipo === "PERSONAL"
    ) {


        cargarPersonalServicio();


        document.getElementById(
            "seccionPersonal"
        )
        .classList.remove(
            "oculto"
        );

    }



    /*
       APOYO
    */

    if (
        tipo === "APOYO"
    ) {


        cargarPersonalApoyo();


        document.getElementById(
            "seccionApoyo"
        )
        .classList.remove(
            "oculto"
        );

    }

}



/* ============================================================
   CARGAR PERSONAL DEL SERVICIO
   ============================================================ */


function cargarPersonalServicio() {


    const nombreSelect =
        document.getElementById(
            "nombrePersonal"
        );


    nombreSelect.innerHTML =
        '<option value="">Selecciona tu nombre</option>';



    personalServicio.forEach(
        function(
            empleado,
            indice
        ) {


            const opcion =
                document.createElement(
                    "option"
                );


            opcion.value =
                indice;


            opcion.textContent =
                empleado.nombre;


            nombreSelect.appendChild(
                opcion
            );

        }
    );



    /*
       Limpiar número
    */

    document.getElementById(
        "numeroPersonal"
    ).innerHTML =

        '<option value="">Selecciona tu número</option>';

}



/* ============================================================
   ACTUALIZAR NÚMERO PERSONAL
   ============================================================ */


function actualizarNumeroPersonal() {


    const indice =
        document.getElementById(
            "nombrePersonal"
        ).value;


    const numeroSelect =
        document.getElementById(
            "numeroPersonal"
        );


    numeroSelect.innerHTML =
        '<option value="">Selecciona tu número</option>';



    if (
        indice === ""
    ) {

        return;

    }



    const empleado =
        personalServicio[
            indice
        ];



    const opcion =
        document.createElement(
            "option"
        );


    opcion.value =
        empleado.numero;


    opcion.textContent =
        empleado.numero;


    numeroSelect.appendChild(
        opcion
    );

}



/* ============================================================
   CARGAR PERSONAL PARA APOYO
   ============================================================ */


function cargarPersonalApoyo() {


    /*
        APOYO se captura MANUALMENTE.

        En esta primera etapa:
        - Nombre = captura manual
        - Número de empleado = captura manual
        - Servicio de origen = pendiente de automatizar
          mediante el número de empleado.
    */

    document.getElementById(
        "nombreApoyo"
    ).value = "";


    document.getElementById(
        "numeroApoyo"
    ).value = "";


    document.getElementById(
        "servicioOrigen"
    ).textContent =
        "-";

}



/* ============================================================
   ACTUALIZAR INFORMACIÓN DE APOYO
   ============================================================ */


/*
    Por ahora NO hacemos búsqueda automática.

    En la siguiente etapa:
    Número de empleado → BASE_QR → Servicio de origen.
*/

function actualizarApoyo() {

    return;

}



/* ============================================================
   CONTINUAR PERSONAL
   ============================================================ */

   ============================================================ */


function continuarPersonal() {


    const indice =
        document.getElementById(
            "nombrePersonal"
        ).value;


    const numero =
        document.getElementById(
            "numeroPersonal"
        ).value;



    if (
        indice === "" ||
        numero === ""
    ) {


        alert(
            "Selecciona tu nombre y número de empleado."
        );


        return;

    }



    const empleado =
        personalServicio[
            indice
        ];



    abrirFormulario(

        empleado.nombre,

        empleado.numero,

        "PERSONAL DEL SERVICIO",

        empleado.servicio

    );

}



/* ============================================================
   CONTINUAR APOYO
   ============================================================ */


function continuarApoyo() {


    const nombre =
        document.getElementById(
            "nombreApoyo"
        ).value.trim();


    const numero =
        document.getElementById(
            "numeroApoyo"
        ).value.trim();



    if (
        nombre === "" ||
        numero === ""
    ) {


        alert(
            "Escribe tu nombre y número de empleado."
        );


        return;

    }



    /*
        En esta primera etapa el servicio de origen
        todavía no se obtiene automáticamente.
    */

    abrirFormulario(

        nombre,

        numero,

        "APOYO",

        document.getElementById(
            "servicioOrigen"
        ).textContent

    );

}



/* ============================================================
   ABRIR GOOGLE FORMS
   ============================================================ */

   ============================================================ */


function abrirFormulario(

    nombre,

    numero,

    tipo,

    servicioOrigen

) {


    const formulario =

        "https://docs.google.com/forms/d/e/" +

        "1FAIpQLSeKDOEdUlS75ivHlBWG4qVo-PdaL8KLWBa3GM9IYbX6I6ptnQ" +

        "/viewform";



    /*
       Servicio donde está registrando
    */

    const servicioRegistro =
        personalServicio[0].servicio;



    /*
       Construir URL
    */

    const url =

        formulario +

        "?usp=pp_url" +

        "&entry.1973773208=" +

        encodeURIComponent(
            servicioRegistro
        ) +

        "&entry.612785713=" +

        encodeURIComponent(
            nombre
        ) +

        "&entry.2013854503=" +

        encodeURIComponent(
            numero
        );



    console.log(
        "Tipo:",
        tipo
    );


    console.log(
        "Servicio origen:",
        servicioOrigen
    );


    console.log(
        "URL Forms:",
        url
    );



    /*
       Abrir formulario
    */

    window.location.href =
        url;

}



/* ============================================================
   INICIAR CARGA DE BASE
   ============================================================ */


cargarBaseQR();


</script>


</body>

</html>
