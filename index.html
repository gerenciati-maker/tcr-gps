<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lista de Asistencia</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select,
button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
}

input,
select {
    border: 1px solid #ccc;
    background: white;
}

button {
    border: none;
    background: #1f4e79;
    color: white;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.oculto {
    display: none;
}

.info {
    background: #eef4f8;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.exito {
    background: #e8f5e9;
    padding: 12px;
    border-radius: 8px;
    color: #256029;
}

.error {
    background: #fdecea;
    padding: 12px;
    border-radius: 8px;
    color: #a12622;
}

.origen {
    margin-top: 12px;
    padding: 10px;
    background: #f3f3f3;
    border-radius: 8px;
}

.pequeno {
    font-size: 13px;
    color: #666;
    margin-top: 8px;
}

.tipoEntradaSalida button {
    background: #1f4e79;
}

</style>
</head>

<body>

<div class="container">

    <h1 id="tituloServicio">LISTA DE ASISTENCIA</h1>

    <div id="estado" class="card">
        <strong>Iniciando sistema...</strong>
    </div>

    <div id="servicioCard" class="card oculto">

        <div class="info">

            <strong>Servicio identificado:</strong>

            <span id="servicioIdentificado">
                -
            </span>

        </div>

        <div id="tipoRegistro">

            <button onclick="seleccionarPersonal()">
                PERSONAL DEL SERVICIO
            </button>

            <button onclick="seleccionarApoyo()">
                APOYO
            </button>

            <button onclick="seleccionarAdministrativo()">
                ADMINISTRATIVO
            </button>

        </div>

    </div>


    <!-- PERSONAL DEL SERVICIO -->

    <div id="personalCard" class="card oculto">

        <label for="personalSelect">
            Nombre
        </label>

        <select
            id="personalSelect"
            onchange="actualizarNumeroPersonal()"
        >

            <option value="">
                Seleccione una persona
            </option>

        </select>

        <label for="numeroPersonal">
            Número de empleado
        </label>

        <input
            type="text"
            id="numeroPersonal"
            readonly
            placeholder="Número automático"
        >

        <button onclick="continuarPersonal()">
            CONTINUAR
        </button>

    </div>


    <!-- APOYO -->

    <div id="apoyoCard" class="card oculto">

        <label for="numeroApoyo">
            Número de empleado
        </label>

        <input
            type="text"
            id="numeroApoyo"
            placeholder="Número de empleado"
            inputmode="numeric"
            autocomplete="off"
            oninput="reconocerApoyo()"
        >

        <label for="nombreApoyo">
            Nombre
        </label>

        <input
            type="text"
            id="nombreApoyo"
            placeholder="Nombre automático"
            autocomplete="off"
            readonly
        >

        <div class="origen">

            <strong>
                Servicio de origen:
            </strong>

            <span id="servicioOrigen">
                -
            </span>

        </div>

        <div id="apoyoDuplicado"></div>

        <button onclick="continuarApoyo()">
            CONTINUAR
        </button>

    </div>


    <!-- ADMINISTRATIVO -->

    <div id="administrativoCard" class="card oculto">

        <div class="info">

            <strong>
                Registro administrativo
            </strong>

            <div class="pequeno">

                El registro se realizará como
                OFICINAS CENTRALES.

            </div>

        </div>

        <label for="numeroAdministrativo">
            Número de empleado
        </label>

        <input
            type="text"
            id="numeroAdministrativo"
            placeholder="Número de empleado"
            inputmode="numeric"
            autocomplete="off"
            oninput="reconocerAdministrativo()"
        >

        <label for="nombreAdministrativo">
            Nombre
        </label>

        <input
            type="text"
            id="nombreAdministrativo"
            placeholder="Nombre automático"
            readonly
        >

        <div id="adminResultado"></div>

        <button onclick="continuarAdministrativo()">
            CONTINUAR
        </button>

    </div>


    <!-- ENTRADA / SALIDA -->

    <div id="tipoRegistroCard" class="card oculto">

        <div class="info">

            <strong>Seleccione el tipo de registro</strong>

            <div class="pequeno" id="personaSeleccionada">
                -
            </div>

        </div>

        <div class="tipoEntradaSalida">

            <button onclick="enviarRegistro('ENTRADA')">
                ENTRADA
            </button>

            <button onclick="enviarRegistro('SALIDA')">
                SALIDA
            </button>

        </div>

    </div>


    <!-- MENSAJE FINAL -->

    <div
        id="mensajeFinal"
        class="card oculto"
    ></div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const ID_ARCHIVO =
    "1zdYovCmbhHOyMVy-huWqzgB6Q5x1XgL8dghe263TTbU";

const ID_BASE_QR =
    "1049929211";

const CODIGO_ADMIN =
    "CENTRAL";

const SERVICIO_CENTRAL =
    "ID-00167 - OFICINAS CENTRALES";


/*
   APPS SCRIPT
*/

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwLFAKGBIyPp2g2idSpxG5WEDMfClTV1H0KNTuXb_XqmWqapFYZmcqFTFk9ZjwfB5X0Zg/exec";


/*
   GID DE REGISTROS

   Se obtiene mediante la consulta Gviz usando
   el nombre de la hoja REGISTROS.
*/

const NOMBRE_HOJA_REGISTROS =
    "REGISTROS";


/* =====================================================
   VARIABLES
===================================================== */

let empleados = [];

let servicios = new Map();

let personalServicio = [];

let servicioActual = null;

let empleadoApoyoActual = null;

let empleadosApoyoDuplicados = [];

let empleadoAdministrativoActual = null;


/*
   REGISTRO PENDIENTE

   Aquí guardamos temporalmente a la persona
   seleccionada antes de elegir ENTRADA/SALIDA.
*/

let registroPendiente = null;


/*
   REGISTROS EXISTENTES
*/

let registrosExistentes = [];

let registrosCargados = false;

let enviandoRegistro = false;


/* =====================================================
   INICIO
===================================================== */

window.onload = function() {

    cargarRegistrosExistentes();

    cargarBaseQR();

};


/* =====================================================
   CARGAR REGISTROS EXISTENTES
===================================================== */

function cargarRegistrosExistentes() {

    const callbackName =
        "callbackRegistros_" + Date.now();

    window[callbackName] = function(data) {

        try {

            const filas =
                data.table.rows || [];

            registrosExistentes =
                filas.map(fila => {

                    const c =
                        fila.c || [];

                    function valor(indice) {

                        return (
                            c[indice] &&
                            c[indice].v != null
                        )
                        ?
                        String(c[indice].v).trim()
                        :
                        "";

                    }

                    return {

                        fecha:
                            valor(0),

                        numeroEmpleado:
                            valor(4),

                        tipoRegistro:
                            valor(6).toUpperCase()

                    };

                });

            registrosCargados = true;

        }

        catch(error) {

            console.error(
                "Error cargando registros:",
                error
            );

            registrosCargados = false;

        }

    };


    const script =
        document.createElement("script");


    script.src =

        "https://docs.google.com/spreadsheets/d/" +

        ID_ARCHIVO +

        "/gviz/tq" +

        "?sheet=" +

        encodeURIComponent(
            NOMBRE_HOJA_REGISTROS
        ) +

        "&tqx=out:json;responseHandler:" +

        callbackName;


    script.onerror = function() {

        console.error(
            "No fue posible consultar REGISTROS."
        );

        registrosCargados = false;

    };


    document.body.appendChild(script);

}


/* =====================================================
   NORMALIZAR FECHA
===================================================== */

function fechaHoyClave() {

    const ahora =
        new Date();

    const año =
        ahora.getFullYear();

    const mes =
        String(
            ahora.getMonth() + 1
        ).padStart(2, "0");

    const dia =
        String(
            ahora.getDate()
        ).padStart(2, "0");

    return (
        año +
        "-" +
        mes +
        "-" +
        dia
    );

}


/* =====================================================
   NORMALIZAR FECHA DE GOOGLE
===================================================== */

function normalizarFecha(valor) {

    if (!valor) {
        return "";
    }


    valor =
        String(valor).trim();


    /*
       Formato:
       Date(2026,8,17)
    */

    const matchGoogle =
        valor.match(
            /^Date\((\d+),(\d+),(\d+)\)$/
        );


    if (matchGoogle) {

        const año =
            matchGoogle[1];

        const mes =
            String(
                Number(matchGoogle[2]) + 1
            ).padStart(2, "0");

        const dia =
            String(
                Number(matchGoogle[3])
            ).padStart(2, "0");

        return (
            año +
            "-" +
            mes +
            "-" +
            dia
        );

    }


    /*
       YYYY-MM-DD
    */

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(valor)
    ) {

        return valor;

    }


    /*
       DD/MM/YYYY
    */

    const matchMexico =
        valor.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if (matchMexico) {

        return (

            matchMexico[3] +

            "-" +

            String(
                Number(matchMexico[2])
            ).padStart(2, "0") +

            "-" +

            String(
                Number(matchMexico[1])
            ).padStart(2, "0")

        );

    }


    return valor;

}


/* =====================================================
   VALIDAR SI YA EXISTE REGISTRO
===================================================== */

function registroYaExiste(
    numeroEmpleado,
    tipoRegistro
) {

    const hoy =
        fechaHoyClave();

    const numero =
        String(
            numeroEmpleado
        ).trim();


    return registrosExistentes.some(
        registro =>

            String(
                registro.numeroEmpleado
            ).trim() === numero

            &&

            normalizarFecha(
                registro.fecha
            ) === hoy

            &&

            String(
                registro.tipoRegistro
            ).trim().toUpperCase()
            ===
            tipoRegistro.toUpperCase()

    );

}


/* =====================================================
   CARGAR BASE QR
===================================================== */

function cargarBaseQR() {

    const callbackName =
        "callbackBaseQR_" + Date.now();

    window[callbackName] = function(data) {

        try {

            const filas =
                data.table.rows;

            const encabezados =
                data.table.cols.map(
                    col => col.label
                );

            const indiceNombre =
                encabezados.indexOf("Nombre");

            const indiceNumero =
                encabezados.indexOf(
                    "No de empleado"
                );

            const indiceServicio =
                encabezados.indexOf("Servicio");

            const indiceCodigo =
                encabezados.indexOf(
                    "Código servicio"
                );

            const indiceCoordenadas =
                encabezados.indexOf(
                    "Coordenadas"
                );

            const indiceRango =
                encabezados.indexOf("Rango");

            const indiceEstatus =
                encabezados.indexOf("Estatus");

            const indicePosicion =
                encabezados.indexOf("Posición");


            if (
                indiceNombre === -1 ||
                indiceNumero === -1 ||
                indiceServicio === -1 ||
                indiceCodigo === -1 ||
                indiceCoordenadas === -1 ||
                indiceRango === -1 ||
                indiceEstatus === -1 ||
                indicePosicion === -1
            ) {

                mostrarError(
                    "No se encontraron todas las columnas requeridas en BASE_QR."
                );

                return;

            }


            empleados = filas.map(
                fila => {

                    const c =
                        fila.c || [];

                    function valor(indice) {

                        return (
                            c[indice] &&
                            c[indice].v != null
                        )
                        ?
                        String(
                            c[indice].v
                        ).trim()
                        :
                        "";

                    }

                    const coordenadas =
                        valor(
                            indiceCoordenadas
                        );

                    let lat = null;
                    let lon = null;

                    if (coordenadas) {

                        const partes =
                            coordenadas.split(",");

                        if (
                            partes.length >= 2
                        ) {

                            lat =
                                parseFloat(
                                    partes[0].trim()
                                );

                            lon =
                                parseFloat(
                                    partes[1].trim()
                                );

                        }

                    }

                    return {

                        nombre:
                            valor(
                                indiceNombre
                            ),

                        numero:
                            valor(
                                indiceNumero
                            ),

                        servicio:
                            valor(
                                indiceServicio
                            ),

                        codigoServicio:
                            valor(
                                indiceCodigo
                            ),

                        lat:
                            lat,

                        lon:
                            lon,

                        rango:
                            parseFloat(
                                valor(
                                    indiceRango
                                )
                            ) || 0,

                        estatus:
                            valor(
                                indiceEstatus
                            ),

                        posicion:
                            valor(
                                indicePosicion
                            ).toUpperCase()

                    };

                }

            ).filter(

                empleado =>
                    empleado.estatus ===
                    "ACTIVO"

            );


            construirServicios();

            iniciarSistema();

        }

        catch(error) {

            console.error(error);

            mostrarError(
                "No fue posible procesar la base."
            );

        }

    };


    const script =
        document.createElement("script");

    script.src =

        "https://docs.google.com/spreadsheets/d/" +

        ID_ARCHIVO +

        "/gviz/tq" +

        "?gid=" +

        ID_BASE_QR +

        "&tqx=out:json;responseHandler:" +

        callbackName;

    script.onerror = function() {

        mostrarError(
            "No fue posible conectar con Google Sheets."
        );

    };

    document.body.appendChild(script);

}


/* =====================================================
   CONSTRUIR SERVICIOS
===================================================== */

function construirServicios() {

    servicios.clear();

    empleados.forEach(
        empleado => {

            if (
                !empleado.codigoServicio ||
                empleado.lat === null ||
                empleado.lon === null
            ) {

                return;

            }

            if (
                !servicios.has(
                    empleado.codigoServicio
                )
            ) {

                servicios.set(
                    empleado.codigoServicio,
                    {

                        codigo:
                            empleado.codigoServicio,

                        servicio:
                            empleado.servicio,

                        ubicaciones:
                            []

                    }
                );

            }

            const servicio =
                servicios.get(
                    empleado.codigoServicio
                );

            servicio.ubicaciones.push({

                lat:
                    empleado.lat,

                lon:
                    empleado.lon,

                rango:
                    empleado.rango

            });

        }
    );

}


/* =====================================================
   INICIAR SISTEMA
===================================================== */

function iniciarSistema() {

    mostrarEstado(
        "Obteniendo ubicación..."
    );

    obtenerGPS();

}


/* =====================================================
   GPS
===================================================== */

function obtenerGPS() {

    if (
        !navigator.geolocation
    ) {

        mostrarError(
            "Este dispositivo no permite obtener ubicación."
        );

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            identificarServicio(
                lat,
                lon
            );

        },

        function(error) {

            console.error(error);

            mostrarError(

                "No fue posible obtener tu ubicación. " +

                "Activa el GPS y permite el acceso a la ubicación."

            );

        },

        {

            enableHighAccuracy:
                true,

            timeout:
                15000,

            maximumAge:
                0

        }

    );

}


/* =====================================================
   IDENTIFICAR SERVICIO
===================================================== */

function identificarServicio(
    lat,
    lon
) {

    let servicioEncontrado =
        null;

    let distanciaMenor =
        Infinity;

    servicios.forEach(
        servicio => {

            servicio.ubicaciones.forEach(
                ubicacion => {

                    const distancia =
                        calcularDistancia(

                            lat,
                            lon,

                            ubicacion.lat,
                            ubicacion.lon

                        );

                    if (

                        distancia <=
                        ubicacion.rango &&

                        distancia <
                        distanciaMenor

                    ) {

                        distanciaMenor =
                            distancia;

                        servicioEncontrado =
                            servicio;

                    }

                }
            );

        }
    );


    if (
        servicioEncontrado
    ) {

        entrarAlServicio(
            servicioEncontrado
        );

        return;

    }


    mostrarEstado(
        "Ubicación fuera de un servicio registrado."
    );


    document.getElementById(
        "servicioCard"
    ).classList.remove(
        "oculto"
    );


    document.getElementById(
        "servicioIdentificado"
    ).textContent =
        "FUERA DE SERVICIO";


    document.getElementById(
        "tituloServicio"
    ).textContent =
        "FUERA DE SERVICIO";


    document.getElementById(
        "tipoRegistro"
    ).innerHTML =

        '<button onclick="seleccionarAdministrativo()">' +

        'ADMINISTRATIVO' +

        '</button>';


    document.getElementById(
        "administrativoCard"
    ).classList.remove(
        "oculto"
    );

}


/* =====================================================
   ENTRAR AL SERVICIO
===================================================== */

function entrarAlServicio(
    servicio
) {

    servicioActual =
        servicio;

    document.getElementById(
        "servicioCard"
    ).classList.remove(
        "oculto"
    );


    document.getElementById(
        "tituloServicio"
    ).textContent =
        servicio.codigo;


    document.getElementById(
        "servicioIdentificado"
    ).textContent =
        servicio.codigo;


    document.getElementById(
        "tipoRegistro"
    ).innerHTML =

        '<button onclick="seleccionarPersonal()">' +

        'PERSONAL DEL SERVICIO' +

        '</button>' +

        '<button onclick="seleccionarApoyo()">' +

        'APOYO' +

        '</button>' +

        '<button onclick="seleccionarAdministrativo()">' +

        'ADMINISTRATIVO' +

        '</button>';


    document.getElementById(
        "tipoRegistro"
    ).classList.remove(
        "oculto"
    );

    ocultarTodosLosFormularios();

    document.getElementById(
        "tipoRegistroCard"
    ).classList.add(
        "oculto"
    );

    mostrarEstado(
        "Ubicación validada correctamente."
    );

}


/* =====================================================
   OCULTAR FORMULARIOS
===================================================== */

function ocultarTodosLosFormularios() {

    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "tipoRegistroCard"
    ).classList.add(
        "oculto"
    );

}


/* =====================================================
   PERSONAL DEL SERVICIO
===================================================== */

function seleccionarPersonal() {

    document.getElementById(
        "personalCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "tipoRegistroCard"
    ).classList.add(
        "oculto"
    );

    cargarPersonalServicio();

}


/* =====================================================
   CARGAR PERSONAL DEL SERVICIO
===================================================== */

function cargarPersonalServicio() {

    const select =
        document.getElementById(
            "personalSelect"
        );

    select.innerHTML =

        '<option value="">' +

        'Seleccione una persona' +

        '</option>';


    if (
        !servicioActual
    ) {

        return;

    }


    personalServicio =
        empleados.filter(

            empleado =>

                empleado.codigoServicio ===
                servicioActual.codigo &&

                (
                    empleado.posicion ===
                    "GUARDIA"

                    ||

                    empleado.posicion ===
                    "MONITORISTA"
                )

        );


    personalServicio.forEach(
        (empleado, indice) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                indice;

            option.textContent =
                empleado.nombre;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   ACTUALIZAR NÚMERO PERSONAL
===================================================== */

function actualizarNumeroPersonal() {

    const indice =
        document.getElementById(
            "personalSelect"
        ).value;


    if (
        indice === ""
    ) {

        document.getElementById(
            "numeroPersonal"
        ).value = "";

        return;

    }


    const empleado =
        personalServicio[
            Number(indice)
        ];


    if (
        empleado
    ) {

        document.getElementById(
            "numeroPersonal"
        ).value =
            empleado.numero;

    }

}


/* =====================================================
   CONTINUAR PERSONAL
===================================================== */

function continuarPersonal() {

    const indice =
        document.getElementById(
            "personalSelect"
        ).value;


    if (
        indice === ""
    ) {

        alert(
            "Seleccione una persona."
        );

        return;

    }


    const empleado =
        personalServicio[
            Number(indice)
        ];


    if (
        !empleado
    ) {

        alert(
            "No se encontró la persona seleccionada."
        );

        return;

    }


    prepararRegistro(

        empleado.nombre,

        empleado.numero,

        "PERSONAL",

        empleado.servicio

    );

}


/* =====================================================
   APOYO
===================================================== */

function seleccionarApoyo() {

    document.getElementById(
        "apoyoCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "administrativoCard"

/* =====================================================
   PREPARAR REGISTRO
===================================================== */

function prepararRegistro(

    nombre,
    numero,
    tipo,
    servicioOrigen

) {

    /*
       GUARDAMOS LA INFORMACIÓN.

       IMPORTANTE:

       servicio:
       = lugar donde se hizo el registro.

       servicioOrigen:
       = servicio original del empleado.

       Para ADMINISTRATIVO:
       siempre CENTRAL.
    */


    let servicioRegistro = "";


    if (
        tipo === "ADMINISTRATIVO"
    ) {

        servicioRegistro =
            SERVICIO_CENTRAL;

    }

    else {

        servicioRegistro =
            servicioActual
            ?
            servicioActual.codigo
            :
            "";

    }


    registroPendiente = {

        nombre:
            nombre,

        numeroEmpleado:
            numero,

        tipoPersona:
            tipo,

        servicio:
            servicioRegistro,

        servicioOrigen:
            tipo === "APOYO"
            ?
            servicioOrigen
            :
            ""

    };


    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );


    document.getElementById(
        "personaSeleccionada"
    ).textContent =

        nombre +

        " | " +

        "No. " +

        numero;


    document.getElementById(
        "tipoRegistroCard"
    ).classList.remove(
        "oculto"
    );


    document.getElementById(
        "mensajeFinal"
    ).classList.add(
        "oculto"
    );

}


/* =====================================================
   ENVIAR REGISTRO
===================================================== */

function enviarRegistro(
    tipoRegistro
) {

    if (
        enviandoRegistro
    ) {

        return;

    }


    if (
        !registroPendiente
    ) {

        alert(
            "No existe un registro pendiente."
        );

        return;

    }


    /*
       SI TODAVÍA NO TERMINÓ DE CARGAR
       LA BASE DE REGISTROS, ESPERAMOS.
    */

    if (
        !registrosCargados
    ) {

        alert(
            "ESPERE UN MOMENTO. SE ESTÁN VERIFICANDO LOS REGISTROS."
        );

        cargarRegistrosExistentes();

        return;

    }


    /*
       VALIDAR DUPLICADO
    */

    if (
        registroYaExiste(

            registroPendiente.numeroEmpleado,

            tipoRegistro

        )
    ) {

        alert(

            "YA ESTÁ REGISTRADA LA " +

            tipoRegistro +

            " PARA ESTE EMPLEADO " +

            "EL DÍA DE HOY."

        );

        return;

    }


    enviandoRegistro =
        true;


    const botones =
        document.querySelectorAll(
            "#tipoRegistroCard button"
        );


    botones.forEach(
        boton => {

            boton.disabled =
                true;

            boton.textContent =
                "GUARDANDO...";

        }
    );


    const ahora =
        new Date();


    const fecha =
        ahora.getFullYear() +

        "-" +

        String(
            ahora.getMonth() + 1
        ).padStart(2, "0") +

        "-" +

        String(
            ahora.getDate()
        ).padStart(2, "0");


    const hora =
        String(
            ahora.getHours()
        ).padStart(2, "0") +

        ":" +

        String(
            ahora.getMinutes()
        ).padStart(2, "0") +

        ":" +

        String(
            ahora.getSeconds()
        ).padStart(2, "0");


    const fechaHora =
        fecha +
        " " +
        hora;


    /*
       SERVICIO IDENTIFICADO
    */

    let servicioDetectado = "";


    if (
        servicioActual
    ) {

        servicioDetectado =
            servicioActual.codigo;

    }

    else {

        servicioDetectado =
            registroPendiente.servicio;

    }


    /*
       POSICIÓN
    */

    let posicion =
        registroPendiente.tipoPersona;


    if (
        registroPendiente.tipoPersona ===
        "PERSONAL"
    ) {

        const empleado =
            empleados.find(

                e =>

                    e.numero ===
                    registroPendiente.numeroEmpleado

                    &&

                    e.nombre ===
                    registroPendiente.nombre

            );


        if (
            empleado
        ) {

            posicion =
                empleado.posicion;

        }

    }


    if (
        registroPendiente.tipoPersona ===
        "APOYO"
    ) {

        const empleado =
            empleados.find(

                e =>

                    e.numero ===
                    registroPendiente.numeroEmpleado

                    &&

                    e.nombre ===
                    registroPendiente.nombre

            );


        if (
            empleado
        ) {

            posicion =
                empleado.posicion;

        }

        else {

            posicion =
                "GUARDIA";

        }

    }


    if (
        registroPendiente.tipoPersona ===
        "ADMINISTRATIVO"
    ) {

        posicion =
            "ADMINISTRATIVO";

    }


    /*
       DATOS QUE RECIBIRÁ APPS SCRIPT
    */

    const datos = {

        fecha:
            fecha,

        hora:
            hora,

        fechaHora:
            fechaHora,

        nombre:
            registroPendiente.nombre,

        numeroEmpleado:
            registroPendiente.numeroEmpleado,

        servicio:
            registroPendiente.servicio,

        tipoRegistro:
            tipoRegistro,

        posicion:
            posicion,

        latitud:
            "",

        longitud:
            "",

        precisionGPS:
            "",

        servicioDetectado:
            servicioDetectado,

        servicioOrigen:
            registroPendiente.tipoPersona === "APOYO"
            ?
            registroPendiente.servicioOrigen
            :
            "",

        resultado:
            "REGISTRADO"

    };


    /*
       ENVÍO AL APPS SCRIPT

       NO SE MODIFICA EL APPS SCRIPT.
    */

    fetch(

        URL_APPS_SCRIPT,

        {

            method:
                "POST",

            mode:
                "no-cors",

            headers:
                {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

            body:
                JSON.stringify(
                    datos
                )

        }

    )

    .then(

        function() {

            /*
               ACTUALIZAMOS LOCALMENTE
               PARA EVITAR DOBLE REGISTRO
               EN ESTA MISMA SESIÓN.
            */

            registrosExistentes.push({

                fecha:
                    fecha,

                numeroEmpleado:
                    registroPendiente.numeroEmpleado,

                tipoRegistro:
                    tipoRegistro

            });


            mostrarRegistroExitoso(

                tipoRegistro,

                registroPendiente.nombre

            );

        }

    )

    .catch(

        function(error) {

            console.error(error);

            enviandoRegistro =
                false;


            botones.forEach(
                boton => {

                    boton.disabled =
                        false;

                    boton.textContent =
                        boton.innerText
                        ===
                        "GUARDANDO..."
                        ?
                        "REGISTRAR"
                        :
                        boton.textContent;

                }
            );


            alert(
                "No fue posible enviar el registro."
            );

        }

    );

}

/* =====================================================
   DISTANCIA
===================================================== */

function calcularDistancia(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const R =
        6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );

    return R * c;

}
