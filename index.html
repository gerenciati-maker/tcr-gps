<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torre de Control</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select,
button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
}

input,
select {
    border: 1px solid #ccc;
    background: white;
}

button {
    border: none;
    background: #1f4e79;
    color: white;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.oculto {
    display: none;
}

.info {
    background: #eef4f8;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.exito {
    background: #e8f5e9;
    padding: 12px;
    border-radius: 8px;
    color: #256029;
}

.error {
    background: #fdecea;
    padding: 12px;
    border-radius: 8px;
    color: #a12622;
}

.origen {
    margin-top: 12px;
    padding: 10px;
    background: #f3f3f3;
    border-radius: 8px;
}

.pequeno {
    font-size: 13px;
    color: #666;
    margin-top: 8px;
}

/* =====================================================
   DUPLICADOS
===================================================== */

.duplicado {
    background: #fff3cd;
    border: 1px solid #ffcc00;
    color: #664d03;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
}

.duplicado strong {
    display: block;
    margin-bottom: 8px;
}

.duplicado select {
    margin-top: 8px;
}

.personaDuplicada {
    background: white;
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 8px;
    margin-top: 8px;
}

</style>

</head>

<body>

<div class="container">

<h1>TORRE DE CONTROL</h1>

<div id="estado" class="card">
    <strong>Iniciando sistema...</strong>
</div>


<!-- SERVICIO -->

<div id="servicioCard" class="card oculto">

    <div class="info">

        <strong>Servicio identificado:</strong>

        <span id="servicioIdentificado">
            -
        </span>

    </div>

    <div id="tipoRegistro">

        <button onclick="seleccionarPersonal()">
            PERSONAL DEL SERVICIO
        </button>

        <button onclick="seleccionarApoyo()">
            APOYO
        </button>

        <button onclick="seleccionarAdministrativo()">
            ADMINISTRATIVO
        </button>

    </div>

</div>


<!-- PERSONAL DEL SERVICIO -->

<div id="personalCard" class="card oculto">

    <label for="personalSelect">
        Nombre
    </label>

    <select
        id="personalSelect"
        onchange="actualizarNumeroPersonal()"
    >

        <option value="">
            Seleccione una persona
        </option>

    </select>

    <label for="numeroPersonal">
        Número de empleado
    </label>

    <input
        type="text"
        id="numeroPersonal"
        readonly
        placeholder="Número automático"
    >

    <div id="personalDuplicado"></div>

    <button onclick="continuarPersonal()">
        CONTINUAR
    </button>

</div>


<!-- APOYO -->

<div id="apoyoCard" class="card oculto">

    <label for="numeroApoyo">
        Número de empleado
    </label>

    <input
        type="text"
        id="numeroApoyo"
        placeholder="Número de empleado"
        inputmode="numeric"
        autocomplete="off"
        oninput="reconocerApoyo()"
    >

    <div id="apoyoDuplicado"></div>

    <label for="nombreApoyo">
        Nombre
    </label>

    <input
        type="text"
        id="nombreApoyo"
        placeholder="Nombre automático"
        autocomplete="off"
        readonly
    >

    <div class="origen">

        <strong>
            Servicio de origen:
        </strong>

        <span id="servicioOrigen">
            -
        </span>

    </div>

    <button onclick="continuarApoyo()">
        CONTINUAR
    </button>

</div>


<!-- ADMINISTRATIVO -->

<div id="administrativoCard" class="card oculto">

    <div class="info">

        <strong>
            Registro administrativo
        </strong>

        <div class="pequeno">

            El registro se realizará como
            OFICINAS CENTRALES.

        </div>

    </div>

    <label for="numeroAdministrativo">
        Número de empleado
    </label>

    <input
        type="text"
        id="numeroAdministrativo"
        placeholder="Número de empleado"
        inputmode="numeric"
        autocomplete="off"
        oninput="reconocerAdministrativo()"
    >

    <div id="adminDuplicado"></div>

    <label for="nombreAdministrativo">
        Nombre
    </label>

    <input
        type="text"
        id="nombreAdministrativo"
        placeholder="Nombre automático"
        readonly
    >

    <div id="adminResultado"></div>

    <button onclick="continuarAdministrativo()">
        CONTINUAR
    </button>

</div>


<!-- TIPO DE REGISTRO -->

<div id="tipoRegistroCard" class="card oculto">

    <div class="info">

        <strong>Tipo de registro</strong>

        <div class="pequeno">
            Seleccione si corresponde a una entrada o una salida.
        </div>

    </div>

    <button onclick="enviarRegistro('ENTRADA')">
        ENTRADA
    </button>

    <button onclick="enviarRegistro('SALIDA')">
        SALIDA
    </button>

</div>


<!-- MENSAJE FINAL -->

<div
    id="mensajeFinal"
    class="card oculto"
></div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const ID_ARCHIVO =
    "1zdYovCmbhHOyMVy-huWqzgB6Q5x1XgL8dghe263TTbU";

const ID_BASE_QR =
    "1049929211";

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwLFAKGBIyPp2g2idSpxG5WEDMfClTV1H0KNTuXb_XqmWqapFYZmcqFTFk9ZjwfB5X0Zg/exec";

const CODIGO_ADMIN =
    "CENTRAL";

const SERVICIO_CENTRAL =
    "ID-00167 - OFICINAS CENTRALES";


/* =====================================================
   VARIABLES
===================================================== */

let empleados = [];

let servicios = new Map();

let personalServicio = [];

let servicioActual = null;

let empleadoApoyoActual = null;

let empleadoAdministrativoActual = null;

let ubicacionActual = {

    latitud: null,

    longitud: null,

    precisionGPS: null

};

let registroPendiente = null;


/* =====================================================
   INICIO
===================================================== */

window.onload = function() {

    cargarBaseQR();

};


/* =====================================================
   CARGAR BASE QR
===================================================== */

function cargarBaseQR() {

    const callbackName =
        "callbackBaseQR_" + Date.now();

    window[callbackName] = function(data) {

        try {

            const filas =
                data.table.rows;

            const encabezados =
                data.table.cols.map(
                    col => col.label
                );

            const indiceNombre =
                encabezados.indexOf("Nombre");

            const indiceNumero =
                encabezados.indexOf(
                    "No de empleado"
                );

            const indiceServicio =
                encabezados.indexOf("Servicio");

            const indiceCodigo =
                encabezados.indexOf(
                    "Código servicio"
                );

            const indiceCoordenadas =
                encabezados.indexOf(
                    "Coordenadas"
                );

            const indiceRango =
                encabezados.indexOf("Rango");

            const indiceEstatus =
                encabezados.indexOf("Estatus");

            const indicePosicion =
                encabezados.indexOf("Posición");


            if (
                indiceNombre === -1 ||
                indiceNumero === -1 ||
                indiceServicio === -1 ||
                indiceCodigo === -1 ||
                indiceCoordenadas === -1 ||
                indiceRango === -1 ||
                indiceEstatus === -1 ||
                indicePosicion === -1
            ) {

                mostrarError(
                    "No se encontraron todas las columnas requeridas en BASE_QR."
                );

                return;

            }


            empleados = filas.map(
                (fila) => {

                    const c =
                        fila.c || [];

                    function valor(indice) {

                        return (
                            c[indice] &&
                            c[indice].v != null
                        )
                        ?
                        String(
                            c[indice].v
                        ).trim()
                        :
                        "";

                    }

                    const coordenadas =
                        valor(
                            indiceCoordenadas
                        );

                    let lat = null;

                    let lon = null;

                    if (coordenadas) {

                        const partes =
                            coordenadas.split(",");

                        if (
                            partes.length >= 2
                        ) {

                            lat =
                                parseFloat(
                                    partes[0].trim()
                                );

                            lon =
                                parseFloat(
                                    partes[1].trim()
                                );

                        }

                    }

                    return {

                        nombre:
                            valor(
                                indiceNombre
                            ),

                        numero:
                            valor(
                                indiceNumero
                            ),

                        servicio:
                            valor(
                                indiceServicio
                            ),

                        codigoServicio:
                            valor(
                                indiceCodigo
                            ),

                        lat:
                            lat,

                        lon:
                            lon,

                        rango:
                            parseFloat(
                                valor(
                                    indiceRango
                                )
                            ) || 0,

                        estatus:
                            valor(
                                indiceEstatus
                            ),

                        posicion:
                            valor(
                                indicePosicion
                            ).toUpperCase()

                    };

                }

            ).filter(

                empleado =>
                    empleado.estatus ===
                    "ACTIVO"

            );


            construirServicios();

            iniciarSistema();

        }

        catch(error) {

            console.error(error);

            mostrarError(
                "No fue posible procesar la base."
            );

        }

    };


    const script =
        document.createElement("script");

    script.src =

        "https://docs.google.com/spreadsheets/d/" +

        ID_ARCHIVO +

        "/gviz/tq" +

        "?gid=" +

        ID_BASE_QR +

        "&tqx=out:json;responseHandler:" +

        callbackName;

    script.onerror = function() {

        mostrarError(
            "No fue posible conectar con Google Sheets."
        );

    };

    document.body.appendChild(script);

}


/* =====================================================
   CONSTRUIR SERVICIOS
===================================================== */

function construirServicios() {

    servicios.clear();

    empleados.forEach(
        empleado => {

            if (
                !empleado.codigoServicio ||
                empleado.lat === null ||
                empleado.lon === null
            ) {

                return;

            }

            if (
                !servicios.has(
                    empleado.codigoServicio
                )
            ) {

                servicios.set(
                    empleado.codigoServicio,
                    {

                        codigo:
                            empleado.codigoServicio,

                        servicio:
                            empleado.servicio,

                        ubicaciones:
                            []

                    }
                );

            }

            const servicio =
                servicios.get(
                    empleado.codigoServicio
                );

            servicio.ubicaciones.push({

                lat:
                    empleado.lat,

                lon:
                    empleado.lon,

                rango:
                    empleado.rango

            });

        }
    );

}


/* =====================================================
   INICIAR SISTEMA
===================================================== */

function iniciarSistema() {

    mostrarEstado(
        "Obteniendo ubicación..."
    );

    obtenerGPS();

}


/* =====================================================
   OBTENER GPS
===================================================== */

function obtenerGPS() {

    if (
        !navigator.geolocation
    ) {

        mostrarError(
            "Este dispositivo no permite obtener ubicación."
        );

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            const precision =
                position.coords.accuracy;

            ubicacionActual = {

                latitud: lat,

                longitud: lon,

                precisionGPS: precision

            };

            identificarServicio(
                lat,
                lon
            );

        },

        function(error) {

            console.error(error);

            mostrarError(

                "No fue posible obtener tu ubicación. " +

                "Activa el GPS y permite el acceso a la ubicación."

            );

        },

        {

            enableHighAccuracy:
                true,

            timeout:
                15000,

            maximumAge:
                0

        }

    );

}


/* =====================================================
   IDENTIFICAR SERVICIO POR GPS
===================================================== */

function identificarServicio(
    lat,
    lon
) {

    let servicioEncontrado =
        null;

    let distanciaMenor =
        Infinity;

    servicios.forEach(
        servicio => {

            servicio.ubicaciones.forEach(
                ubicacion => {

                    const distancia =
                        calcularDistancia(

                            lat,
                            lon,

                            ubicacion.lat,
                            ubicacion.lon

                        );

                    if (

                        distancia <=
                        ubicacion.rango &&

                        distancia <
                        distanciaMenor

                    ) {

                        distanciaMenor =
                            distancia;

                        servicioEncontrado =
                            servicio;

                    }

                }
            );

        }
    );


    if (
        servicioEncontrado
    ) {

        entrarAlServicio(
            servicioEncontrado
        );

        return;

    }


    mostrarEstado(
        "Ubicación fuera de un servicio registrado."
    );

    document.getElementById(
        "servicioCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "servicioIdentificado"
    ).textContent =
        "FUERA DE SERVICIO";

    document.getElementById(
        "tipoRegistro"
    ).innerHTML =

        '<button onclick="seleccionarAdministrativo()">' +

        'ADMINISTRATIVO' +

        '</button>';

    document.getElementById(
        "administrativoCard"
    ).classList.remove(
        "oculto"
    );

}


/* =====================================================
   ENTRAR AL SERVICIO
===================================================== */

function entrarAlServicio(
    servicio
) {

    servicioActual =
        servicio;

    document.getElementById(
        "servicioCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "servicioIdentificado"
    ).textContent =
        servicio.codigo;

    document.getElementById(
        "tipoRegistro"
    ).innerHTML =

        '<button onclick="seleccionarPersonal()">' +

        'PERSONAL DEL SERVICIO' +

        '</button>' +

        '<button onclick="seleccionarApoyo()">' +

        'APOYO' +

        '</button>' +

        '<button onclick="seleccionarAdministrativo()">' +

        'ADMINISTRATIVO' +

        '</button>';

    document.getElementById(
        "tipoRegistro"
    ).classList.remove(
        "oculto"
    );

    ocultarTodosLosFormularios();

    mostrarEstado(
        "Ubicación validada correctamente."
    );

}


/* =====================================================
   OCULTAR FORMULARIOS
===================================================== */

function ocultarTodosLosFormularios() {

    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );

}


/* =====================================================
   PERSONAL DEL SERVICIO
===================================================== */

function seleccionarPersonal() {

    document.getElementById(
        "personalCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "personalDuplicado"
    ).innerHTML = "";

    cargarPersonalServicio();

}


function cargarPersonalServicio() {

    const select =
        document.getElementById(
            "personalSelect"
        );

    select.innerHTML =

        '<option value="">' +

        'Seleccione una persona' +

        '</option>';

    if (
        !servicioActual
    ) {

        return;

    }

    personalServicio =
        empleados.filter(

            empleado =>

                empleado.codigoServicio ===
                servicioActual.codigo &&

                (
                    empleado.posicion ===
                    "GUARDIA"

                    ||

                    empleado.posicion ===
                    "MONITORISTA"
                )

        );

    personalServicio.forEach(
        empleado => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                empleado.nombre +
                "||" +
                empleado.numero;

            option.textContent =
                empleado.nombre +
                " — " +
                empleado.numero;

            select.appendChild(
                option
            );

        }
    );

}


function actualizarNumeroPersonal() {

    const valor =
        document.getElementById(
            "personalSelect"
        ).value;

    document.getElementById(
        "personalDuplicado"
    ).innerHTML = "";

    if (!valor) {

        document.getElementById(
            "numeroPersonal"
        ).value = "";

        return;

    }

    const partes =
        valor.split("||");

    const nombre =
        partes[0];

    const numero =
        partes[1];

    document.getElementById(
        "numeroPersonal"
    ).value =
        numero;


    const coincidencias =
        empleados.filter(
            e =>
                e.numero === numero
        );

    if (
        coincidencias.length > 1
    ) {

        mostrarDuplicados(
            "personalDuplicado",
            coincidencias,
            "personal"
        );

    }

}


function continuarPersonal() {

    const valor =
        document.getElementById(
            "personalSelect"
        ).value;

    if (!valor) {

        alert(
            "Seleccione una persona."
        );

        return;

    }

    const partes =
        valor.split("||");

    const nombre =
        partes[0];

    const numero =
        partes[1];


    const coincidencias =
        empleados.filter(
            e =>
                e.numero === numero &&
                e.codigoServicio ===
                servicioActual.codigo &&
                (
                    e.posicion === "GUARDIA" ||
                    e.posicion === "MONITORISTA"
                )
        );


    if (
        coincidencias.length > 1
    ) {

        const seleccionado =
            obtenerEmpleadoSeleccionado(
                "personalDuplicado",
                coincidencias
            );

        if (!seleccionado) {

            alert(
                "Este número de empleado está duplicado. Seleccione primero a la persona correcta."
            );

            return;

        }

        abrirFormulario(

            seleccionado.nombre,

            seleccionado.numero,

            "PERSONAL",

            seleccionado.servicio

        );

        return;

    }


    const empleado =
        empleados.find(

            e =>

                e.nombre === nombre &&

                e.numero === numero &&

                e.codigoServicio ===
                servicioActual.codigo &&

                (
                    e.posicion ===
                    "GUARDIA"

                    ||

                    e.posicion ===
                    "MONITORISTA"
                )

        );

    if (!empleado) {

        alert(
            "No se encontró el empleado en el servicio identificado."
        );

        return;

    }

    abrirFormulario(

        empleado.nombre,

        empleado.numero,

        "PERSONAL",

        empleado.servicio

    );

}


/* =====================================================
   APOYO
===================================================== */

function seleccionarApoyo() {

    document.getElementById(
        "apoyoCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "administrativoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "apoyoDuplicado"
    ).innerHTML = "";

    document.getElementById(
        "numeroApoyo"
    ).value = "";

    document.getElementById(
        "nombreApoyo"
    ).value = "";

    document.getElementById(
        "servicioOrigen"
    ).textContent = "-";

    empleadoApoyoActual =
        null;

}


function reconocerApoyo() {

    const numero =
        document.getElementById(
            "numeroApoyo"
        ).value.trim();


    document.getElementById(
        "apoyoDuplicado"
    ).innerHTML = "";

    empleadoApoyoActual =
        null;


    if (!numero) {

        document.getElementById(
            "nombreApoyo"
        ).value = "";

        document.getElementById(
            "servicioOrigen"
        ).textContent = "-";

        return;

    }


    const coincidencias =
        empleados.filter(

            e =>
                e.numero === numero

        );


    if (
        coincidencias.length === 0
    ) {

        document.getElementById(
            "nombreApoyo"
        ).value = "";

        document.getElementById(
            "servicioOrigen"
        ).textContent = "-";

        return;

    }


    /* =================================================
       NÚMERO DUPLICADO
    ================================================= */

    if (
        coincidencias.length > 1
    ) {

        mostrarDuplicados(
            "apoyoDuplicado",
            coincidencias,
            "apoyo"
        );

        document.getElementById(
            "nombreApoyo"
        ).value = "";

        document.getElementById(
            "servicioOrigen"
        ).textContent =
            "Seleccione la persona correcta.";

        return;

    }


    /* =================================================
       NÚMERO ÚNICO
    ================================================= */

    const empleado =
        coincidencias[0];

    empleadoApoyoActual =
        empleado;

    document.getElementById(
        "nombreApoyo"
    ).value =
        empleado.nombre;

    document.getElementById(
        "servicioOrigen"
    ).textContent =
        empleado.servicio;

}


function continuarApoyo() {

    if (
        !empleadoApoyoActual
    ) {

        const numero =
            document.getElementById(
                "numeroApoyo"
            ).value.trim();

        const coincidencias =
            empleados.filter(
                e =>
                    e.numero === numero
            );

        if (
            coincidencias.length > 1
        ) {

            const seleccionado =
                obtenerEmpleadoSeleccionado(
                    "apoyoDuplicado",
                    coincidencias
                );

            if (!seleccionado) {

                alert(
                    "Este número de empleado está duplicado. Seleccione primero a la persona correcta."
                );

                return;

            }

            empleadoApoyoActual =
                seleccionado;

        }

        else {

            alert(
                "Ingrese un número de empleado válido."
            );

            return;

        }

    }


    abrirFormulario(

        empleadoApoyoActual.nombre,

        empleadoApoyoActual.numero,

        "APOYO",

        empleadoApoyoActual.servicio

    );

}


/* =====================================================
   ADMINISTRATIVO
===================================================== */

function seleccionarAdministrativo() {

    document.getElementById(
        "administrativoCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "personalCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "apoyoCard"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "adminDuplicado"
    ).innerHTML = "";

    document.getElementById(
        "numeroAdministrativo"
    ).value = "";

    document.getElementById(
        "nombreAdministrativo"
    ).value = "";

    document.getElementById(
        "adminResultado"
    ).innerHTML = "";

    empleadoAdministrativoActual =
        null;

}


function reconocerAdministrativo() {

    const numero =
        document.getElementById(
            "numeroAdministrativo"
        ).value.trim();


    empleadoAdministrativoActual =
        null;

    document.getElementById(
        "nombreAdministrativo"
    ).value = "";

    document.getElementById(
        "adminResultado"
    ).innerHTML = "";

    document.getElementById(
        "adminDuplicado"
    ).innerHTML = "";


    if (!numero) {

        return;

    }


    const coincidencias =
        empleados.filter(
            e =>
                e.numero === numero
        );


    if (
        coincidencias.length === 0
    ) {

        return;

    }


    /* =================================================
       NÚMERO DUPLICADO
    ================================================= */

    if (
        coincidencias.length > 1
    ) {

        mostrarDuplicados(
            "adminDuplicado",
            coincidencias,
            "administrativo"
        );

        document.getElementById(
            "adminResultado"
        ).innerHTML =

            '<div class="error">' +

            'Este número de empleado está duplicado. Seleccione la persona correcta.' +

            '</div>';

        return;

    }


    /* =================================================
       NÚMERO ÚNICO
    ================================================= */

    const empleado =
        coincidencias[0];


    if (
        empleado.posicion !==
        "ADMINISTRATIVO"
    ) {

        document.getElementById(
            "adminResultado"
        ).innerHTML =

            '<div class="error">' +

            'Este empleado no está registrado como ADMINISTRATIVO.' +

            '</div>';

        return;

    }


    empleadoAdministrativoActual =
        empleado;

    document.getElementById(
        "nombreAdministrativo"
    ).value =
        empleado.nombre;

    document.getElementById(
        "adminResultado"
    ).innerHTML =

        '<div class="exito">' +

        'Empleado administrativo validado. Registro: CENTRAL.' +

        '</div>';

}


function continuarAdministrativo() {

    if (
        !empleadoAdministrativoActual
    ) {

        const numero =
            document.getElementById(
                "numeroAdministrativo"
            ).value.trim();

        const coincidencias =
            empleados.filter(
                e =>
                    e.numero === numero
            );


        if (
            coincidencias.length > 1
        ) {

            const seleccionado =
                obtenerEmpleadoSeleccionado(
                    "adminDuplicado",
                    coincidencias
                );

            if (!seleccionado) {

                alert(
                    "Este número de empleado está duplicado. Seleccione primero a la persona correcta."
                );

                return;

            }


            if (
                seleccionado.posicion !==
                "ADMINISTRATIVO"
            ) {

                alert(
                    "La persona seleccionada no está registrada como ADMINISTRATIVO."
                );

                return;

            }

            empleadoAdministrativoActual =
                seleccionado;

        }

        else {

            alert(
                "Ingrese un número de empleado administrativo válido."
            );

            return;

        }

    }


    abrirFormulario(

        empleadoAdministrativoActual.nombre,

        empleadoAdministrativoActual.numero,

        "ADMINISTRATIVO",

        SERVICIO_CENTRAL

    );

}


/* =====================================================
   MOSTRAR DUPLICADOS
===================================================== */

function mostrarDuplicados(
    contenedorId,
    coincidencias,
    tipo
) {

    const contenedor =
        document.getElementById(
            contenedorId
        );

    if (!contenedor) {
        return;
    }


    let html =

        '<div class="duplicado">' +

        '<strong>⚠️ ESTE NÚMERO DE EMPLEADO ESTÁ DUPLICADO</strong>' +

        '<div class="pequeno">' +

        'El número aparece ' +

        coincidencias.length +

        ' veces en la base. Seleccione la persona correcta:' +

        '</div>';


    html +=

        '<select id="' +

        contenedorId +

        '_select" onchange="seleccionarDuplicado(\'' +

        contenedorId +

        '\')">' +

        '<option value="">' +

        'Seleccione una persona' +

        '</option>';


    coincidencias.forEach(
        (empleado, indice) => {

            html +=

                '<option value="' +

                indice +

                '">' +

                empleado.nombre +

                ' — ' +

                empleado.servicio +

                ' — ' +

                empleado.posicion +

                '</option>';

        }
    );


    html +=

        '</select>' +

        '</div>';


    contenedor.innerHTML =
        html;

}


/* =====================================================
   SELECCIONAR DUPLICADO
===================================================== */

function seleccionarDuplicado(
    contenedorId
) {

    const select =
        document.getElementById(
            contenedorId +
            "_select"
        );

    if (!select) {
        return;
    }


    const numero =

        contenedorId ===
        "apoyoDuplicado"

        ?

        document.getElementById(
            "numeroApoyo"
        ).value.trim()

        :

        contenedorId ===
        "adminDuplicado"

        ?

        document.getElementById(
            "numeroAdministrativo"
        ).value.trim()

        :

        document.getElementById(
            "numeroPersonal"
        ).value.trim();


    const coincidencias =
        empleados.filter(
            e =>
                e.numero === numero
        );


    const indice =
        parseInt(
            select.value
        );


    if (
        isNaN(indice) ||
        !coincidencias[indice]
    ) {

        return;

    }


    const empleado =
        coincidencias[indice];


    if (
        contenedorId ===
        "apoyoDuplicado"
    ) {

        empleadoApoyoActual =
            empleado;

        document.getElementById(
            "nombreApoyo"
        ).value =
            empleado.nombre;

        document.getElementById(
            "servicioOrigen"
        ).textContent =
            empleado.servicio;

        return;

    }


    if (
        contenedorId ===
        "adminDuplicado"
    ) {

        if (
            empleado.posicion !==
            "ADMINISTRATIVO"
        ) {

            empleadoAdministrativoActual =
                null;

            document.getElementById(
                "nombreAdministrativo"
            ).value = "";

            document.getElementById(
                "adminResultado"
            ).innerHTML =

                '<div class="error">' +

                'La persona seleccionada no está registrada como ADMINISTRATIVO.' +

                '</div>';

            return;

        }


        empleadoAdministrativoActual =
            empleado;

        document.getElementById(
            "nombreAdministrativo"
        ).value =
            empleado.nombre;

        document.getElementById(
            "adminResultado"
        ).innerHTML =

            '<div class="exito">' +

            'Empleado administrativo validado. Registro: CENTRAL.' +

            '</div>';

        return;

    }


    /* PERSONAL */

    document.getElementById(
        "personalSelect"
    ).value =
        empleado.nombre +
        "||" +
        empleado.numero;

}


/* =====================================================
   OBTENER EMPLEADO SELECCIONADO
===================================================== */

function obtenerEmpleadoSeleccionado(
    contenedorId,
    coincidencias
) {

    const select =
        document.getElementById(
            contenedorId +
            "_select"
        );

    if (
        !select ||
        select.value === ""
    ) {

        return null;

    }

    const indice =
        parseInt(
            select.value
        );


    if (
        isNaN(indice) ||
        !coincidencias[indice]
    ) {

        return null;

    }


    return coincidencias[indice];

}


/* =====================================================
   PREPARAR REGISTRO
===================================================== */

function abrirFormulario(

    nombre,
    numero,
    tipo,
    servicio

) {

    let posicion = "";

    let servicioOrigen = "";

    let servicioDetectado = "";


    if (tipo === "PERSONAL") {

        const empleado = empleados.find(

            e =>

                e.nombre === nombre &&

                e.numero === numero &&

                e.codigoServicio ===
                (
                    servicioActual
                    ?
                    servicioActual.codigo
                    :
                    ""
                )

        );

        if (empleado) {

            posicion =
                empleado.posicion;

        }

        servicioDetectado =
            servicioActual
                ?
                servicioActual.codigo
                :
                "";

    }


    else if (tipo === "APOYO") {

        posicion =
            empleadoApoyoActual
                ?
                empleadoApoyoActual.posicion
                :
                "";

        servicioOrigen =
            empleadoApoyoActual
                ?
                empleadoApoyoActual.servicio
                :
                "";

        servicioDetectado =
            servicioActual
                ?
                servicioActual.codigo
                :
                "FUERA DE SERVICIO";

    }


    else if (tipo === "ADMINISTRATIVO") {

        posicion =
            "ADMINISTRATIVO";

        servicioDetectado =
            servicioActual
                ?
                servicioActual.codigo
                :
                "FUERA DE SERVICIO";

    }


    registroPendiente = {

        nombre:
            nombre,

        numeroEmpleado:
            numero,

        servicio:
            servicio,

        tipoRegistro:
            "",

        posicion:
            posicion,

        latitud:
            ubicacionActual.latitud,

        longitud:
            ubicacionActual.longitud,

        precisionGPS:
            ubicacionActual.precisionGPS,

        servicioDetectado:
            servicioDetectado,

        servicioOrigen:
            servicioOrigen,

        resultado:
            "REGISTRADO"

    };


    document.getElementById(
        "tipoRegistroCard"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "mensajeFinal"
    ).classList.add(
        "oculto"
    );

    window.scrollTo({

        top: document.body.scrollHeight,

        behavior: "smooth"

    });

}

    );

    );

        URL_APPS_SCRIPT,

        {

            method: "POST",

            mode: "no-cors",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify(datos)

        }

    )

        function() {

            mostrarRegistroExitoso(

            );

            console.error(error);

                "Verifique la conexión a internet."

            );

            document.getElementById(
                "tipoRegistroCard"
            ).classList.remove(

            );

/* =====================================================
   DISTANCIA HAVERSINE
===================================================== */

function calcularDistancia(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const R =
        6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );

    return R * c;

}
