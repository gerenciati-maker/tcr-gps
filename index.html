<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TORRE DE CONTROL - AUTORITAS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #071b33;
    color: #ffffff;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.header {
    background: #0b2b50;
    border-bottom: 3px solid #d4af37;
    padding: 18px;
    text-align: center;
    border-radius: 0 0 15px 15px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    color: #d4af37;
}

.header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #dce6f2;
}

.card {
    background: #0d3158;
    margin-top: 18px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
}

.card h2 {
    margin-top: 0;
    color: #d4af37;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #d4af37;
    color: #071b33;
}

.btn-secondary {
    background: #1d527f;
    color: white;
}

.btn-danger {
    background: #b72c2c;
    color: white;
}

.btn-success {
    background: #238636;
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #496b8c;
    background: #071b33;
    color: white;
    font-size: 16px;
}

.label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #dce6f2;
}

.estado {
    text-align: center;
    padding: 12px;
    margin-top: 15px;
    border-radius: 10px;
    background: #102b46;
    color: #dce6f2;
}

.exito {
    background: #165c32;
    color: #fff;
}

.error {
    background: #702020;
    color: #fff;
}

.aviso {
    background: #735b12;
    color: #fff;
}

.oculto {
    display: none !important;
}

.info {
    background: #092541;
    border-left: 4px solid #d4af37;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
}

.dato {
    margin: 7px 0;
}

.dato strong {
    color: #d4af37;
}

.foto-container {
    margin-top: 15px;
    text-align: center;
}

video,
canvas,
#previewFoto {
    width: 100%;
    max-width: 500px;
    border-radius: 10px;
    margin-top: 10px;
}

#previewFoto {
    display: none;
}

.small {
    font-size: 12px;
    color: #b9c7d6;
}

.grid-botones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

@media(max-width:600px) {
    .grid-botones {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AUTORITAS</h1>
        <p>TORRE DE CONTROL</p>
    </div>

    <div id="estadoSistema" class="estado">
        Iniciando sistema...
    </div>

    <!-- SERVICIO -->
    <div id="cardServicio" class="card oculto">

        <h2>Servicio</h2>

        <div class="info">
            <div class="dato">
                <strong>Servicio:</strong>
                <span id="nombreServicio">-</span>
            </div>

            <div class="dato">
                <strong>Inmueble:</strong>
                <span id="inmuebleServicio">-</span>
            </div>

            <div class="dato">
                <strong>Ubicación:</strong>
                <span id="ubicacionServicio">-</span>
            </div>

            <div class="dato">
                <strong>GPS:</strong>
                <span id="gpsServicio">Esperando...</span>
            </div>
        </div>

        <button
            class="btn-primary"
            onclick="seleccionarPersonal()">
            PERSONAL DEL SERVICIO
        </button>

        <button
            class="btn-secondary"
            onclick="seleccionarApoyo()">
            APOYO
        </button>

        <button
            class="btn-secondary"
            onclick="seleccionarAdministrativo()">
            ADMINISTRATIVO
        </button>

    </div>

    <!-- PERSONAL -->
    <div id="cardPersonal" class="card oculto">

        <h2>Personal</h2>

        <label class="label">
            Puesto
        </label>

        <select id="puestoPersonal" onchange="cargarPersonalPorPuesto()">
            <option value="">Seleccione puesto</option>
            <option value="GUARDIA">GUARDIA</option>
            <option value="MONITORISTA">MONITORISTA</option>
            <option value="ERI">ERI</option>
        </select>

        <label class="label">
            Personal
        </label>

        <select id="empleadoPersonal">
            <option value="">Seleccione personal</option>
        </select>

        <button
            class="btn-primary"
            onclick="continuarPersonal()">
            CONTINUAR
        </button>

        <button
            class="btn-danger"
            onclick="volverServicio()">
            REGRESAR
        </button>

    </div>

    <!-- APOYO -->
    <div id="cardApoyo" class="card oculto">

        <h2>Registro de apoyo</h2>

        <label class="label">
            Número de empleado
        </label>

        <input
            id="numeroApoyo"
            type="text"
            placeholder="Ingrese número de empleado">

        <button
            class="btn-primary"
            onclick="buscarApoyo()">
            BUSCAR
        </button>

        <div id="resultadoApoyo"></div>

        <button
            class="btn-danger"
            onclick="volverServicio()">
            REGRESAR
        </button>

    </div>

    <!-- ADMINISTRATIVO -->
    <div id="cardAdministrativo" class="card oculto">

        <h2>Registro administrativo</h2>

        <label class="label">
            Número de empleado
        </label>

        <input
            id="numeroAdministrativo"
            type="text"
            placeholder="Ingrese número de empleado">

        <button
            class="btn-primary"
            onclick="buscarAdministrativo()">
            BUSCAR
        </button>

        <div id="resultadoAdministrativo"></div>

        <button
            class="btn-danger"
            onclick="volverServicio()">
            REGRESAR
        </button>

    </div>

    <!-- REGISTRO -->
    <div id="cardRegistro" class="card oculto">

        <h2>Tipo de registro</h2>

        <div id="infoRegistro" class="info"></div>

        <div id="botonesRegistro" class="grid-botones">

            <button
                id="btnEntrada"
                class="btn-success"
                onclick="seleccionarTipoRegistro('ENTRADA')">
                ENTRADA
            </button>

            <button
                id="btnSalida"
                class="btn-secondary"
                onclick="seleccionarTipoRegistro('SALIDA')">
                SALIDA
            </button>

        </div>

        <div id="mensajeCandado" class="estado oculto"></div>

        <button
            class="btn-danger"
            onclick="volverServicio()">
            REGRESAR
        </button>

    </div>

    <!-- FOTO -->
    <div id="cardFoto" class="card oculto">

        <h2>Fotografía</h2>

        <div class="info">
            Debes tomar una fotografía para completar el registro.
        </div>

        <div class="foto-container">

            <video
                id="video"
                autoplay
                playsinline>
            </video>

            <canvas
                id="canvas"
                class="oculto">
            </canvas>

            <img
                id="previewFoto"
                alt="Vista previa">

        </div>

        <button
            class="btn-secondary"
            onclick="abrirCamara()">
            ACTIVAR CÁMARA
        </button>

        <button
            class="btn-primary"
            onclick="tomarFotografia()">
            TOMAR FOTOGRAFÍA
        </button>

        <button
            id="btnEnviar"
            class="btn-success"
            onclick="enviarRegistro()">
            ENVIAR REGISTRO
        </button>

        <button
            class="btn-danger"
            onclick="cancelarFoto()">
            CANCELAR
        </button>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ID_ARCHIVO =
    "1zdYovCmbhHOyMVy-huWqzgB6Q5x1XgL8dghe263TTbU";

const ID_BASE_QR =
    "1049929211";

const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwRaqv3bUBUzwFXjXf0yOjQldn51NkNMZiL8OaVw3n4RBCbA0raBqw9heAlbgLLgi3DSQ/exec";

const CODIGO_ADMIN = "CENTRAL";

const SERVICIO_CENTRAL =
    "ID-00167 - OFICINAS CENTRALES";


/* =========================================================
   VARIABLES
========================================================= */

let empleados = [];
let servicios = new Map();
let personalServicio = [];

let empleadoPersonalActual = null;
let servicioActual = null;

let empleadoApoyoActual = null;
let empleadoAdministrativoActual = null;

let ubicacionActual = {
    latitud: null,
    longitud: null,
    precisionGPS: null
};

let registroPendiente = null;

let fotoRegistroBase64 = "";
let fotoRegistroNombre = "";

let enviandoRegistro = false;

let consultaCandadoActual = 0;

let streamCamara = null;


/* =========================================================
   INICIO
========================================================= */

window.onload = function() {

    mostrarEstado("Cargando base de empleados...");

    cargarBaseQR();

};


/* =========================================================
   ESTADO
========================================================= */

function mostrarEstado(mensaje, tipo = "") {

    const elemento =
        document.getElementById("estadoSistema");

    if (!elemento) return;

    elemento.textContent = mensaje;

    elemento.className = "estado";

    if (tipo === "error") {
        elemento.classList.add("error");
    }

    if (tipo === "exito") {
        elemento.classList.add("exito");
    }

    if (tipo === "aviso") {
        elemento.classList.add("aviso");
    }
}


/* =========================================================
   CARGAR BASE QR
========================================================= */

function cargarBaseQR() {

    mostrarEstado(
        "Cargando base de empleados..."
    );


    const callbackName =
        "callbackBaseQR_" +
        Date.now();


    let terminado = false;


    const script =
        document.createElement("script");


    function limpiar() {

        if (
            script.parentNode
        ) {

            script.parentNode.removeChild(
                script
            );

        }


        try {

            delete window[callbackName];

        } catch (e) {

            window[callbackName] =
                undefined;

        }

    }


    const temporizador =
        setTimeout(function() {

            if (terminado) return;

            terminado = true;

            limpiar();


            mostrarEstado(
                "El Apps Script no respondió al cargar BASE_QR.",
                "error"
            );


        }, 15000);


    window[callbackName] =
        function(data) {

            if (terminado) return;


            terminado = true;

            clearTimeout(
                temporizador
            );


            try {

                if (
                    !data ||
                    data.ok !== true
                ) {

                    throw new Error(
                        data &&
                        data.error
                            ? data.error
                            : "No fue posible cargar BASE_QR."
                    );

                }


                if (
                    !Array.isArray(
                        data.empleados
                    )
                ) {

                    throw new Error(
                        "BASE_QR no devolvió empleados."
                    );

                }


                empleados =
                    data.empleados.filter(
                        function(empleado) {

                            const estatus =
                                String(

                                    empleado.estatus ||
                                    empleado.Estatus ||
                                    empleado.ESTATUS ||
                                    ""

                                )
                                .trim()
                                .toUpperCase();


                            return (
                                estatus ===
                                "ACTIVO"
                            );

                        }
                    );


                if (
                    empleados.length === 0
                ) {

                    throw new Error(
                        "BASE_QR cargó correctamente, pero no encontró empleados ACTIVO."
                    );

                }


                console.log(
                    "Empleados cargados:",
                    empleados.length
                );


                construirServicios();


                if (
                    !servicios ||
                    servicios.size === 0
                ) {

                    throw new Error(
                        "BASE_QR cargó, pero no se encontraron servicios."
                    );

                }


                limpiar();


                mostrarEstado(
                    "Base cargada. Obteniendo ubicación..."
                );


                iniciarSistema();


            } catch (error) {

                console.error(
                    error
                );


                limpiar();


                mostrarEstado(
                    error.message ||
                    "Error al procesar BASE_QR.",
                    "error"
                );

            }

        };


    const url =
        URL_APPS_SCRIPT +
        "?action=base" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    script.src =
        url;


    script.async =
        true;


    script.onerror =
        function() {

            if (terminado) return;


            terminado = true;

            clearTimeout(
                temporizador
            );


            limpiar();


            mostrarEstado(
                "No fue posible conectar con Apps Script.",
                "error"
            );

        };


    document.body.appendChild(
        script
    );

}

/* =========================================================
   CONSTRUIR SERVICIOS
========================================================= */

function construirServicios() {

    servicios.clear();

    empleados.forEach(empleado => {

        const codigo =
            String(
                empleado.codigoServicio ||
                empleado.codigo ||
                empleado.servicioCodigo ||
                ""
            ).trim();

        const nombre =
            String(
                empleado.servicio ||
                empleado.nombreServicio ||
                ""
            ).trim();

        if (!codigo && !nombre) return;

        const clave = codigo || nombre;

        if (!servicios.has(clave)) {

            servicios.set(clave, {

                codigoServicio: codigo,

                servicio:
                    nombre || codigo,

                inmueble:
                    empleado.inmueble || "",

                ubicacion:
                    empleado.ubicacion || "",

                latitud:
                    parseFloat(empleado.latitud) || null,

                longitud:
                    parseFloat(empleado.longitud) || null,

                radio:
                    parseFloat(empleado.radio) || 200

            });

        }

    });

}


/* =========================================================
   INICIAR SISTEMA
========================================================= */

function iniciarSistema() {

    mostrarEstado(
        "Base cargada. Obteniendo ubicación..."
    );

    obtenerGPS();

}


/* =========================================================
   GPS
========================================================= */

function obtenerGPS() {

    if (!navigator.geolocation) {

        mostrarEstado(
            "Este dispositivo no permite obtener ubicación.",
            "error"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            ubicacionActual.latitud =
                position.coords.latitude;

            ubicacionActual.longitud =
                position.coords.longitude;

            ubicacionActual.precisionGPS =
                position.coords.accuracy;


            document.getElementById(
                "gpsServicio"
            ).textContent =
                ubicacionActual.latitud.toFixed(6) +
                ", " +
                ubicacionActual.longitud.toFixed(6);


            identificarServicio();

        },

        function(error) {

            console.error(error);

            mostrarEstado(
                "No fue posible obtener GPS. Activa la ubicación del dispositivo.",
                "error"
            );

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


/* =========================================================
   IDENTIFICAR SERVICIO
========================================================= */

function identificarServicio() {

    let servicioMasCercano = null;
    let distanciaMenor = Infinity;


    servicios.forEach(servicio => {

        if (
            servicio.latitud === null ||
            servicio.longitud === null
        ) {
            return;
        }


        const distancia =
            calcularDistancia(

                ubicacionActual.latitud,
                ubicacionActual.longitud,

                servicio.latitud,
                servicio.longitud

            );


        if (
            distancia <
            (servicio.radio || 200) &&
            distancia <
            distanciaMenor
        ) {

            distanciaMenor = distancia;

            servicioMasCercano =
                servicio;

        }

    });


    if (!servicioMasCercano) {

        mostrarEstado(
            "No se identificó un servicio en esta ubicación.",
            "error"
        );

        return;

    }


    entrarAlServicio(servicioMasCercano);

}


/* =========================================================
   DISTANCIA GPS
========================================================= */

function calcularDistancia(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;

}


/* =========================================================
   ENTRAR AL SERVICIO
========================================================= */

function entrarAlServicio(servicio) {

    servicioActual =
        servicio;


    document.getElementById(
        "nombreServicio"
    ).textContent =
        servicio.servicio || "-";


    document.getElementById(
        "inmuebleServicio"
    ).textContent =
        servicio.inmueble || "-";


    document.getElementById(
        "ubicacionServicio"
    ).textContent =
        servicio.ubicacion || "-";


    document.getElementById(
        "gpsServicio"
    ).textContent =
        ubicacionActual.latitud.toFixed(6) +
        ", " +
        ubicacionActual.longitud.toFixed(6);


    ocultarTodasLasTarjetas();

    document.getElementById(
        "cardServicio"
    ).classList.remove("oculto");


    mostrarEstado(
        "Servicio identificado correctamente.",
        "exito"
    );

}


/* =========================================================
   PERSONAL
========================================================= */

function seleccionarPersonal() {

    ocultarTodasLasTarjetas();

    document.getElementById(
        "cardPersonal"
    ).classList.remove("oculto");

}


function cargarPersonalPorPuesto() {

    const puesto =
        document.getElementById(
            "puestoPersonal"
        ).value
        .trim()
        .toUpperCase();


    const select =
        document.getElementById(
            "empleadoPersonal"
        );


    select.innerHTML =
        '<option value="">Seleccione personal</option>';


    if (!puesto || !servicioActual) {
        return;
    }


    personalServicio =
        empleados.filter(empleado => {

            const puestoEmpleado =
                String(
                    empleado.posicion ||
                    empleado.puesto ||
                    ""
                )
                .trim()
                .toUpperCase();


            const servicioEmpleado =
                String(
                    empleado.codigoServicio ||
                    empleado.servicioCodigo ||
                    ""
                ).trim();


            const servicioActualCodigo =
                String(
                    servicioActual.codigoServicio ||
                    ""
                ).trim();


            return (
                puestoEmpleado === puesto &&
                servicioEmpleado === servicioActualCodigo
            );

        });


    personalServicio.forEach(empleado => {

        const option =
            document.createElement("option");

        option.value =
            empleado.numeroEmpleado ||
            empleado.numero ||
            empleado["numero de empleado"] ||
            "";

        option.textContent =
            empleado.nombre ||
            empleado.nombreCompleto ||
            "SIN NOMBRE";


        select.appendChild(option);

    });

}


function continuarPersonal() {

    const numero =
        document.getElementById(
            "empleadoPersonal"
        ).value;


    if (!numero) {

        alert(
            "Selecciona un empleado."
        );

        return;

    }


    empleadoPersonalActual =
        empleados.find(empleado => {

            const numeroEmpleado =
                String(
                    empleado.numeroEmpleado ||
                    empleado.numero ||
                    empleado["numero de empleado"] ||
                    ""
                ).trim();

            return numeroEmpleado ===
                String(numero).trim();

        });


    if (!empleadoPersonalActual) {

        alert(
            "No se encontró el empleado."
        );

        return;

    }


    abrirFormulario(
        empleadoPersonalActual
    );

}


/* =========================================================
   APOYO
========================================================= */

function seleccionarApoyo() {

    ocultarTodasLasTarjetas();

    document.getElementById(
        "cardApoyo"
    ).classList.remove("oculto");

}


function buscarApoyo() {

    const numero =
        document.getElementById(
            "numeroApoyo"
        ).value
        .trim();


    if (!numero) {

        alert(
            "Ingresa el número de empleado."
        );

        return;

    }


    const resultados =
        empleados.filter(empleado => {

            const numeroEmpleado =
                String(
                    empleado.numeroEmpleado ||
                    empleado.numero ||
                    empleado["numero de empleado"] ||
                    ""
                ).trim();

            return numeroEmpleado === numero;

        });


    const contenedor =
        document.getElementById(
            "resultadoApoyo"
        );


    if (!resultados.length) {

        contenedor.innerHTML =
            '<div class="estado error">Empleado no encontrado.</div>';

        return;

    }


    if (resultados.length === 1) {

        empleadoApoyoActual =
            resultados[0];

        contenedor.innerHTML =
            '<div class="info">' +
            '<strong>' +
            (resultados[0].nombre ||
            resultados[0].nombreCompleto ||
            "") +
            '</strong><br>' +
            'Número: ' +
            numero +
            '</div>' +

            '<button class="btn-primary" onclick="continuarApoyo()">' +
            'CONTINUAR' +
            '</button>';

        return;

    }


    let html =
        '<label class="label">Seleccione empleado</label>' +
        '<select id="selectApoyo">';

    resultados.forEach((empleado, indice) => {

        html +=
            '<option value="' +
            indice +
            '">' +
            (
                empleado.nombre ||
                empleado.nombreCompleto ||
                "SIN NOMBRE"
            ) +
            '</option>';

    });

    html +=
        '</select>' +

        '<button class="btn-primary" onclick="seleccionarApoyoDuplicado()">' +
        'CONTINUAR' +
        '</button>';

    contenedor.innerHTML =
        html;


    window.resultadosApoyo =
        resultados;

}


function seleccionarApoyoDuplicado() {

    const indice =
        document.getElementById(
            "selectApoyo"
        ).value;


    empleadoApoyoActual =
        window.resultadosApoyo[indice];


    continuarApoyo();

}


function continuarApoyo() {

    if (!empleadoApoyoActual) {

        alert(
            "Selecciona un empleado."
        );

        return;

    }


    abrirFormulario(
        empleadoApoyoActual,
        "APOYO"
    );

}


/* =========================================================
   ADMINISTRATIVO
========================================================= */

function seleccionarAdministrativo() {

    ocultarTodasLasTarjetas();

    document.getElementById(
        "cardAdministrativo"
    ).classList.remove("oculto");

}


function buscarAdministrativo() {

    const numero =
        document.getElementById(
            "numeroAdministrativo"
        ).value
        .trim();


    if (!numero) {

        alert(
            "Ingresa el número de empleado."
        );

        return;

    }


    const empleado =
        empleados.find(persona => {

            const numeroEmpleado =
                String(
                    persona.numeroEmpleado ||
                    persona.numero ||
                    persona["numero de empleado"] ||
                    ""
                ).trim();

            const puesto =
                String(
                    persona.posicion ||
                    persona.puesto ||
                    ""
                )
                .trim()
                .toUpperCase();


            return (
                numeroEmpleado === numero &&
                puesto === "ADMINISTRATIVO"
            );

        });


    const contenedor =
        document.getElementById(
            "resultadoAdministrativo"
        );


    if (!empleado) {

        contenedor.innerHTML =
            '<div class="estado error">' +
            'No se encontró un empleado administrativo con ese número.' +
            '</div>';

        return;

    }


    empleadoAdministrativoActual =
        empleado;


    contenedor.innerHTML =
        '<div class="info">' +

        '<strong>' +
        (
            empleado.nombre ||
            empleado.nombreCompleto ||
            ""
        ) +
        '</strong><br>' +

        'Número: ' +
        numero +

        '</div>' +

        '<button class="btn-primary" onclick="continuarAdministrativo()">' +
        'CONTINUAR' +
        '</button>';

}


function continuarAdministrativo() {

    if (!empleadoAdministrativoActual) {

        alert(
            "Selecciona un empleado."
        );

        return;

    }


    abrirFormulario(
        empleadoAdministrativoActual,
        "ADMINISTRATIVO"
    );

}


/* =========================================================
   ABRIR FORMULARIO
========================================================= */

function abrirFormulario(
    empleado,
    tipoPersonal = "PERSONAL"
) {

    if (!empleado) {

        alert(
            "No se encontró información del empleado."
        );

        return;

    }


    const nombre =
        empleado.nombre ||
        empleado.nombreCompleto ||
        "";


    const numero =
        String(
            empleado.numeroEmpleado ||
            empleado.numero ||
            empleado["numero de empleado"] ||
            ""
        ).trim();


    const posicion =
        String(
            empleado.posicion ||
            empleado.puesto ||
            tipoPersonal
        ).trim();


    let servicioRegistro =
        servicioActual
            ? servicioActual.servicio
            : "";


    if (
        tipoPersonal === "ADMINISTRATIVO"
    ) {

        servicioRegistro =
            SERVICIO_CENTRAL;

    }


    registroPendiente = {

        nombre: nombre,

        numeroEmpleado: numero,

        servicio: servicioRegistro,

        posicion: posicion,

        tipoPersonal: tipoPersonal,

        latitud:
            ubicacionActual.latitud,

        longitud:
            ubicacionActual.longitud,

        precisionGPS:
            ubicacionActual.precisionGPS,

        servicioDetectado:
            servicioActual
                ? servicioActual.servicio
                : "",

        servicioOrigen:
            servicioActual
                ? servicioActual.codigoServicio
                : ""

    };


    fotoRegistroBase64 = "";
    fotoRegistroNombre = "";


    prepararConsultaCandado();


    ocultarTodasLasTarjetas();

    document.getElementById(
        "cardRegistro"
    ).classList.remove("oculto");


    document.getElementById(
        "infoRegistro"
    ).innerHTML =

        "<div class='dato'><strong>Nombre:</strong> " +
        nombre +
        "</div>" +

        "<div class='dato'><strong>Empleado:</strong> " +
        numero +
        "</div>" +

        "<div class='dato'><strong>Puesto:</strong> " +
        posicion +
        "</div>" +

        "<div class='dato'><strong>Servicio:</strong> " +
        servicioRegistro +
        "</div>";


    consultarCandadoEmpleado(
        numero,
        posicion,
        function(resultado, numeroConsulta) {

            if (
                numeroConsulta !==
                consultaCandadoActual
            ) {
                return;
            }

            procesarResultadoCandado(
                resultado
            );

        }
    );

}


/* =========================================================
   CANDADO
========================================================= */

function prepararConsultaCandado() {

    consultaCandadoActual++;

    document.getElementById(
        "btnEntrada"
    ).disabled = true;

    document.getElementById(
        "btnSalida"
    ).disabled = true;


    const mensaje =
        document.getElementById(
            "mensajeCandado"
        );

    mensaje.className =
        "estado aviso";

    mensaje.textContent =
        "Consultando último registro...";

    mensaje.classList.remove(
        "oculto"
    );

}


function consultarCandadoEmpleado(
    numero,
    puesto,
    callback
) {

    const callbackName =
        "callbackCandado_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 10000
        );


    let terminado = false;


    window[callbackName] =
        function(resultado) {

            if (terminado) return;

            terminado = true;

            limpiar();

            callback(
                resultado,
                consultaCandadoActual
            );

        };


    const script =
        document.createElement("script");


    function limpiar() {

        if (script.parentNode) {
            script.parentNode.removeChild(script);
        }

        try {
            delete window[callbackName];
        } catch (e) {
            window[callbackName] = undefined;
        }

    }


    const timeout =
        setTimeout(function() {

            if (terminado) return;

            terminado = true;

            limpiar();


            callback(
                {
                    ok: false,
                    error:
                        "No fue posible consultar el candado."
                },
                consultaCandadoActual
            );


        }, 10000);


    const url =
        URL_APPS_SCRIPT +
        "?action=validar" +
        "&numero=" +
        encodeURIComponent(numero) +
        "&posicion=" +
        encodeURIComponent(puesto) +
        "&callback=" +
        encodeURIComponent(callbackName);


    script.src = url;

    script.async = true;


    document.body.appendChild(
        script
    );


    const originalCallback =
        window[callbackName];


    window[callbackName] =
        function(resultado) {

            clearTimeout(timeout);

            if (terminado) return;

            terminado = true;

            limpiar();

            originalCallback(
                resultado
            );

        };

}


function procesarResultadoCandado(
    resultado
) {

    const mensaje =
        document.getElementById(
            "mensajeCandado"
        );


    if (
        !resultado ||
        resultado.ok !== true
    ) {

        document.getElementById(
            "btnEntrada"
        ).disabled = false;

        document.getElementById(
            "btnSalida"
        ).disabled = false;


        mensaje.className =
            "estado error";

        mensaje.textContent =
            "No fue posible validar el último registro. Intenta nuevamente.";

        return;

    }


    const siguiente =
        String(
            resultado.siguienteRegistro ||
            ""
        )
        .trim()
        .toUpperCase();


    if (siguiente === "ENTRADA") {

        document.getElementById(
            "btnEntrada"
        ).disabled = false;

        document.getElementById(
            "btnSalida"
        ).disabled = true;


        mensaje.className =
            "estado aviso";

        mensaje.textContent =
            "Puedes realizar ENTRADA.";

        return;

    }


    if (siguiente === "SALIDA") {

        document.getElementById(
            "btnEntrada"
        ).disabled = true;

        document.getElementById(
            "btnSalida"
        ).disabled = false;


        mensaje.className =
            "estado aviso";

        mensaje.textContent =
            "Tienes una ENTRADA pendiente. Debes realizar SALIDA.";

        return;

    }


    if (siguiente === "CUALQUIERA") {

        document.getElementById(
            "btnEntrada"
        ).disabled = false;

        document.getElementById(
            "btnSalida"
        ).disabled = false;


        mensaje.className =
            "estado aviso";

        mensaje.textContent =
            "Personal con excepción de candado.";

        return;

    }


    document.getElementById(
        "btnEntrada"
    ).disabled = false;

    document.getElementById(
        "btnSalida"
    ).disabled = false;

}


/* =========================================================
   TIPO DE REGISTRO
========================================================= */

function seleccionarTipoRegistro(
    tipo
) {

    if (!registroPendiente) {

        alert(
            "No existe un registro pendiente."
        );

        return;

    }


    registroPendiente.tipoRegistro =
        tipo;


    ocultarTodasLasTarjetas();


    document.getElementById(
        "cardFoto"
    ).classList.remove(
        "oculto"
    );


    abrirCamara();

}


/* =========================================================
   CÁMARA
========================================================= */

async function abrirCamara() {

    try {

        if (streamCamara) {

            streamCamara
                .getTracks()
                .forEach(track =>
                    track.stop()
                );

        }


        streamCamara =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: "user"
                    },

                    audio: false

                });


        const video =
            document.getElementById(
                "video"
            );


        video.srcObject =
            streamCamara;


    } catch (error) {

        console.error(error);

        alert(
            "No fue posible activar la cámara."
        );

    }

}


/* =========================================================
   TOMAR FOTO
========================================================= */

function tomarFotografia() {

    const video =
        document.getElementById(
            "video"
        );

    const canvas =
        document.getElementById(
            "canvas"
        );

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        alert(
            "Activa la cámara antes de tomar la fotografía."
        );

        return;

    }


    let ancho =
        video.videoWidth;

    let alto =
        video.videoHeight;


    const maximo =
        1200;


    if (ancho > maximo) {

        alto =
            alto *
            maximo /
            ancho;

        ancho =
            maximo;

    }


    canvas.width =
        ancho;

    canvas.height =
        alto;


    const contexto =
        canvas.getContext("2d");


    contexto.drawImage(
        video,
        0,
        0,
        ancho,
        alto
    );


    fotoRegistroBase64 =
        canvas.toDataURL(
            "image/jpeg",
            0.72
        );


    fotoRegistroNombre =
        "foto_" +
        Date.now() +
        ".jpg";


    const preview =
        document.getElementById(
            "previewFoto"
        );


    preview.src =
        fotoRegistroBase64;

    preview.style.display =
        "block";


    if (streamCamara) {

        streamCamara
            .getTracks()
            .forEach(track =>
                track.stop()
            );

    }

}


/* =========================================================
   ENVIAR REGISTRO
========================================================= */

async function enviarRegistro() {

    if (enviandoRegistro) {
        return;
    }


    if (!registroPendiente) {

        alert(
            "No existe información para registrar."
        );

        return;

    }


    if (!fotoRegistroBase64) {

        alert(
            "Debes tomar una fotografía."
        );

        return;

    }


    enviandoRegistro = true;


    const boton =
        document.getElementById(
            "btnEnviar"
        );


    boton.disabled = true;

    boton.textContent =
        "ENVIANDO...";


    const datos = {

        fecha:
            new Date().toLocaleDateString(
                "es-MX"
            ),

        hora:
            new Date().toLocaleTimeString(
                "es-MX"
            ),

        fechaHora:
            new Date().toISOString(),

        nombre:
            registroPendiente.nombre,

        numeroEmpleado:
            registroPendiente.numeroEmpleado,

        servicio:
            registroPendiente.servicio,

        tipoRegistro:
            registroPendiente.tipoRegistro,

        posicion:
            registroPendiente.posicion,

        latitud:
            registroPendiente.latitud,

        longitud:
            registroPendiente.longitud,

        precisionGPS:
            registroPendiente.precisionGPS,

        servicioDetectado:
            registroPendiente.servicioDetectado,

        servicioOrigen:
            registroPendiente.servicioOrigen,

        resultado:
            "REGISTRO OK",

        fotoBase64:
            fotoRegistroBase64,

        fotoNombre:
            fotoRegistroNombre

    };


    try {

        await fetch(
            URL_APPS_SCRIPT,
            {

                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(datos)

            }
        );


        mostrarRegistroExitoso();


    } catch (error) {

        console.error(error);


        enviandoRegistro =
            false;

        boton.disabled =
            false;

        boton.textContent =
            "ENVIAR REGISTRO";


        alert(
            "No fue posible enviar el registro."
        );

    }

}


/* =========================================================
   REGISTRO EXITOSO
========================================================= */

function mostrarRegistroExitoso() {

    if (streamCamara) {

        streamCamara
            .getTracks()
            .forEach(track =>
                track.stop()
            );

    }


    ocultarTodasLasTarjetas();


    mostrarEstado(
        "REGISTRO ENVIADO CORRECTAMENTE.",
        "exito"
    );


    const card =
        document.getElementById(
            "cardServicio"
        );

    card.classList.remove(
        "oculto"
    );


    enviandoRegistro =
        false;


    registroPendiente =
        null;


    fotoRegistroBase64 =
        "";

    fotoRegistroNombre =
        "";


    document.getElementById(
        "previewFoto"
    ).style.display =
        "none";


    document.getElementById(
        "btnEnviar"
    ).disabled =
        false;


    document.getElementById(
        "btnEnviar"
    ).textContent =
        "ENVIAR REGISTRO";

}


/* =========================================================
   REGRESAR
========================================================= */

function volverServicio() {

    consultaCandadoActual++;

    ocultarTodasLasTarjetas();

    document.getElementById(
        "cardServicio"
    ).classList.remove(
        "oculto"
    );

}


/* =========================================================
   OCULTAR TARJETAS
========================================================= */

function ocultarTodasLasTarjetas() {

    const tarjetas = [

        "cardServicio",
        "cardPersonal",
        "cardApoyo",
        "cardAdministrativo",
        "cardRegistro",
        "cardFoto"

    ];


    tarjetas.forEach(id => {

        const elemento =
            document.getElementById(id);

        if (elemento) {

            elemento.classList.add(
                "oculto"
            );

        }

    });

}


/* =========================================================
   CANCELAR FOTO
========================================================= */

function cancelarFoto() {

    if (streamCamara) {

        streamCamara
            .getTracks()
            .forEach(track =>
                track.stop()
            );

    }


    registroPendiente =
        null;

    fotoRegistroBase64 =
        "";

    fotoRegistroNombre =
        "";


    volverServicio();

}
