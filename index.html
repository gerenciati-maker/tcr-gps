<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Asistencia - TCR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f4f6f8;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;

      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
    }

    .servicio {
      margin: 25px 0;
      padding: 15px;
      background: #eef3f8;
      border-radius: 10px;
    }

    .servicio strong {
      font-size: 20px;
    }

    #estado {
      margin: 25px 0;

      margin: 20px 0;

    }

    .boton {
      display: inline-block;
      padding: 15px 25px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>CONTROL DE ASISTENCIA</h1>
  <h2>TCR</h2>

  <div class="servicio">

    <div>SERVICIO</div>

    <strong id="nombreServicio">
      TCR
    </strong>

    <br><br>

    <div>
      RADIO PERMITIDO:
      <strong id="rango">
        100 metros
      </strong>
    </div>

  </div>

  <div id="estado">
    📍 Obteniendo ubicación...
  </div>

  <div id="resultado"></div>

  <br>

  <a
    id="formulario"
    class="boton"
    href="#"
    style="display:none;"
  >
    CONTINUAR AL REGISTRO
  </a>

</div>


<script>

/* =====================================================
   SERVICIO TCR
   ===================================================== */

const SERVICIO = {
  nombre: "TCR",
  lat: 19.025274494954676,
  lon: -98.26069346300481,
  rango: 100
};


/* =====================================================
   ELEMENTOS DE PANTALLA
   ===================================================== */

const nombreServicio =
  document.getElementById("nombreServicio");

const rango =
  document.getElementById("rango");

const estado =
  document.getElementById("estado");

const resultado =
  document.getElementById("resultado");

const formulario =
  document.getElementById("formulario");


nombreServicio.textContent =
  SERVICIO.nombre;

rango.textContent =
  SERVICIO.rango + " metros";


/* =====================================================
   CALCULAR DISTANCIA
   ===================================================== */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const dLat =
    (lat2 - lat1) * Math.PI / 180;

  const dLon =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(lat1 * Math.PI / 180) *

    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLon / 2) ** 2;

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =====================================================
   OBTENER UBICACIÓN
   ===================================================== */

function obtenerUbicacion() {

  if (!navigator.geolocation) {

    estado.innerHTML =
      "⚠️ Este navegador no permite obtener ubicación.";

    resultado.innerHTML =
      "No es posible validar la ubicación.";

    formulario.style.display =
      "none";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const precision =
        position.coords.accuracy;


      /* Calcular distancia */

      const distancia =
        distanciaMetros(
          lat,
          lon,
          SERVICIO.lat,
          SERVICIO.lon
        );


      const distanciaRedondeada =
        Math.round(distancia);


      estado.innerHTML =
        "📍 Ubicación obtenida";


      /* =================================================
         DENTRO DEL RANGO
         ================================================= */

      if (distancia <= SERVICIO.rango) {

        resultado.innerHTML =

          "✅ <strong>DENTRO DEL RANGO</strong><br>" +

          "Distancia aproximada: " +

          distanciaRedondeada +

          " metros<br>" +

          "Precisión GPS: ±" +

          Math.round(precision) +

          " metros";


        formulario.style.display =
          "inline-block";

      }


      /* =================================================
         FUERA DEL RANGO
         ================================================= */

      else {

        resultado.innerHTML =

          "⚠️ <strong>FUERA DEL RANGO</strong><br>" +

          "Distancia aproximada: " +

          distanciaRedondeada +

          " metros<br>" +

          "Radio permitido: " +

          SERVICIO.rango +

          " metros<br>" +

          "Precisión GPS: ±" +

          Math.round(precision) +

          " metros";


        /*
         * DURANTE EL PILOTO:
         * dejamos continuar aunque esté fuera
         * para poder comprobar el funcionamiento.
         */

        formulario.style.display =
          "inline-block";

      }

    },


    /* =================================================
       ERROR DE UBICACIÓN
       ================================================= */

    function(error) {

      estado.innerHTML =
        "⚠️ No se pudo obtener la ubicación.";

      resultado.innerHTML =
        "Activa la ubicación del teléfono y vuelve a intentarlo.";

      formulario.style.display =
        "none";

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =====================================================
   GOOGLE FORMS
   ===================================================== */

const urlFormulario =
  "https://docs.google.com/forms/d/e/1FAIpQLSeKDOEdUlS75ivHlBWG4qVo-PdaL8KLWBa3GM9IYbX6I6ptnQ/viewform?usp=dialog";


formulario.href =
  urlFormulario;


/* =====================================================
   INICIAR VALIDACIÓN
   ===================================================== */

obtenerUbicacion();

</script>

</body>
</html>
